name: 'Docker promote'
description: 'Promote docker image by retagging and pushing'
inputs:
  registry:
    description: 'Docker registry (e.g. 123456789.dkr.ecr.us-east-1.amazonaws.com)'
    required: true
  image_name:
    description: "Image name (e.g. blaze-prod-app/api)"
    required: true
  source_tag:
    required: true
    description: "Source tag to pull (e.g. sha-123abcde)"
  target_tag:
    required: true
    description: "Target tag to push (e.g. release-v1.0.0)"
  
runs:
  using: "composite"
  steps:
    - name: Promote
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        IMAGE_NAME: ${{ inputs.image_name }}
        SOURCE_TAG: ${{ inputs.source_tag }}
        TARGET_TAG: ${{ inputs.target_tag }}
      run: |
        set -euo pipefail
        # GitHub does not enforce composite-action `required: true` at runtime — validate explicitly.
        for v in REGISTRY IMAGE_NAME SOURCE_TAG TARGET_TAG; do
          if [ -z "${!v:-}" ]; then
            echo "❌ ERROR: required input '$v' is empty"; exit 1
          fi
        done
        FULL_IMAGE="${REGISTRY}/${IMAGE_NAME}"
        SOURCE="${FULL_IMAGE}:${SOURCE_TAG}"
        TARGET="${FULL_IMAGE}:${TARGET_TAG}"
        
        echo "🐳 Promoting Image..."
        echo "   From: $SOURCE"
        echo "   To:   $TARGET"
        
        docker pull "$SOURCE"
        docker tag "$SOURCE" "$TARGET"
        docker push "$TARGET"
        
        echo "✅ Promotion Complete."
