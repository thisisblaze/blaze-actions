name: "Calculate Configuration"
description: "Determines Terraform stack, directory, and state key based on inputs"
inputs:
  environment:
    description: "Target environment (DEV, STAGE, PROD)"
    required: true
  terraform_stack:
    description: "Selected Terraform Stack"
    required: true
  branch_name:
    description: "Feature Branch Name"
    required: false
  deploy_infra:
    description: "Deploy Infra Flag"
    required: true
  build_images:
    description: "Build Images Flag"
    required: true
  deploy_services:
    description: "Deploy Services Flag"
    required: true
  event_name:
    description: "GitHub Event Name"
    required: true
  cluster_tier:
    description: "MongoDB Cluster Tier"
    required: false
    default: "auto"
  project:
    description: "Target Project (e.g. thisisblaze)"
    required: false
    default: "thisisblaze" # Default to existing for migration
  cloud_provider:
    description: "Cloud Provider override (aws/gcp/azure). If set, overrides CLOUD_PROVIDER from config."
    required: false
    default: ""
  external_src:
    description: "Path to a checked-out external family-repo source (kind: external, Plan 199). Empty = local (config in this repo)."
    required: false
    default: ""
  config_path:
    description: "Path to the per-site blaze-env.json within external_src (relative). Required when external_src is set."
    required: false
    default: ""

outputs:
  env_val:
    description: "Environment Value"
    value: ${{ steps.config.outputs.env_val }}
  tf_dir:
    description: "Terraform Directory"
    value: ${{ steps.config.outputs.tf_dir }}
  bucket:
    description: "S3 Bucket Name"
    value: ${{ steps.config.outputs.bucket }}
  lock_table:
    description: "DynamoDB Lock Table"
    value: ${{ steps.config.outputs.lock_table }}
  state_key:
    description: "Terraform State Key"
    value: ${{ steps.config.outputs.state_key }}
  stage_key:
    description: "Stage Key (dev/stage/prod)"
    value: ${{ steps.config.outputs.stage_key }}
  should_build:
    description: "Should Build Images?"
    value: ${{ steps.config.outputs.should_build }}
  should_deploy_app:
    description: "Should Deploy App?"
    value: ${{ steps.config.outputs.should_deploy_app }}
  client_key:
    description: "Client Key"
    value: ${{ steps.config.outputs.client_key }}
  project_key:
    description: "Project Key"
    value: ${{ steps.config.outputs.project_key }}
  image_project_key:
    description: "Project Key used for Images (clean slate, Plan 199: always PROJECT_KEY)"
    value: ${{ steps.config.outputs.image_project_key }}
  namespace:
    description: "Namespace"
    value: ${{ steps.config.outputs.namespace }}
  platform:
    description: "Cloud Platform"
    value: ${{ steps.config.outputs.platform }}
  cloud_provider:
    description: "Cloud Provider (aws/gcp/azure)"
    value: ${{ steps.config.outputs.cloud_provider }}
  cloud_region:
    description: "Cloud Region (provider-specific)"
    value: ${{ steps.config.outputs.cloud_region }}
  infra_prefix:
    description: "Infrastructure directory prefix (.github/{provider}/infra/live)"
    value: ${{ steps.config.outputs.infra_prefix }}
  gcp_project_id:
    description: "GCP Project ID"
    value: ${{ steps.config.outputs.gcp_project_id }}
  aws_region:
    description: "AWS Region"
    value: ${{ steps.config.outputs.aws_region }}
  domain_root:
    description: "Domain Root"
    value: ${{ steps.config.outputs.domain_root }}
  beta:
    description: "Beta Flag"
    value: ${{ steps.config.outputs.beta }}
  gtm_id:
    description: "GTM ID"
    value: ${{ steps.config.outputs.gtm_id }}
  aws_account_id:
    description: "AWS Account ID"
    value: ${{ steps.config.outputs.aws_account_id }}
  config_env:
    description: "Config Environment (UPPERCASE)"
    value: ${{ steps.config.outputs.config_env }}
  gcp_docker_repo:
    description: "GCP Artifact Registry repository name for Docker images (accounts for multi-site TF naming)"
    value: ${{ steps.config.outputs.gcp_docker_repo }}
  azure_acr_name:
    description: "Computed Azure Container Registry name (no dashes, max 24 chars)"
    value: ${{ steps.config.outputs.azure_acr_name }}
  cluster_name:
    description: "ECS Cluster Name"
    value: ${{ steps.config.outputs.cluster_name }}
  cluster_tier:
    description: "MongoDB Cluster Tier"
    value: ${{ steps.config.outputs.cluster_tier }}
  db_ssm_path:
    description: "Database SSM Path"
    value: ${{ steps.config.outputs.db_ssm_path }}
  admin_bucket:
    description: "Admin S3 Bucket Name"
    value: ${{ steps.config.outputs.admin_bucket }}
  project_slug:
    description: "Multi-tenant subdomain slug (empty for primary project, e.g. 'support' for sub-projects)"
    value: ${{ steps.config.outputs.project_slug }}
  db_tier:
    description: "Database tier provisioned mapping"
    value: ${{ steps.config.outputs.db_tier }}
  ecs_compute_tier:
    description: "ECS Compute Node Mapping Tier"
    value: ${{ steps.config.outputs.ecs_compute_tier }}
  cloudflare_zone_id_key:
    description: "Cloudflare Zone ID Secret Key Mapping"
    value: ${{ steps.config.outputs.cloudflare_zone_id_key }}
  dedicated_alb:
    description: "Dedicated ALB Flag"
    value: ${{ steps.config.outputs.dedicated_alb }}
  dedicated_waf:
    description: "Dedicated WAF Flag"
    value: ${{ steps.config.outputs.dedicated_waf }}
  elastic_tier:
    description: "Elasticsearch tier provisioned mapping"
    value: ${{ steps.config.outputs.elastic_tier }}
  workers_json:
    description: "Background Workers Configuration (JSON)"
    value: ${{ steps.config.outputs.workers_json }}
  stack_id:
    description: "Stack UUID for precise resource targeting"
    value: ${{ steps.config.outputs.stack_id }}
  project_tier:
    description: "Project Capacity Tier"
    value: ${{ steps.config.outputs.project_tier }}
  pod:
    description: "Infrastructure Placement Pod"
    value: ${{ steps.config.outputs.pod }}
  build_root:
    description: "Docker/npm build root (Plan 199): external_src for kind: external, else '.'"
    value: ${{ steps.config.outputs.build_root }}

runs:
  using: "composite"
  steps:
    - name: "Calculate Configuration"
      id: config
      shell: bash
      run: |
        GLOBAL_CONFIG="vars/blaze-env.json"

        INPUT_PROJECT="${{ inputs.project }}"
        if [[ -z "$INPUT_PROJECT" ]]; then
           INPUT_PROJECT="thisisblaze"
        fi

        EXTERNAL_SRC="${{ inputs.external_src }}"
        CONFIG_PATH="${{ inputs.config_path }}"
        if [[ -n "$EXTERNAL_SRC" ]]; then
           if [[ -z "$CONFIG_PATH" ]]; then
              echo "❌ ERROR: external_src set but config_path empty (required for kind: external)."
              exit 1
           fi
           PROJECT_CONFIG="$EXTERNAL_SRC/$CONFIG_PATH"
           PROJECTS_DIR="$EXTERNAL_SRC/projects"
           BUILD_ROOT="$EXTERNAL_SRC"
           echo "📦 External source: $EXTERNAL_SRC (config: $CONFIG_PATH)"
        else
           PROJECT_CONFIG="vars/$INPUT_PROJECT/blaze-env.json"
           PROJECTS_DIR="projects"
           BUILD_ROOT="."
        fi

        if ! test -f "$GLOBAL_CONFIG"; then
          echo "❌ ERROR: Global config $GLOBAL_CONFIG not found"
          exit 1
        fi

        VARS_EXISTS=false
        PROJECTS_EXISTS=false

        if test -f "$PROJECT_CONFIG"; then VARS_EXISTS=true; fi
        if test -d "$PROJECTS_DIR/$INPUT_PROJECT"; then PROJECTS_EXISTS=true; fi

        if [[ "$VARS_EXISTS" == "false" ]]; then
           echo "❌ ERROR: Project '$INPUT_PROJECT' is invalid or incomplete."
           echo "   - Missing Config: $PROJECT_CONFIG"
           
           echo ""
           echo "🌟 Available Projects (detected in vars/):"
           for d in vars/*/; do
             if [[ -f "${d}blaze-env.json" ]]; then
                echo "   - $(basename "$d")"
             fi
           done
           exit 1
        fi

        if [[ "$PROJECTS_EXISTS" == "false" ]]; then
              echo "⚠️  WARNING: Directory $PROJECTS_DIR/$INPUT_PROJECT not found."
              echo "    Infrastructure overrides in $PROJECTS_DIR/$INPUT_PROJECT will not be loaded."
        fi

        MERGED_CONFIG=$(jq -s '.[0] * .[1]' "$GLOBAL_CONFIG" "$PROJECT_CONFIG")

        if [[ "${{ inputs.event_name }}" == "repository_dispatch" ]]; then
          ENV_VAL="${{ inputs.environment }}"
          IS_DISPATCH="true"
        else
          ENV_VAL="${{ inputs.environment }}"
          IS_DISPATCH="false"
        fi
        STAGE_KEY=$(echo "$ENV_VAL" | tr '[:upper:]' '[:lower:]')
        CONFIG_ENV=$(echo "$ENV_VAL" | tr '[:lower:]' '[:upper:]')

        CLIENT_KEY=$(echo "$MERGED_CONFIG" | jq -r '.common.CLIENT_KEY // "b9"')
        PROJECT_KEY=$(echo "$MERGED_CONFIG" | jq -r '.common.PROJECT_KEY // "blaze-actions-test"')
        NAMESPACE=$(echo "$MERGED_CONFIG" | jq -r '.common.NAMESPACE // "blaze"')
        PLATFORM=$(echo "$MERGED_CONFIG" | jq -r '.common.CLOUD_PLATFORM')
        AWS_REGION=$(echo "$MERGED_CONFIG" | jq -r '.common.AWS_REGION')
        DOMAIN_ROOT=$(echo "$MERGED_CONFIG" | jq -r '.common.DOMAIN_ROOT')
        GTM_ID=$(echo "$MERGED_CONFIG" | jq -r '.common.GTM_ID')
        DFP_NETWORK_ID=$(echo "$MERGED_CONFIG" | jq -r '.common.DFP_NETWORK_ID')
        DB_SSM_PATH=$(echo "$MERGED_CONFIG" | jq -r '.common.DB_SSM_PATH // ""')
        PROJECT_SLUG=$(echo "$MERGED_CONFIG" | jq -r '.common.PROJECT_SLUG // ""')
        CLOUDFLARE_ZONE_ID_KEY=$(echo "$MERGED_CONFIG" | jq -r '.common.CLOUDFLARE_ZONE_ID_KEY // "CLOUDFLARE_ZONE_ID"')
        STACK_ID=$(echo "$MERGED_CONFIG" | jq -r '.common.STACK_ID // ""')

        PROJECT_TIER=$(echo "$MERGED_CONFIG" | jq -r '.common.PROJECT_TIER // "T1"')
        POD=$(echo "$MERGED_CONFIG" | jq -r '.common.POD // "alpha"')

        if [[ "$PROJECT_TIER" == "T3" ]]; then
           DB_TIER="dedicated"
           ELASTIC_TIER="dedicated"
           DEDICATED_ALB="true"
           DEDICATED_WAF="true"
           ECS_COMPUTE_TIER="premium"
        elif [[ "$PROJECT_TIER" == "T2" ]]; then
           DB_TIER="dedicated"
           ELASTIC_TIER="dedicated"
           DEDICATED_ALB="false"
           DEDICATED_WAF="false"
           ECS_COMPUTE_TIER="premium"
        else
           DB_TIER="shared"
           ELASTIC_TIER="shared"
           DEDICATED_ALB="false"
           DEDICATED_WAF="false"
           ECS_COMPUTE_TIER="standard"
        fi
        
        DB_SSM_PATH="${DB_SSM_PATH//\${CLIENT_KEY\}/$CLIENT_KEY}"
        DB_SSM_PATH="${DB_SSM_PATH//\${PROJECT_KEY\}/$PROJECT_KEY}"
        DB_SSM_PATH="${DB_SSM_PATH//\${stage\}/$STAGE_KEY}"

        CONFIG_CLOUD_PROVIDER=$(echo "$MERGED_CONFIG" | jq -r '.common.CLOUD_PROVIDER // "aws"')
        INPUT_CLOUD_PROVIDER="${{ inputs.cloud_provider }}"
        if [[ -n "$INPUT_CLOUD_PROVIDER" && "$INPUT_CLOUD_PROVIDER" != "" ]]; then
          CLOUD_PROVIDER="$INPUT_CLOUD_PROVIDER"
        else
          CLOUD_PROVIDER="$CONFIG_CLOUD_PROVIDER"
        fi
        GCP_REGION=$(echo "$MERGED_CONFIG" | jq -r '.common.GCP_REGION // "europe-west1"')
        GCP_PROJECT_ID=$(echo "$MERGED_CONFIG" | jq -r '.common.GCP_PROJECT_ID // ""')
        GCP_STATE_BUCKET=$(echo "$MERGED_CONFIG" | jq -r '.common.GCP_STATE_BUCKET // ""')
        AZURE_REGION=$(echo "$MERGED_CONFIG" | jq -r '.common.AZURE_REGION // "westeurope"')

        case "$CLOUD_PROVIDER" in
          gcp)
            CLOUD_REGION="$GCP_REGION"
            INFRA_PREFIX=".github/gcp/infra/live"
            if [[ -n "$GCP_STATE_BUCKET" && "$GCP_STATE_BUCKET" != "" ]]; then
              BUCKET="$GCP_STATE_BUCKET"
            fi
            ;;
          azure)
            CLOUD_REGION="$AZURE_REGION"
            INFRA_PREFIX=".github/azure/infra/live"
            if [[ "$CLOUD_PROVIDER" == "azure" ]]; then
              BUCKET="${NAMESPACE}-${CLIENT_KEY}-tfstate-rg/${NAMESPACE}${CLIENT_KEY}tfstate/tfstate"
            else
              BUCKET="${CLIENT_KEY}-${STAGE_KEY}-${NAMESPACE}-tfstate"
            fi
            LOCK_TABLE="" # Azure Blob supports leasing (locking) natively
            ;;
          *)
            CLOUD_PROVIDER="aws"
            CLOUD_REGION="$AWS_REGION"
            INFRA_PREFIX=".github/aws/infra/live"
            ;;
        esac

        echo "☁️  Cloud Provider: $CLOUD_PROVIDER | Region: $CLOUD_REGION | Infra: $INFRA_PREFIX"

        IS_BETA=$(echo "$MERGED_CONFIG" | jq -r ".environments?[\"${STAGE_KEY}\"]?.BETA // \"false\"")

        if [[ "$CLIENT_KEY" == "null" || -z "$CLIENT_KEY" ]]; then
           echo "❌ ERROR: CLIENT_KEY not found in Merged Config (Global: $GLOBAL_CONFIG, Project: $PROJECT_CONFIG)"
           exit 1
        fi

        echo "client_key=$CLIENT_KEY" >> "$GITHUB_OUTPUT"
        echo "project_key=$PROJECT_KEY" >> "$GITHUB_OUTPUT"
        IMAGE_PROJECT_KEY=$(echo "$MERGED_CONFIG" | jq -r '.common.SHARED_HOST_PROJECT // ""')
        [ -z "$IMAGE_PROJECT_KEY" ] && IMAGE_PROJECT_KEY="$PROJECT_KEY"
        echo "image_project_key=$IMAGE_PROJECT_KEY" >> "$GITHUB_OUTPUT"
        
        echo "namespace=$NAMESPACE" >> "$GITHUB_OUTPUT"
        echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
        echo "cloud_provider=$CLOUD_PROVIDER" >> "$GITHUB_OUTPUT"
        echo "cloud_region=$CLOUD_REGION" >> "$GITHUB_OUTPUT"
        echo "infra_prefix=$INFRA_PREFIX" >> "$GITHUB_OUTPUT"
        echo "gcp_project_id=$GCP_PROJECT_ID" >> $GITHUB_OUTPUT
        echo "aws_region=$AWS_REGION" >> $GITHUB_OUTPUT
        echo "domain_root=$DOMAIN_ROOT" >> $GITHUB_OUTPUT
        echo "beta=$IS_BETA" >> $GITHUB_OUTPUT
        echo "gtm_id=$GTM_ID" >> $GITHUB_OUTPUT
        echo "dfp_network_id=$DFP_NETWORK_ID" >> $GITHUB_OUTPUT

        echo "db_ssm_path=$DB_SSM_PATH" >> $GITHUB_OUTPUT
        echo "db_tier=$DB_TIER" >> $GITHUB_OUTPUT
        echo "elastic_tier=$ELASTIC_TIER" >> $GITHUB_OUTPUT
        echo "ecs_compute_tier=$ECS_COMPUTE_TIER" >> $GITHUB_OUTPUT
        echo "project_slug=$PROJECT_SLUG" >> $GITHUB_OUTPUT
        echo "cloudflare_zone_id_key=$CLOUDFLARE_ZONE_ID_KEY" >> $GITHUB_OUTPUT
        echo "dedicated_alb=$DEDICATED_ALB" >> $GITHUB_OUTPUT
        echo "dedicated_waf=$DEDICATED_WAF" >> $GITHUB_OUTPUT
        echo "stack_id=$STACK_ID" >> $GITHUB_OUTPUT
        echo "project_tier=$PROJECT_TIER" >> $GITHUB_OUTPUT
        echo "pod=$POD" >> $GITHUB_OUTPUT
        
        WORKERS_JSON=$(echo "$MERGED_CONFIG" | jq -c '.common.WORKERS // {}')
        echo "workers_json=$WORKERS_JSON" >> $GITHUB_OUTPUT

        CLUSTER_TIER="${{ inputs.cluster_tier }}"
        if [[ "$CLUSTER_TIER" == "auto" ]]; then
           if [[ "$STAGE_KEY" == "dev" || "$STAGE_KEY" == "dev-mini" ]]; then
              CLUSTER_TIER="flex"
           else
              CLUSTER_TIER="M10"
           fi
        fi
        echo "cluster_tier=$CLUSTER_TIER" >> $GITHUB_OUTPUT

        if [[ -z "$BUCKET" ]]; then
           BUCKET="${CLIENT_KEY}-${STAGE_KEY}-${NAMESPACE}-tfstate"
           LOCK_TABLE="${BUCKET}-lock"
        fi

        INPUT_STACK=$(echo "${{ inputs.terraform_stack }}" | awk '{print $1}')

        case "$INPUT_STACK" in
          "network")
            STACK="network"
            ;;
          "dedicated-network")
            STACK="dedicated-network"
            ;;
          "tenant-app")
            STACK="tenant-app"
            ;;
          "multi-site-network")
            STACK="multi-site-network"
            ;;
          "multi-site-app")
            STACK="multi-site-app"
            ;;
          "multi-site-cdn")
            STACK="multi-site-cdn"
            ;;
          "db-pod-alpha")
            STACK="db-pod-alpha"
            ;;
          "db-pod-premium")
            STACK="db-pod-premium"
            ;;
          "pod-shared-01"|"pod-dedicated-01")
            STACK="$INPUT_STACK"
            ;;
          "dedicated-db")
            STACK="dedicated-db"
            ;;
          "single-network")
            STACK="single-network"
            ;;
          "single-app")
            STACK="single-app"
            ;;
          "tunnel")
            STACK="third-party-cloudflare"
            ;;
          "acm")
            STACK="third-party-acm"
            ;;
          "third-party-mongodb"|"mongodb")
            STACK="third-party-mongodb"
            ;;
          "third-party-elastic"|"elastic")
            STACK="third-party-elastic"
            ;;
          "app")
            STACK="app"
            ;;
          "data")
            STACK="data"
            ;;
          "cdn")
            STACK="cdn"
            ;;
          "account-settings")
            STACK="account-settings"
            ;;
          *)
            STACK="multi-site-app"
            ;;
        esac

        echo "🔍 Selected Stack: $STACK (from input: '$INPUT_STACK')"

        if [[ "$STACK" == "network" || "$STACK" == "dedicated-network" || "$STACK" == "data" || "$STACK" == "cdn" || "$STACK" == "third-party-acm" || "$STACK" == "third-party-cloudflare" || "$STACK" == "account-settings" || "$STACK" == "single-network" || "$STACK" == "single-app" || "$STACK" == "db-pod-alpha" || "$STACK" == "db-pod-premium" || "$STACK" == "pod-shared-01" || "$STACK" == "pod-dedicated-01" ]]; then
           if [[ "${{ inputs.deploy_infra }}" != "true" ]]; then
              echo "❌ CONFIG ERROR: You selected an Infrastructure Stack ('$STACK') but 'Run Terraform' is UNCHECKED."
              echo "   This would result in a no-op (doing nothing)."
              echo "   Please re-run and check 'Run Terraform' (deploy_infra) to apply changes."
              exit 1
           fi
        fi

        SHOULD_BUILD="false"
        SHOULD_DEPLOY_APP="false"

        if [[ "$STACK" == "app" ]]; then
           BUILD_INPUT=$(echo "${{ inputs.build_images }}" | tr '[:upper:]' '[:lower:]')
           
           if [[ "$BUILD_INPUT" == "true" || "$IS_DISPATCH" == "true" ]]; then
              SHOULD_BUILD="true"
              echo "   ✅ SHOULD_BUILD set to true (build_images=$BUILD_INPUT or dispatch)"
           else
              echo "   ⚠️  SHOULD_BUILD remains false (build_images=$BUILD_INPUT, not dispatch)"
           fi
        fi

        if [[ "$STACK" == "app" || "$STACK" == "third-party-cloudflare" ]]; then
            if [[ "${{ inputs.deploy_services }}" == "true" || "$IS_DISPATCH" == "true" ]]; then
               SHOULD_DEPLOY_APP="true"
            fi
        fi

        if [[ "$STACK" == "account-settings" ]]; then
            TF_DIR="${INFRA_PREFIX}/account-settings"
            STATE_KEY="infra/${PROJECT_KEY}/account-settings.tfstate"

        elif [[ "$STACK" == "third-party-cloudflare" ]]; then
            TF_DIR="${INFRA_PREFIX}/third-party/cloudflare"
            STATE_KEY="infra/${PROJECT_KEY}/third-party/cloudflare.tfstate"
            
        elif [[ "$STACK" == "third-party-acm" ]]; then
            TF_DIR="${INFRA_PREFIX}/third-party/acm"
            STATE_KEY="infra/${PROJECT_KEY}/third-party/acm.tfstate"

        elif [[ "$STACK" == "third-party-mongodb" ]]; then
            TF_DIR="${INFRA_PREFIX}/third-party/mongodb"
            STATE_KEY="infra/${PROJECT_KEY}/${STAGE_KEY}/third-party-mongodb.tfstate"

        elif [[ "$STACK" == "third-party-elastic" ]]; then
            TF_DIR="${INFRA_PREFIX}/third-party/elastic"
            STATE_KEY="infra/${PROJECT_KEY}/${STAGE_KEY}/third-party-elastic.tfstate"
            
        else
            if [[ "$STAGE_KEY" != "dev-mini" ]]; then
               if [[ "$STACK" == "network" || "$STACK" == "single-network" || "$STACK" == "dedicated-network" ]]; then
                  STACK="multi-site-network"
               elif [[ "$STACK" == "app" || "$STACK" == "single-app" ]]; then
                  STACK="multi-site-app"
               elif [[ "$STACK" == "cdn" ]]; then
                  STACK="multi-site-cdn"
               fi
            fi

            if [[ "$STACK" == "pod-shared-01" || "$STACK" == "pod-dedicated-01" ]]; then
               TF_DIR="${INFRA_PREFIX}/${STAGE_KEY}-${STACK}"
               STATE_KEY="infra/shared/${STAGE_KEY}/${STACK}.tfstate"

            elif [[ "$STACK" == "db-pod-alpha" || "$STACK" == "db-pod-premium" || "$STACK" == "data" ]]; then
               TF_DIR="${INFRA_PREFIX}/${STAGE_KEY}-${STACK}"
               STATE_KEY="infra/${PROJECT_KEY}/${STAGE_KEY}/${STACK}.tfstate"
               
            elif [[ "$STACK" == "tenant-app" ]]; then
               TF_DIR="${INFRA_PREFIX}/${STAGE_KEY}-tenant-app"
               if [[ -n "${{ inputs.branch_name }}" && ("$STAGE_KEY" == "dev" || "$STAGE_KEY" == "dev-mini") ]]; then
                  STATE_KEY="infra/${PROJECT_KEY}/features/${INPUT_PROJECT}-${{ inputs.branch_name }}.tfstate"
               else
                  STATE_KEY="infra/${PROJECT_KEY}/${STAGE_KEY}/${INPUT_PROJECT}.tfstate"
               fi

            elif [[ "$STACK" == "dedicated-db" ]]; then
               if [[ "$STAGE_KEY" == "dev" || "$STAGE_KEY" == "dev-mini" ]]; then
                  TF_DIR="${INFRA_PREFIX}/${INPUT_PROJECT}-db"
               else
                  TF_DIR="${INFRA_PREFIX}/${STAGE_KEY}-${INPUT_PROJECT}-db"
               fi
               STATE_KEY="infra/${PROJECT_KEY}/${STAGE_KEY}/${INPUT_PROJECT}-db.tfstate"

            elif [[ "$STACK" == "multi-site-app" || "$STACK" == "multi-site-network" || "$STACK" == "multi-site-cdn" ]]; then

               if [[ "$STACK" == "multi-site-app" && "$INPUT_PROJECT" != "thisisblaze" && "$INPUT_PROJECT" != "" ]]; then
                  STACK_DIR="multi-site-app-${INPUT_PROJECT}"
                  STATE_KEY="infra/${PROJECT_KEY}/multi-site/${STAGE_KEY}/app.tfstate"
               else
                  STACK_DIR="$STACK"
                  if [[ "$CLOUD_PROVIDER" == "gcp" ]]; then
                     STATE_KEY="gcp/multi-site/${STAGE_KEY}/${STACK}"
                  else
                     STATE_KEY="infra/${PROJECT_KEY}/multi-site/${STAGE_KEY}/${STACK#multi-site-}.tfstate"
                  fi
               fi

               if [[ "$STAGE_KEY" == "dev" || "$STAGE_KEY" == "multi-site" ]]; then
                  TF_DIR="${INFRA_PREFIX}/${STACK_DIR}"
               elif [[ "$STAGE_KEY" == "dev-mini" ]]; then
                  TF_DIR="${INFRA_PREFIX}/dev-mini-${STACK_DIR#multi-site-}"
               else
                  if [[ "$STACK" == "multi-site-app" && "$INPUT_PROJECT" != "thisisblaze" && "$INPUT_PROJECT" != "" ]]; then
                     TF_DIR="${INFRA_PREFIX}/${STAGE_KEY}-multi-site-app-${INPUT_PROJECT}"
                  else
                     TF_DIR="${INFRA_PREFIX}/${STAGE_KEY}-${STACK_DIR}"
                  fi
               fi

            else
               if [[ "$STAGE_KEY" == "dev" || "$STAGE_KEY" == "stage" ]]; then
                  TF_DIR="${INFRA_PREFIX}/${STAGE_KEY}-tenant-app"
                  if [[ -n "${{ inputs.branch_name }}" && ("$STAGE_KEY" == "dev" || "$STAGE_KEY" == "dev-mini") ]]; then
                     STATE_KEY="infra/${PROJECT_KEY}/features/${{ inputs.branch_name }}-tenant.tfstate"
                  else
                     STATE_KEY="infra/${PROJECT_KEY}/${STAGE_KEY}/tenant-app.tfstate"
                  fi
               else
                  TF_DIR="${INFRA_PREFIX}/${STAGE_KEY}-app"
                  if [[ -n "${{ inputs.branch_name }}" && ("$STAGE_KEY" == "dev" || "$STAGE_KEY" == "dev-mini") ]]; then
                     STATE_KEY="infra/${PROJECT_KEY}/features/${{ inputs.branch_name }}.tfstate"
                  else
                     STATE_KEY="infra/${PROJECT_KEY}/${STAGE_KEY}/app.tfstate"
                  fi
               fi
            fi
        fi

        STATE_KEY=$(echo "$STATE_KEY" | sed 's|//|/|g')

        CLUSTER_NAME="${NAMESPACE}-${CLIENT_KEY}-${IMAGE_PROJECT_KEY}-${STAGE_KEY}-cluster"
        echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT
        echo "build_root=$BUILD_ROOT" >> $GITHUB_OUTPUT

        echo "env_val=$ENV_VAL" >> $GITHUB_OUTPUT
        echo "tf_dir=$TF_DIR" >> $GITHUB_OUTPUT
        echo "bucket=$BUCKET" >> $GITHUB_OUTPUT
        echo "lock_table=$LOCK_TABLE" >> $GITHUB_OUTPUT

        if command -v aws >/dev/null && aws sts get-caller-identity >/dev/null 2>&1; then
           ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        else
           ACCOUNT_ID=""
        fi
        echo "aws_account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
        echo "state_key=$STATE_KEY" >> $GITHUB_OUTPUT
        echo "stage_key=$STAGE_KEY" >> $GITHUB_OUTPUT
        echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT
        echo "should_deploy_app=$SHOULD_DEPLOY_APP" >> $GITHUB_OUTPUT
        echo "config_env=$CONFIG_ENV" >> $GITHUB_OUTPUT

        if [[ "$STAGE_KEY" == "multi-site" && "$CLOUD_PROVIDER" == "gcp" ]]; then
          GCP_DOCKER_REPO="${NAMESPACE}-${CLIENT_KEY}-multi-site-multi-site-docker"
        else
          GCP_DOCKER_REPO="${NAMESPACE}-${CLIENT_KEY}-${PROJECT_KEY}-${STAGE_KEY}-docker"
        fi
        echo "gcp_docker_repo=$GCP_DOCKER_REPO" >> $GITHUB_OUTPUT
        echo "🐳 GCP Docker Repo: $GCP_DOCKER_REPO"

        if [[ "$CLOUD_PROVIDER" == "azure" ]]; then
          RAW_ACR="${NAMESPACE}-${CLIENT_KEY}-${PROJECT_KEY}-${STAGE_KEY}"
          AZURE_ACR_NAME=$(echo "$RAW_ACR" | tr -d '-' | cut -c 1-24)
        else
          AZURE_ACR_NAME=""
        fi
        ADMIN_BUCKET=$(echo "$MERGED_CONFIG" | jq -r ".[\"${STAGE_KEY}\"]?.ADMIN_BUCKET // .common.ADMIN_BUCKET // \"\"")
        if [[ -z "$ADMIN_BUCKET" ]]; then
           ADMIN_BUCKET="${NAMESPACE}-${CLIENT_KEY}-${PROJECT_KEY}-${STAGE_KEY}-${PROJECT_KEY}-static"
        fi
        echo "admin_bucket=$ADMIN_BUCKET" >> $GITHUB_OUTPUT
        echo "azure_acr_name=$AZURE_ACR_NAME" >> $GITHUB_OUTPUT
        echo "🐳 Azure ACR Name: $AZURE_ACR_NAME"

        PROJECT_SLUG=$(echo "$MERGED_CONFIG" | jq -r '.common.PROJECT_SLUG // ""')
        echo "project_slug=$PROJECT_SLUG" >> $GITHUB_OUTPUT
        echo "🏷️  Project Slug: '${PROJECT_SLUG:-<primary>}'"
