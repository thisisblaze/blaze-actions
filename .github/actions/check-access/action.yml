name: "Check Access"
description: "Verifies if the current user is allowed to perform infrastructure actions."
inputs:
  allowed_users:
    description: "Comma-separated list of allowed users (from blaze-env.json)"
    required: true
  actor:
    description: "The GitHub actor triggering the workflow"
    required: true
    default: ${{ github.actor }}

runs:
  using: "composite"
  steps:
    - name: Verify Access
      shell: bash
      env:
        ALLOWED_USERS_IN: ${{ inputs.allowed_users }}
        ACTOR_IN: ${{ inputs.actor }}
      run: |
        set -euo pipefail
        ALLOWED_USERS="${ALLOWED_USERS_IN:-}"
        ACTOR="${ACTOR_IN:-}"

        # Fail closed: empty inputs must never silently grant or skip the check.
        if [ -z "$ALLOWED_USERS" ] || [ -z "$ACTOR" ]; then
          echo "❌ ERROR: 'allowed_users' and 'actor' are required and must be non-empty (fail closed)."
          exit 1
        fi

        echo "🔒 Access Control Check"
        echo "   Actor: $ACTOR"
        echo "   Allowed: $ALLOWED_USERS"

        if [[ ",$ALLOWED_USERS," == *",$ACTOR,"* ]]; then
          echo "✅ Access GRANTED for $ACTOR."
        else
          echo "❌ Access DENIED for $ACTOR."
          echo "   You are not in the ALLOWED_INFRA_USERS list."
          exit 1
        fi
