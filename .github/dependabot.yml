version: 2
registries:
  github-git:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{ secrets.DEPENDABOT_PAT }}

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # --- TERRAFORM PROVIDERS & MODULES ---
  - package-ecosystem: "terraform"
    directory: "/.github/aws/infra/preinit"
    registries:
      - github-git
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-tf)"

  - package-ecosystem: "terraform"
    directory: "/.github/aws/infra/live/dev-network"
    registries:
      - github-git
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-tf)"

  - package-ecosystem: "terraform"
    directory: "/.github/aws/infra/live/dev-app"
    registries:
      - github-git
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-tf)"

  - package-ecosystem: "terraform"
    directory: "/.github/gcp/infra/live/dev-network"
    registries:
      - github-git
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-tf)"

  - package-ecosystem: "terraform"
    directory: "/.github/gcp/infra/live/dev-app"
    registries:
      - github-git
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-tf)"

