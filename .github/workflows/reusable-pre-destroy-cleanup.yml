name: "♻️ Pre-Destroy Cleanup"

on:
  workflow_call:
    inputs:
      cloud_provider:
        required: false
        type: string
        default: "aws"
        description: "Cloud provider (aws/gcp/azure). Default: aws"
      cluster_name:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      stage_filter:
        required: false
        type: string
        description: "Optional stage filter to only cleanup services for a specific stage handle (e.g. 'dev-bz-01'). Matches '-{stage_filter}-' within ECS service names. When set, namespace + task definition cleanup is skipped (shared cluster safety)."
      force_delete:
        required: false
        type: boolean
        default: false
        description: "Force delete services even if tasks are running"
      environment:
        required: false
        type: string
        description: "GitHub Environment"
      wif_audience:
        description: "WIF Audience (Optional)"
        required: false
        type: string
        default: ""
      target_stack:
        description: "Target stack (app, cdn, network, data, all)"
        required: false
        type: string
        default: "app"
      dry_run:
        description: "Dry run (list what would be deleted without deleting)"
        required: false
        type: boolean
        default: true
      stack_id:
        description: "Universal Stack UUID for idempotent teardown isolation"
        required: false
        type: string
        default: ""
    secrets:
      BLAZE_ELASTICSEARCH_USERNAME:
        required: false
      BLAZE_ELASTICSEARCH_PASSWORD:
        required: false
      BLAZE_ELASTICSEARCH_ENDPOINT:
        required: false
      AWS_ROLE_ARN:
        required: false
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: false
      GCP_SERVICE_ACCOUNT:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      CLOUDFLARE_ZONE_ID:
        required: false
      GH_PAT:
        required: false
      NPM_TOKEN:
        required: false
      INFRACOST_API_KEY:
        required: false
      BLAZE_CONNECTION_STRING:
        required: false
      BLAZE_AUTH_JWT_PRIVATE_KEY:
        required: false
      BLAZE_AUTH_ADMIN_EMAIL:
        required: false
      BLAZE_AUTH_ADMIN_PASSWORD:
        required: false
      BLAZE_FILES_S3_ACCESS_KEY:
        required: false
      BLAZE_FILES_S3_SECRET_ACCESS_KEY:
        required: false
      BLAZE_GRAPHQL_CACHE_SETTINGS:
        required: false
      BLAZE_CLIENT_HEADER:
        required: false
      EC_API_KEY:
        required: false
      MONGODB_ATLAS_PUBLIC_KEY:
        required: false
      MONGODB_ATLAS_PRIVATE_KEY:
        required: false
      MONGODB_ATLAS_ORG_ID:
        required: false
      MONGODB_ATLAS_PROJECT_ID:
        required: false
      ACM_CERTIFICATE_ARN:
        required: false
      BLAZE_SENTRY_AUTH_TOKEN:
        required: false
      BLAZE_SENTRY_DSN:
        required: false
      SLACK_WEBHOOK_URL:
        required: false
      DEPLOY_KEY:
        required: false
    outputs:
      cleanup_status:
        value: ${{ jobs.cleanup.outputs.status }}
      services_deleted:
        value: ${{ jobs.cleanup.outputs.services }}
      tasks_deleted:
        value: ${{ jobs.cleanup.outputs.tasks_deleted }}

permissions:
  contents: read
concurrency:
  group: cleanup-util-${{ github.workflow }}-${{ github.ref }}-${{ inputs.environment }}-${{ inputs.cloud_provider }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cleanup:
    permissions:
      contents: read
      id-token: write
    name: Pre-Destroy Cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}

    outputs:
      status: ${{ steps.cleanup.outputs.status }}
      services: ${{ steps.cleanup.outputs.services }}
      tasks_deleted: ${{ steps.cleanup.outputs.tasks_deleted }}

    steps:
      - name: Setup AWS CLI
        if: inputs.cloud_provider == 'aws' || inputs.cloud_provider == ''
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-PreDestroy
          aws-region: ${{ inputs.aws_region || 'eu-west-1' }}

      - name: Parse Context
        id: context
        run: |
          CLUSTER="${{ inputs.cluster_name }}"
          echo "Parsing context from Cluster: $CLUSTER"

          if [[ "$CLUSTER" =~ ^([^-]+)-([^-]+)-([^-]+)-(.+)-cluster$ ]]; then
             NAMESPACE="${BASH_REMATCH[1]}"
             CLIENT_KEY="${BASH_REMATCH[2]}"
             PROJECT_KEY="${BASH_REMATCH[3]}"
             STAGE_KEY="${BASH_REMATCH[4]}"
             echo "NAMESPACE=$NAMESPACE" >> $GITHUB_ENV
             echo "CLIENT_KEY=$CLIENT_KEY" >> $GITHUB_ENV
             echo "PROJECT_KEY=$PROJECT_KEY" >> $GITHUB_ENV
             echo "STAGE_KEY=$STAGE_KEY" >> $GITHUB_ENV
             echo "Parsed (Standard): Namespace='$NAMESPACE', Client='$CLIENT_KEY', Project='$PROJECT_KEY', Stage='$STAGE_KEY'"
          elif [[ "$CLUSTER" =~ ^([^-]+)-([^-]+)-(.+)-cluster$ ]]; then
             # Fallback for 3-part names (e.g. blaze-thisisblaze-dev-cluster)
             # Assuming: namespace-project-stage (where client might be same as project or omitted)
             NAMESPACE="${BASH_REMATCH[1]}"
             PROJECT_KEY="${BASH_REMATCH[2]}"
             STAGE_KEY="${BASH_REMATCH[3]}"
             CLIENT_KEY="$PROJECT_KEY" # Default client to project if missing
             
             echo "NAMESPACE=$NAMESPACE" >> $GITHUB_ENV
             echo "CLIENT_KEY=$CLIENT_KEY" >> $GITHUB_ENV
             echo "PROJECT_KEY=$PROJECT_KEY" >> $GITHUB_ENV
             echo "STAGE_KEY=$STAGE_KEY" >> $GITHUB_ENV
             echo "Parsed (Compact): Namespace='$NAMESPACE', Client='$CLIENT_KEY', Project='$PROJECT_KEY', Stage='$STAGE_KEY'"
          else
             echo "⚠️ Could not parse Cluster Name. Keys will be empty."
             echo "NAMESPACE=" >> $GITHUB_ENV
             echo "CLIENT_KEY=" >> $GITHUB_ENV
             echo "PROJECT_KEY=" >> $GITHUB_ENV
             echo "STAGE_KEY=" >> $GITHUB_ENV
          fi

      - name: Drain ECS Services (Scale to 0)
        if: (inputs.cloud_provider == 'aws' || inputs.cloud_provider == '') && inputs.cluster_name != ''
        run: |
          CLUSTER="${{ inputs.cluster_name }}"
          REGION="${{ inputs.aws_region }}"
          echo "🛑 Checking ECS cluster: $CLUSTER for active services to drain..."
          
          STATUS=$(aws ecs describe-clusters --clusters "$CLUSTER" --region "$REGION" --query "clusters[0].status" --output text 2>/dev/null || echo "MISSING")
          if [[ "$STATUS" == "ACTIVE" ]]; then
             SERVICES=$(aws ecs list-services --cluster "$CLUSTER" --region "$REGION" --query "serviceArns[]" --output text 2>/dev/null || echo "")
             if [[ -n "$SERVICES" && "$SERVICES" != "None" ]]; then
                for SVC in $SERVICES; do
                   echo "   📉 Scaling service $SVC to 0 desired tasks..."
                   if [[ "${{ inputs.dry_run }}" == "true" ]]; then
                      echo "      [DRY RUN] Would run: aws ecs update-service --cluster $CLUSTER --service $SVC --desired-count 0"
                   else
                      aws ecs update-service --cluster "$CLUSTER" --service "$SVC" --desired-count 0 --region "$REGION" > /dev/null || echo "      ⚠️ Failed to scale service"
                   fi
                done
                if [[ "${{ inputs.dry_run }}" != "true" ]]; then
                   echo "   ⏳ Waiting 15 seconds for tasks to begin draining..."
                   sleep 15
                fi
             else
                echo "   ✅ No active services found in cluster."
             fi
          else
             echo "   ✅ Cluster not found or already inactive ($STATUS)."
          fi

      - name: Cleanup S3 CRR Configs (Pre-Bucket-Empty)
        # Plan 151 L5/L13: CRR replication config MUST be deleted BEFORE bucket contents.
        # AWS will block bucket deletion if a replication config referencing it still exists.
        # Ordering: delete-bucket-replication → object_versions.delete() → bucket destroy.
        if: (inputs.cloud_provider == 'aws' || inputs.cloud_provider == '') && env.CLIENT_KEY != ''
        run: |
          PROJECT_KEY="${{ env.PROJECT_KEY }}"
          STAGE_KEY="${{ env.STAGE_KEY }}"

          STACK_ID="${{ inputs.stack_id }}"
          echo "🔗 Scanning for S3 CRR configs to remove before bucket emptying..."

          if [[ -n "$STACK_ID" && "$STACK_ID" != "null" ]]; then
            TAGGED_ARNS=$(aws resourcegroupstaggingapi get-resources \
              --region "${{ inputs.aws_region }}" \
              --tag-filters "Key=Blaze:StackID,Values=${STACK_ID}" \
              --resource-type-filters "s3" \
              --query 'ResourceTagMappingList[*].ResourceARN' \
              --output text 2>/dev/null || echo "")
          else
            TAGGED_ARNS_V2=$(aws resourcegroupstaggingapi get-resources \
              --region "${{ inputs.aws_region }}" \
              --tag-filters "Key=Blaze:Project,Values=${PROJECT_KEY}" "Key=Blaze:Environment,Values=${STAGE_KEY}" \
              --resource-type-filters "s3" \
              --query 'ResourceTagMappingList[*].ResourceARN' \
              --output text 2>/dev/null || echo "")

            TAGGED_ARNS_V1=$(aws resourcegroupstaggingapi get-resources \
              --region "${{ inputs.aws_region }}" \
              --tag-filters "Key=Project,Values=${PROJECT_KEY}" "Key=Stage,Values=${STAGE_KEY}" \
              --resource-type-filters "s3" \
              --query 'ResourceTagMappingList[*].ResourceARN' \
              --output text 2>/dev/null || echo "")

            TAGGED_ARNS=$(echo "$TAGGED_ARNS_V1 $TAGGED_ARNS_V2" | tr ' ' '\n' | grep -v 'None' | sort -u || true)
          fi

          for BUCKET_ARN in $TAGGED_ARNS; do
            BUCKET_NAME="${BUCKET_ARN#arn:aws:s3:::}"
            if [[ "$BUCKET_NAME" == *"tfstate"* ]]; then continue; fi

            # Check if a replication config exists on this bucket
            HAS_CRR=$(aws s3api get-bucket-replication \
              --bucket "$BUCKET_NAME" \
              --region "${{ inputs.aws_region }}" \
              --query 'ReplicationConfiguration.Role' \
              --output text 2>/dev/null || echo "None")

            if [[ "$HAS_CRR" != "None" && -n "$HAS_CRR" ]]; then
              echo "   🔗 Found CRR config on $BUCKET_NAME"
              if [[ "${{ inputs.dry_run }}" == "true" ]]; then
                echo "   [DRY RUN] Would delete-bucket-replication on $BUCKET_NAME"
              else
                echo "   🗑️ Removing replication config from $BUCKET_NAME..."
                aws s3api delete-bucket-replication \
                  --bucket "$BUCKET_NAME" \
                  --region "${{ inputs.aws_region }}" && \
                  echo "   ✅ CRR config removed from $BUCKET_NAME" || \
                  echo "   ⚠️ Failed to remove CRR config from $BUCKET_NAME (may not exist)"
              fi
            else
              echo "   ✅ No CRR config on $BUCKET_NAME — skipping."
            fi
          done

      - name: Cleanup S3 Buckets
        if: (inputs.cloud_provider == 'aws' || inputs.cloud_provider == '') && env.CLIENT_KEY != ''
        run: |
          NAMESPACE="${{ env.NAMESPACE }}"
          CLIENT_KEY="${{ env.CLIENT_KEY }}"
          PROJECT_KEY="${{ env.PROJECT_KEY }}"
          STAGE_KEY="${{ env.STAGE_KEY }}"

          STACK_ID="${{ inputs.stack_id }}"
          echo "🔍 Scanning S3 buckets for Project=${PROJECT_KEY}, Stage=${STAGE_KEY} via Tags"
          
          if [[ -n "$STACK_ID" && "$STACK_ID" != "null" ]]; then
            TAGGED_ARNS=$(aws resourcegroupstaggingapi get-resources \
              --region "${{ inputs.aws_region }}" \
              --tag-filters "Key=Blaze:StackID,Values=${STACK_ID}" \
              --resource-type-filters "s3" \
              --query 'ResourceTagMappingList[*].ResourceARN' \
              --output text 2>/dev/null || echo "")
          else
            TAGGED_ARNS_V2=$(aws resourcegroupstaggingapi get-resources \
              --region "${{ inputs.aws_region }}" \
              --tag-filters "Key=Blaze:Project,Values=${PROJECT_KEY}" "Key=Blaze:Environment,Values=${STAGE_KEY}" \
              --resource-type-filters "s3" \
              --query 'ResourceTagMappingList[*].ResourceARN' \
              --output text 2>/dev/null || echo "")
              
            TAGGED_ARNS_V1=$(aws resourcegroupstaggingapi get-resources \
              --region "${{ inputs.aws_region }}" \
              --tag-filters "Key=Project,Values=${PROJECT_KEY}" "Key=Stage,Values=${STAGE_KEY}" \
              --resource-type-filters "s3" \
              --query 'ResourceTagMappingList[*].ResourceARN' \
              --output text 2>/dev/null || echo "")

            TAGGED_ARNS=$(echo "$TAGGED_ARNS_V1 $TAGGED_ARNS_V2" | tr ' ' '\n' | grep -v 'None' | sort -u | tr '\n' ' ' || true)
          fi

          if [[ -n "$TAGGED_ARNS" && "$TAGGED_ARNS" != "None" ]]; then
             for BUCKET_ARN in $TAGGED_ARNS; do
                BUCKET_NAME="${BUCKET_ARN#arn:aws:s3:::}"
                if [[ "$BUCKET_NAME" == *"tfstate"* ]]; then continue; fi
                
                echo "   Found tagged bucket: $BUCKET_NAME"
                if [[ "${{ inputs.dry_run }}" == "true" ]]; then
                   echo "   [DRY RUN] Would empty bucket $BUCKET_NAME"
                   continue
                fi
                pip install boto3 >/dev/null 2>&1 || true
                
                cat <<EOF > empty_bucket.py
          import boto3
          import sys
          bucket_name = sys.argv[1]
          s3 = boto3.resource('s3')
          bucket = s3.Bucket(bucket_name)
          try:
              bucket.object_versions.delete()
              print("Deleted contents.")
          except Exception as e:
              print(f"Error: {e}")
          EOF
                python3 empty_bucket.py "$BUCKET_NAME"
                rm empty_bucket.py
             done
          fi


      - name: Cleanup ACM Certificates
        if: (inputs.cloud_provider == 'aws' || inputs.cloud_provider == '') && env.PROJECT_KEY != ''
        run: |
          PROJECT_KEY="${{ env.PROJECT_KEY }}"
          REGION="${{ inputs.aws_region }}"

          echo "Searching unused certificates for *${PROJECT_KEY}* in $REGION..."

          JSON_LIST=$(aws acm list-certificates --region "$REGION" --includes keyTypes=RSA_2048 --output json)

          # Filter: Domain matches Project AND InUse is false
          # We use jq to handle the filtering safely
          TARGET_ARNS=$(echo "$JSON_LIST" | jq -r --arg kw "$PROJECT_KEY" '.CertificateSummaryList[] | select(.DomainName | contains($kw)) | select(.InUse == false) | .CertificateArn')

          if [[ -n "$TARGET_ARNS" ]]; then
             for ARN in $TARGET_ARNS; do
               echo "   🗑️ Deleting UNUSED cert: $ARN"
               if [[ "${{ inputs.dry_run }}" == "true" ]]; then
                  echo "      [DRY RUN] Would delete certificate $ARN"
               else
                  aws acm delete-certificate --certificate-arn "$ARN" --region "$REGION" || echo "      ⚠️ Failed"
               fi
             done
           fi

      - name: Cleanup CloudWatch Logs
        if: (inputs.cloud_provider == 'aws' || inputs.cloud_provider == '') && env.CLIENT_KEY != ''
        run: |
          NAMESPACE="${{ env.NAMESPACE }}"
          CLIENT_KEY="${{ env.CLIENT_KEY }}"
          PROJECT_KEY="${{ env.PROJECT_KEY }}"
          STAGE_KEY="${{ env.STAGE_KEY }}"
          REGION="${{ inputs.aws_region }}"

          STACK_ID="${{ inputs.stack_id }}"
          echo "🧹 CloudWatch Log Cleanup via Tagging API..."
          
          if [[ -n "$STACK_ID" && "$STACK_ID" != "null" ]]; then
            echo "🔍 Scanning CloudWatch Logs for Blaze:StackID=${STACK_ID} via Tags"
            TAGGED_ARNS_REG=$(aws resourcegroupstaggingapi get-resources \
              --region "$REGION" \
              --tag-filters "Key=Blaze:StackID,Values=${STACK_ID}" \
              --resource-type-filters "logs:log-group" \
              --query 'ResourceTagMappingList[*].ResourceARN' \
              --output text 2>/dev/null || echo "")

            TAGGED_ARNS_EDGE=$(aws resourcegroupstaggingapi get-resources \
              --region "us-east-1" \
              --tag-filters "Key=Blaze:StackID,Values=${STACK_ID}" \
              --resource-type-filters "logs:log-group" \
              --query 'ResourceTagMappingList[*].ResourceARN' \
              --output text 2>/dev/null || echo "")
            ALL_ARNS=$(echo "$TAGGED_ARNS_REG $TAGGED_ARNS_EDGE" | tr ' ' '\n' | grep -v 'None' | grep . || true)
          else
            echo "🔍 Scanning CloudWatch Logs for Project=${PROJECT_KEY}, Stage=${STAGE_KEY} via Tags"
            
            TAGGED_ARNS_V2=$(aws resourcegroupstaggingapi get-resources \
              --region "$REGION" \
              --tag-filters "Key=Blaze:Project,Values=${PROJECT_KEY}" "Key=Blaze:Environment,Values=${STAGE_KEY}" \
              --resource-type-filters "logs:log-group" \
              --query 'ResourceTagMappingList[*].ResourceARN' \
              --output text 2>/dev/null || echo "")

            TAGGED_ARNS_EDGE_V2=$(aws resourcegroupstaggingapi get-resources \
              --region "us-east-1" \
              --tag-filters "Key=Blaze:Project,Values=${PROJECT_KEY}" "Key=Blaze:Environment,Values=${STAGE_KEY}" \
              --resource-type-filters "logs:log-group" \
              --query 'ResourceTagMappingList[*].ResourceARN' \
              --output text 2>/dev/null || echo "")
              
            TAGGED_ARNS_V1=$(aws resourcegroupstaggingapi get-resources \
              --region "$REGION" \
              --tag-filters "Key=Project,Values=${PROJECT_KEY}" "Key=Stage,Values=${STAGE_KEY}" \
              --resource-type-filters "logs:log-group" \
              --query 'ResourceTagMappingList[*].ResourceARN' \
              --output text 2>/dev/null || echo "")

            TAGGED_ARNS_EDGE_V1=$(aws resourcegroupstaggingapi get-resources \
              --region "us-east-1" \
              --tag-filters "Key=Project,Values=${PROJECT_KEY}" "Key=Stage,Values=${STAGE_KEY}" \
              --resource-type-filters "logs:log-group" \
              --query 'ResourceTagMappingList[*].ResourceARN' \
              --output text 2>/dev/null || echo "")

            ALL_ARNS=$(echo "$TAGGED_ARNS_V1 $TAGGED_ARNS_V2 $TAGGED_ARNS_EDGE_V1 $TAGGED_ARNS_EDGE_V2" | tr ' ' '\n' | grep -v 'None' | grep . || true)
          fi


          if [[ -n "$ALL_ARNS" ]]; then
             for LOG_ARN in $ALL_ARNS; do
                GROUP=$(echo "$LOG_ARN" | awk -F':log-group:' '{print $2}' | sed 's/:\*$//')
                GRP_REGION=$(echo "$LOG_ARN" | awk -F':' '{print $4}')
                
                echo "      🗑️ Deleting Log Group: $GROUP (Region: $GRP_REGION)"
                if [[ "${{ inputs.dry_run }}" == "true" ]]; then
                   echo "         [DRY RUN] Would delete log group $GROUP"
                else
                   aws logs delete-log-group --log-group-name "$GROUP" --region "$GRP_REGION" || echo "         ⚠️ Failed to delete log group"
                fi
             done
          else
             echo "      ✅ No tagged logs found."
          fi

      - name: Cleanup Service Discovery
        if: (inputs.cloud_provider == 'aws' || inputs.cloud_provider == '') && env.PROJECT_KEY != ''
        run: |
          PROJECT_KEY="${{ env.PROJECT_KEY }}"
          STAGE_KEY="${{ env.STAGE_KEY }}"
          REGION="${{ inputs.aws_region }}"

          # Pattern used in core modules: ${project_key}-${stage}.local
          echo "🔎 Searching for Service Discovery Namespaces related to stage: $STAGE_KEY in $REGION..."

          NAMESPACE_IDS=$(aws servicediscovery list-namespaces --region "$REGION" \
              --query "Namespaces[?contains(Name, '${STAGE_KEY}.local') || Id=='ns-cx52mhhntqenlnjw'].Id" --output text)

          if [[ -z "$NAMESPACE_IDS" || "$NAMESPACE_IDS" == "None" ]]; then
              echo "✅ No relevant Namespaces found."
          else
              for NAMESPACE_ID in $NAMESPACE_IDS; do
                  if [[ -n "$NAMESPACE_ID" && "$NAMESPACE_ID" != "None" ]]; then
                      echo "🎯 Processing Namespace ID: $NAMESPACE_ID"
                      echo "📋 Listing services..."
                      SERVICE_IDS=$(aws servicediscovery list-services --filters "Name=NAMESPACE_ID,Values=$NAMESPACE_ID" --region "$REGION" --query "Services[].Id" --output text)
                      
                      if [[ -n "$SERVICE_IDS" && "$SERVICE_IDS" != "None" ]]; then
                          for SERVICE_ID in $SERVICE_IDS; do
                              echo "   Processing Service: $SERVICE_ID"
                              # Deregister Instances
                              INSTANCE_IDS=$(aws servicediscovery list-instances --service-id "$SERVICE_ID" --region "$REGION" --query "Instances[].Id" --output text)
                              if [[ -n "$INSTANCE_IDS" && "$INSTANCE_IDS" != "None" ]]; then
                                  for INSTANCE_ID in $INSTANCE_IDS; do
                                      echo "      🔪 Deregistering instance: $INSTANCE_ID"
                                      if [[ "${{ inputs.dry_run }}" == "true" ]]; then
                                         echo "         [DRY RUN] Would deregister instance"
                                      else
                                         aws servicediscovery deregister-instance --service-id "$SERVICE_ID" --instance-id "$INSTANCE_ID" --region "$REGION" || true
                                      fi
                                  done
                              fi
                              
                              # Delete Service
                              echo "   🗑️ Deleting Service: $SERVICE_ID"
                              if [[ "${{ inputs.dry_run }}" == "true" ]]; then
                                 echo "      [DRY RUN] Would delete service"
                              else
                                 aws servicediscovery delete-service --id "$SERVICE_ID" --region "$REGION" || echo "      ⚠️ Failed to delete service"
                              fi
                          done
                      else
                          echo "   ℹ️  No services found in namespace $NAMESPACE_ID."
                      fi
                  fi
              done
          fi

      - name: Cleanup Zombie Resources (OAC/IAM)
        if: (inputs.cloud_provider == 'aws' || inputs.cloud_provider == '') && env.PROJECT_KEY != ''
        run: |
          NAMESPACE="${{ env.NAMESPACE }}"
          CLIENT_KEY="${{ env.CLIENT_KEY }}"
          PROJECT_KEY="${{ env.PROJECT_KEY }}"
          STAGE_KEY="${{ env.STAGE_KEY }}"
          RESOURCE_NAMESPACE="${NAMESPACE}-${CLIENT_KEY}-${PROJECT_KEY}-${STAGE_KEY}"
          REGION="${{ inputs.aws_region }}"

          echo "🧟 Cleanup Zombie Resources for $RESOURCE_NAMESPACE in $REGION"

          # ---------------------------------------------------------
          # 1. CloudFront Origin Access Control (OAC)
          # ---------------------------------------------------------
          OAC_NAME="${RESOURCE_NAMESPACE}-cdn-oac"
          echo "   🔍 Checking OAC: $OAC_NAME"
          OAC_ID=$(aws cloudfront list-origin-access-controls --query "OriginAccessControlList.Items[?Name=='$OAC_NAME'].Id" --output text)

          if [[ -n "$OAC_ID" && "$OAC_ID" != "None" ]]; then
             echo "      🗑️ Deleting OAC: $OAC_ID"
             if [[ "${{ inputs.dry_run }}" == "true" ]]; then
                echo "         [DRY RUN] Would delete OAC"
             else
                aws cloudfront delete-origin-access-control --id "$OAC_ID" --if-match "$(aws cloudfront get-origin-access-control --id "$OAC_ID" --query 'ETag' --output text)" || echo "      ⚠️ Failed to delete OAC (Check dependencies)"
             fi
          else
             echo "      ✅ OAC not found"
          fi

          # ---------------------------------------------------------
          # 2. IAM Roles
          # ---------------------------------------------------------
          # Expanded list to include Lambda@Edge roles which often stick around
          ROLES=(
            "${NAMESPACE}-${STAGE_KEY}-lambda-edge-role"
          )

          # Also check for specific standalone policies that might conflict
          POLICIES_TO_DELETE=("${NAMESPACE}-${STAGE_KEY}-lambda-edge-s3-write-transformed")

          # A. DELETE POLICIES FIRST
          for POLICY_NAME in "${POLICIES_TO_DELETE[@]}"; do
             ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
             POLICY_ARN="arn:aws:iam::${ACCOUNT_ID}:policy/${POLICY_NAME}"
             echo "   🔍 Checking Policy: $POLICY_NAME"
             if aws iam get-policy --policy-arn "$POLICY_ARN" >/dev/null 2>&1; then
                echo "      🗑️ Deleting Policy: $POLICY_ARN"
                if [[ "${{ inputs.dry_run }}" == "true" ]]; then
                   echo "         [DRY RUN] Would delete Policy"
                else
                   aws iam delete-policy --policy-arn "$POLICY_ARN" || echo "      ⚠️ Failed (might be attached?)"
                fi
             else
                echo "      ✅ Policy not found"
             fi
          done

          # B. DELETE ROLES
          for ROLE in "${ROLES[@]}"; do
             echo "   🔍 Checking Role: $ROLE"
             if aws iam get-role --role-name "$ROLE" >/dev/null 2>&1; then
                echo "      🗑️ Deleting Role: $ROLE"
                if [[ "${{ inputs.dry_run }}" == "true" ]]; then
                   echo "         [DRY RUN] Would delete Role and detach policies"
                   continue
                fi
                # Detach all policies first
                POLICIES=$(aws iam list-attached-role-policies --role-name "$ROLE" --query 'AttachedPolicies[*].PolicyArn' --output text)
                for POLICY in $POLICIES; do
                   echo "         About to detach $POLICY"
                   aws iam detach-role-policy --role-name "$ROLE" --policy-arn "$POLICY"
                done
                
                # Delete inline policies
                pst=$(aws iam list-role-policies --role-name "$ROLE" --query 'PolicyNames' --output text)
                for p in $pst; do
                   if [ "$p" != "None" ]; then
                     echo "         Deleting inline policy $p"
                     aws iam delete-role-policy --role-name "$ROLE" --policy-name "$p"
                   fi
                done

                # Delete instance profiles
                PROFILES=$(aws iam list-instance-profiles-for-role --role-name "$ROLE" --query 'InstanceProfiles[*].InstanceProfileName' --output text)
                 for PROFILE in $PROFILES; do
                   if [ "$PROFILE" != "None" ]; then
                     echo "         Removing role from instance profile $PROFILE"
                     aws iam remove-role-from-instance-profile --instance-profile-name "$PROFILE" --role-name "$ROLE"
                   fi
                done

                aws iam delete-role --role-name "$ROLE" || echo "      ⚠️ Failed to delete role"
             else
                echo "      ✅ Role not found"
             fi
          done

      - name: Cleanup CloudFront Functions
        if: (inputs.cloud_provider == 'aws' || inputs.cloud_provider == '') && env.CLIENT_KEY != '' && contains(fromJson('["network", "all", "multi-site-network"]'), inputs.target_stack)
        run: |
          NAMESPACE="${{ env.NAMESPACE }}"
          CLIENT_KEY="${{ env.CLIENT_KEY }}"
          PROJECT_KEY="${{ env.PROJECT_KEY }}"
          STAGE_KEY="${{ env.STAGE_KEY }}"

          PREFIX="${NAMESPACE}-${CLIENT_KEY}-${PROJECT_KEY}-${STAGE_KEY}-"
          echo "Searching for CloudFront functions starting with: $PREFIX"

          FUNCTIONS=$(aws cloudfront list-functions --query "FunctionList.Items[?starts_with(Name, '$PREFIX')].Name" --output text 2>/dev/null || echo "")

          if [[ -n "$FUNCTIONS" && "$FUNCTIONS" != "None" ]]; then
             for FUNC_NAME in $FUNCTIONS; do
                echo "   🔄 Checking CloudFront function: $FUNC_NAME"
                
                ETAG=$(aws cloudfront describe-function --name "$FUNC_NAME" --query "ETag" --output text 2>/dev/null || echo "")
                
                if [[ -n "$ETAG" ]]; then
                   if [[ "${{ inputs.dry_run }}" == "true" ]]; then
                      echo "   [DRY RUN] Would delete CloudFront function $FUNC_NAME with ETag $ETAG"
                   else
                      if aws cloudfront delete-function --name "$FUNC_NAME" --if-match "$ETAG" 2>&1; then
                         echo "   ✅ Deleted $FUNC_NAME"
                      else
                         echo "   ⚠️ Delete failed (likely attached to an active distribution). Skipping."
                      fi
                   fi
                else
                   echo "   ⚠️ Could not fetch ETag. Skipping."
                fi
             done
          else
             echo "   ✅ No orphaned CloudFront functions found."
          fi

      - name: Cleanup ALB Target Groups
        if: (inputs.cloud_provider == 'aws' || inputs.cloud_provider == '') && env.PROJECT_KEY != '' && contains(fromJson('["network", "all", "multi-site-network"]'), inputs.target_stack)
        run: |
          PROJECT_KEY="${{ env.PROJECT_KEY }}"
          STAGE_KEY="${{ env.STAGE_KEY }}"
          REGION="${{ inputs.aws_region }}"

          STACK_ID="${{ inputs.stack_id }}"
          echo "🧹 Cleanup ALB Target Groups for Project=${PROJECT_KEY}, Stage=${STAGE_KEY} in $REGION"
          
          pip install boto3 >/dev/null 2>&1 || true
          cat << 'EOF' > tg_cleanup.py
          import boto3
          import sys
          import time

          region = sys.argv[1]
          project = sys.argv[2]
          stage = sys.argv[3]
          dry_run = sys.argv[4].lower() == 'true'
          stack_id = sys.argv[5]

          tagging = boto3.client('resourcegroupstaggingapi', region_name=region)
          elbv2 = boto3.client('elbv2', region_name=region)

          tgs = []
          
          if stack_id and stack_id != "null":
              print(f"🔍 Scanning Target Groups for Blaze:StackID={stack_id}")
              for page in tagging.get_paginator('get_resources').paginate(
                  TagFilters=[{'Key': 'Blaze:StackID', 'Values': [stack_id]}],
                  ResourceTypeFilters=['elasticloadbalancing:targetgroup']
              ):
                  tgs.extend([m['ResourceARN'] for m in page['ResourceTagMappingList']])
          else:
              print(f"🔍 Scanning Target Groups for Blaze:Project={project}, Blaze:Environment={stage}")
              for page in tagging.get_paginator('get_resources').paginate(
                  TagFilters=[{'Key': 'Blaze:Project', 'Values': [project]}, {'Key': 'Blaze:Environment', 'Values': [stage]}],
                  ResourceTypeFilters=['elasticloadbalancing:targetgroup']
              ):
                  tgs.extend([m['ResourceARN'] for m in page['ResourceTagMappingList']])
                  
              for page in tagging.get_paginator('get_resources').paginate(
                  TagFilters=[{'Key': 'Project', 'Values': [project]}, {'Key': 'Stage', 'Values': [stage]}],
                  ResourceTypeFilters=['elasticloadbalancing:targetgroup']
              ):
                  tgs.extend([m['ResourceARN'] for m in page['ResourceTagMappingList']])
          
          tgs = list(set(tgs))

          if not tgs:
              print("   ✅ No Target Groups found.")
              sys.exit(0)

          for tg in tgs:
              print(f"   🗑️ Processing Target Group: {tg}")
              if dry_run:
                  print("      [DRY RUN] Would delete Target Group")
                  continue
              try:
                  elbv2.delete_target_group(TargetGroupArn=tg)
                  print("      ✅ Deleted")
              except elbv2.exceptions.ResourceInUseException:
                  print("      ⚠️ In use! Detaching from Listener Rules...")
                  for lb in elbv2.describe_load_balancers()['LoadBalancers']:
                      for listener in elbv2.describe_listeners(LoadBalancerArn=lb['LoadBalancerArn'])['Listeners']:
                          for rule in elbv2.describe_rules(ListenerArn=listener['ListenerArn'])['Rules']:
                              if rule['IsDefault']:
                                  continue # Can't delete default rule
                              for action in rule['Actions']:
                                  if action.get('TargetGroupArn') == tg or (action.get('ForwardConfig') and any(t['TargetGroupArn'] == tg for t in action['ForwardConfig'].get('TargetGroups', []))):
                                      print(f"      🗑️ Deleting Rule {rule['RuleArn']}")
                                      elbv2.delete_rule(RuleArn=rule['RuleArn'])
                  time.sleep(2)
                  try:
                      elbv2.delete_target_group(TargetGroupArn=tg)
                      print("      ✅ Deleted after rule cleanup")
                  except Exception as e:
                      print(f"      ⚠️ Failed: {e}")
              except Exception as e:
                  print(f"      ⚠️ Failed: {e}")
          EOF
          python3 tg_cleanup.py "$REGION" "$PROJECT_KEY" "$STAGE_KEY" "${{ inputs.dry_run }}" "$STACK_ID"

      - name: Cleanup CloudFront Distributions
        if: (inputs.cloud_provider == 'aws' || inputs.cloud_provider == '') && env.PROJECT_KEY != '' && contains(fromJson('["app", "cdn", "all", "multi-site-app", "tenant-app"]'), inputs.target_stack)
        run: |
          PROJECT_KEY="${{ env.PROJECT_KEY }}"
          STAGE_KEY="${{ env.STAGE_KEY }}"

          echo "🧹 Cleanup CloudFront Distributions for Project=${PROJECT_KEY}, Stage=${STAGE_KEY}"
          
          pip install boto3 >/dev/null 2>&1 || true
          cat << 'EOF' > cf_cleanup.py
          import boto3
          import sys
          import time

          project = sys.argv[1]
          stage = sys.argv[2]
          dry_run = sys.argv[3].lower() == 'true'
          stack_id = sys.argv[4]

          tagging = boto3.client('resourcegroupstaggingapi', region_name='us-east-1')
          cf = boto3.client('cloudfront', region_name='us-east-1')

          dists = []
          
          if stack_id and stack_id != "null":
              print(f"🔍 Scanning CloudFront Distributions for Blaze:StackID={stack_id}")
              for page in tagging.get_paginator('get_resources').paginate(
                  TagFilters=[{'Key': 'Blaze:StackID', 'Values': [stack_id]}],
                  ResourceTypeFilters=['cloudfront:distribution']
              ):
                  dists.extend([m['ResourceARN'].split('/')[-1] for m in page['ResourceTagMappingList']])
          else:
              print(f"🔍 Scanning CloudFront Distributions for Blaze:Project={project}, Blaze:Environment={stage}")
              for page in tagging.get_paginator('get_resources').paginate(
                  TagFilters=[{'Key': 'Blaze:Project', 'Values': [project]}, {'Key': 'Blaze:Environment', 'Values': [stage]}],
                  ResourceTypeFilters=['cloudfront:distribution']
              ):
                  dists.extend([m['ResourceARN'].split('/')[-1] for m in page['ResourceTagMappingList']])
                  
              for page in tagging.get_paginator('get_resources').paginate(
                  TagFilters=[{'Key': 'Project', 'Values': [project]}, {'Key': 'Stage', 'Values': [stage]}],
                  ResourceTypeFilters=['cloudfront:distribution']
              ):
                  dists.extend([m['ResourceARN'].split('/')[-1] for m in page['ResourceTagMappingList']])
                  
          dists = list(set(dists))

          if not dists:
              print("   ✅ No CloudFront Distributions found.")
              sys.exit(0)

          print(f"   Found {len(dists)} distributions.")

          for dist in dists:
              if dry_run:
                  print(f"      [DRY RUN] Would disable and delete {dist}")
                  continue
              try:
                  config_resp = cf.get_distribution_config(Id=dist)
                  config = config_resp['DistributionConfig']
                  if config['Enabled']:
                      print(f"      🔄 Disabling {dist}...")
                      config['Enabled'] = False
                      cf.update_distribution(DistributionConfig=config, Id=dist, IfMatch=config_resp['ETag'])
                  else:
                      print(f"      🔄 {dist} already disabled.")
              except Exception as e:
                  print(f"      ⚠️ Error checking {dist}: {e}")

          if dry_run:
              sys.exit(0)

          print("   ⏳ Waiting for distributions to deploy (max 15 mins)...")
          pending = list(dists)
          timeout = 60
          while pending and timeout > 0:
              for dist in list(pending):
                  try:
                      resp = cf.get_distribution(Id=dist)
                      if resp['Distribution']['Status'] == 'Deployed':
                          print(f"      🗑️ Deleting {dist}...")
                          cf.delete_distribution(Id=dist, IfMatch=cf.get_distribution_config(Id=dist)['ETag'])
                          pending.remove(dist)
                  except Exception as e:
                      if 'NoSuchDistribution' in str(e):
                          pending.remove(dist)
                      else:
                          print(f"      ⚠️ Error checking {dist}: {e}")
              if pending:
                  time.sleep(15)
                  timeout -= 1
          EOF
          STACK_ID="${{ inputs.stack_id }}"
          python3 cf_cleanup.py "$PROJECT_KEY" "$STAGE_KEY" "${{ inputs.dry_run }}" "$STACK_ID"

      - name: Cleanup Zombie Cloudflare Records
        if: env.PROJECT_KEY != ''
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [[ -z "$CF_API_TOKEN" ]]; then
             echo "Skipping Cloudflare cleanup: CLOUDFLARE_API_TOKEN not provided."
             exit 0
          fi

          DOMAIN="thisisblaze.uk" # Fallback/Default
          # In a real scenario we might want to pass domain_root as input, but for this specific "validation" record issue:

          echo "🔍 Checking for zombie Cloudflare records..."

          # Patterns to clean
          # 1. Validation records (ACM)
          # 2. Specific host records for the stage being destroyed

          RECORDS=(
            "validation.${DOMAIN}" 
          )

          for REC_NAME in "${RECORDS[@]}"; do
             echo "   Checking $REC_NAME"
             REC_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?name=$REC_NAME" \
               -H "Authorization: Bearer $CF_API_TOKEN" \
               -H "Content-Type: application/json" | jq -r '.result[0].id // empty')
               
             if [[ -n "$REC_ID" ]]; then
                echo "      🗑️ Deleting $REC_NAME ($REC_ID)"
                if [[ "${{ inputs.dry_run }}" == "true" ]]; then
                   echo "         [DRY RUN] Would delete Cloudflare record"
                else
                   curl -s -X DELETE "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$REC_ID" \
                      -H "Authorization: Bearer $CF_API_TOKEN" >/dev/null
                fi
             else
                echo "      ✅ Not found"
             fi
          done

      - name: Cleanup Lambda@Edge
        if: (inputs.cloud_provider == 'aws' || inputs.cloud_provider == '') && env.CLIENT_KEY != '' && contains(fromJson('["network", "all", "multi-site-network"]'), inputs.target_stack)
        run: |
          NAMESPACE="${{ env.NAMESPACE }}"
          CLIENT_KEY="${{ env.CLIENT_KEY }}"
          PROJECT_KEY="${{ env.PROJECT_KEY }}"
          STAGE_KEY="${{ env.STAGE_KEY }}"

          STACK_ID="${{ inputs.stack_id }}"

          if [[ -n "$STACK_ID" && "$STACK_ID" != "null" ]]; then
            TAGGED_ARNS=$(aws resourcegroupstaggingapi get-resources \
              --region us-east-1 \
              --tag-filters "Key=Blaze:StackID,Values=${STACK_ID}" \
              --resource-type-filters "lambda:function" \
              --query 'ResourceTagMappingList[*].ResourceARN' \
              --output text 2>/dev/null || echo "")
          else
            TAGGED_ARNS_V2=$(aws resourcegroupstaggingapi get-resources \
              --region us-east-1 \
              --tag-filters "Key=Blaze:Project,Values=${PROJECT_KEY}" "Key=Blaze:Environment,Values=${STAGE_KEY}" \
              --resource-type-filters "lambda:function" \
              --query 'ResourceTagMappingList[*].ResourceARN' \
              --output text 2>/dev/null || echo "")
              
            TAGGED_ARNS_V1=$(aws resourcegroupstaggingapi get-resources \
              --region us-east-1 \
              --tag-filters "Key=Project,Values=${PROJECT_KEY}" "Key=Stage,Values=${STAGE_KEY}" \
              --resource-type-filters "lambda:function" \
              --query 'ResourceTagMappingList[*].ResourceARN' \
              --output text 2>/dev/null || echo "")

            TAGGED_ARNS=$(echo "$TAGGED_ARNS_V1 $TAGGED_ARNS_V2" | tr ' ' '\n' | grep -v 'None' | sort -u || true)
          fi

          FUNCTIONS=$(echo "$TAGGED_ARNS" | tr '\t' '\n' | awk -F':' '{print $NF}' | grep -v 'None' | sort -u | grep . || true)

          if [[ -n "$FUNCTIONS" && "$FUNCTIONS" != "None" ]]; then
             for FUNC_NAME in $FUNCTIONS; do
                echo "   🔄 Checking function: $FUNC_NAME"
                if [[ "${{ inputs.dry_run }}" == "true" ]]; then
                   echo "   [DRY RUN] Would delete function $FUNC_NAME"
                elif aws lambda delete-function --function-name "$FUNC_NAME" --region us-east-1 2>&1; then
                   echo "   ✅ Deleted $FUNC_NAME"
                else
                   echo "   ⚠️ Delete failed (likely Replicated). Skipping."
                fi
             done
          else
             echo "   ok: No functions found."
          fi

      - name: Cleanup CodeDeploy Apps
        if: (inputs.cloud_provider == 'aws' || inputs.cloud_provider == '') && env.STAGE_KEY != '' && contains(fromJson('["app", "cdn", "all", "multi-site-app", "tenant-app"]'), inputs.target_stack)
        run: |
          STAGE_KEY="${{ env.STAGE_KEY }}"
          REGION="${{ inputs.aws_region }}"

          echo "🧹 Cleanup CodeDeploy Applications for Stage: $STAGE_KEY in $REGION"

          # Find all apps ending with "-${STAGE_KEY}-app" or contains it
          APPS=$(aws deploy list-applications --region "$REGION" --query "applications[?contains(@, '-${STAGE_KEY}-app')]" --output text)

          if [[ -n "$APPS" && "$APPS" != "None" ]]; then
             for APP in $APPS; do
                echo "      🗑️ Deleting CodeDeploy App: $APP"
                if [[ "${{ inputs.dry_run }}" == "true" ]]; then
                   echo "         [DRY RUN] Would delete App"
                else
                   aws deploy delete-application --application-name "$APP" --region "$REGION" || echo "      ⚠️ Failed to delete CodeDeploy App"
                fi
             done
          else
             echo "      ✅ No CodeDeploy Apps found"
          fi

      - name: Cleanup EC2 Capacity Provider
        if: (inputs.cloud_provider == 'aws' || inputs.cloud_provider == '') && env.CLIENT_KEY != '' && contains(fromJson('["network", "all", "multi-site-network"]'), inputs.target_stack)
        run: |
          NAMESPACE="${{ env.NAMESPACE }}"
          CLIENT_KEY="${{ env.CLIENT_KEY }}"
          PROJECT_KEY="${{ env.PROJECT_KEY }}"
          STAGE_KEY="${{ env.STAGE_KEY }}"
          REGION="${{ inputs.aws_region }}"
          CLUSTER="${{ inputs.cluster_name }}"
          RESOURCE_PREFIX="${NAMESPACE}-${CLIENT_KEY}-${PROJECT_KEY}-${STAGE_KEY}"

          echo "🖥️ EC2 Capacity Provider Cleanup for $RESOURCE_PREFIX in $REGION"

          # ---------------------------------------------------------
          # 1. Find and scale down ASG
          # ---------------------------------------------------------
          echo "   🔍 Searching for ASG matching prefix ${RESOURCE_PREFIX}-..."
          ASG_NAME=$(aws autoscaling describe-auto-scaling-groups \
            --region "$REGION" \
            --query "AutoScalingGroups[?starts_with(AutoScalingGroupName, '${RESOURCE_PREFIX}-') && contains(AutoScalingGroupName, '-ecs-ec2-cp')].AutoScalingGroupName | [0]" \
            --output text 2>/dev/null || echo "None")
          
          if [[ "$ASG_NAME" == "null" ]]; then ASG_NAME="None"; fi
          echo "   🔍 Evaluated ASG: $ASG_NAME"
          
          ASG_EXISTS="$ASG_NAME"

          if [[ -n "$ASG_EXISTS" && "$ASG_EXISTS" != "None" ]]; then
             if [[ "${{ inputs.dry_run }}" == "true" ]]; then
                echo "      [DRY RUN] Would scale ASG $ASG_NAME to 0 and wait"
             else
                echo "      🛡️ Force-disabling scale-in protection on all ASG instances..."
                 INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" --region "$REGION" --query "AutoScalingGroups[0].Instances[*].InstanceId" --output text 2>/dev/null || echo "")
                 if [[ -n "$INSTANCE_IDS" && "$INSTANCE_IDS" != "None" ]]; then
                    aws autoscaling set-instance-protection --instance-ids $INSTANCE_IDS --auto-scaling-group-name "$ASG_NAME" --no-protected-from-scale-in --region "$REGION" || echo "      ⚠️ Failed to disable scale-in protection"
                 fi

                 echo "      📉 Suspending Auto-Scaling processes and forcing size to 0..."
                aws autoscaling suspend-processes \
                  --auto-scaling-group-name "$ASG_NAME" \
                  --scaling-processes Launch ReplaceUnhealthy \
                  --region "$REGION" || echo "      ⚠️ Failed to suspend ASG processes"

                aws autoscaling update-auto-scaling-group \
                  --auto-scaling-group-name "$ASG_NAME" \
                  --min-size 0 --max-size 0 --desired-capacity 0 \
                  --region "$REGION" || echo "      ⚠️ Failed to scale ASG"

                # Wait for instances to drain (max 3 minutes)
                echo "      ⏳ Waiting for instances to drain..."
                timeout=180
                elapsed=0
                while [ $elapsed -lt $timeout ]; do
                   INSTANCE_COUNT=$(aws autoscaling describe-auto-scaling-groups \
                     --auto-scaling-group-names "$ASG_NAME" \
                     --region "$REGION" \
                     --query "AutoScalingGroups[0].Instances | length(@)" \
                     --output text 2>/dev/null || echo "0")
                   if [[ "$INSTANCE_COUNT" == "0" ]]; then
                      echo "      ✅ All instances drained"
                      break
                   fi
                   echo "      ... $INSTANCE_COUNT instances remaining"
                   sleep 15
                   elapsed=$((elapsed+15))
                done

                echo "      🗑️ Explicitly deleting Auto Scaling Group: $ASG_NAME"
                aws autoscaling delete-auto-scaling-group --auto-scaling-group-name "$ASG_NAME" --force-delete --region "$REGION" || echo "      ⚠️ Failed to delete ASG"
                
                # Wait for ASG to be completely removed (unblocks Launch Template deletion)
                echo "      ⏳ Waiting for ASG to be fully deleted..."
                timeout=180
                elapsed=0
                while [ $elapsed -lt $timeout ]; do
                   ASG_CHECK=$(aws autoscaling describe-auto-scaling-groups \
                     --auto-scaling-group-names "$ASG_NAME" \
                     --region "$REGION" \
                     --query "AutoScalingGroups" \
                     --output text 2>/dev/null || echo "")
                   if [[ -z "$ASG_CHECK" || "$ASG_CHECK" == "None" ]]; then
                      echo "      ✅ ASG fully deleted"
                      break
                   fi
                   echo "      ... still waiting for ASG deletion"
                   sleep 15
                   elapsed=$((elapsed+15))
                done
             fi
          else
             echo "      ✅ ASG not found (no EC2 capacity provider)"
          fi

          # ---------------------------------------------------------
          # 2. Deregister ECS Capacity Provider (if exists)
          # ---------------------------------------------------------
          CP_NAME="${RESOURCE_PREFIX}-ecs-ec2-cp"
          echo "   🔍 Checking Capacity Provider: $CP_NAME"
          CP_EXISTS=$(aws ecs describe-capacity-providers \
            --capacity-providers "$CP_NAME" \
            --region "$REGION" \
            --query "capacityProviders[0].name" \
            --output text 2>/dev/null || echo "None")

          if [[ -n "$CP_EXISTS" && "$CP_EXISTS" != "None" && "$CP_EXISTS" != "FARGATE" ]]; then
             if [[ "${{ inputs.dry_run }}" == "true" ]]; then
                echo "      [DRY RUN] Would detach capacity provider $CP_NAME and explicitly delete it"
             else
                echo "      🔄 Removing capacity provider from cluster strategy..."
                # Get current providers minus the EC2 one
                CURRENT_CPS=$(aws ecs describe-clusters \
                  --clusters "$CLUSTER" \
                  --region "$REGION" \
                  --query "clusters[0].capacityProviders" \
                  --output json 2>/dev/null || echo "[]")

                # If aws cli outputs "null" (even with whitespace), jq's type=="array" safely handles it
                FILTERED_CPS=$(echo "$CURRENT_CPS" | jq -r --arg cp "$CP_NAME" 'if type=="array" then [.[] | select(. != $cp)] else [] end')
                
                # If filtering leaves nothing (or just FARGATE implicit), fallback to default FARGATE/SPOT
                # This is crucial because `put-cluster-capacity-providers` requires at least one provider strategy if clearing others.
                if [[ "$FILTERED_CPS" == "[]" ]]; then
                   echo "      ⚠️ No other providers left. Defaulting to FARGATE/FARGATE_SPOT to detach EC2 CP."
                   aws ecs put-cluster-capacity-providers \
                     --cluster "$CLUSTER" \
                     --capacity-providers FARGATE FARGATE_SPOT \
                     --default-capacity-provider-strategy capacityProvider=FARGATE,weight=1 \
                     --region "$REGION" || echo "      ⚠️ Failed to reset cluster strategy"
                else
                    aws ecs put-cluster-capacity-providers \
                      --cluster "$CLUSTER" \
                      --capacity-providers $(echo "$FILTERED_CPS" | jq -r '.[]') \
                      --default-capacity-provider-strategy capacityProvider=FARGATE,weight=1 \
                      --region "$REGION" || echo "      ⚠️ Failed to update cluster strategy"
                fi
                
                echo "      ✅ Capacity provider detached from cluster."
                
                # EXPLICITLY DELETE THE CAPACITY PROVIDER
                # Terraform hangs if it exists but is not in state, or if it's just disassociated but still "active"
                echo "      🗑️ Explicitly deleting Capacity Provider: $CP_NAME"
                aws ecs delete-capacity-provider --capacity-provider "$CP_NAME" --region "$REGION" || echo "      ⚠️ Failed to delete capacity provider resource"
             fi
          else
             echo "      ✅ Capacity provider not found"
          fi

      - name: Cleanup Launch Templates
        if: (inputs.cloud_provider == 'aws' || inputs.cloud_provider == '') && env.CLIENT_KEY != '' && contains(fromJson('["network", "all", "multi-site-network"]'), inputs.target_stack)
        run: |
          NAMESPACE="${{ env.NAMESPACE }}"
          CLIENT_KEY="${{ env.CLIENT_KEY }}"
          PROJECT_KEY="${{ env.PROJECT_KEY }}"
          STAGE_KEY="${{ env.STAGE_KEY }}"
          REGION="${{ inputs.aws_region }}"

          echo "🚀 Searching for Launch Template matching ${PROJECT_KEY} and ${STAGE_KEY}-ecs-ec2-cp-lt in $REGION..."

          # Check if exists
          LT_INFO=$(aws ec2 describe-launch-templates \
              --filters "Name=launch-template-name,Values=*${PROJECT_KEY}*${STAGE_KEY}-ecs-ec2-cp-lt*" \
              --region "$REGION" \
              --query "LaunchTemplates[0].[LaunchTemplateId, LaunchTemplateName]" \
              --output text 2>/dev/null || echo "None None")

          LT_ID=$(echo "$LT_INFO" | awk '{print $1}')
          LT_NAME=$(echo "$LT_INFO" | awk '{print $2}')

          if [[ "$LT_ID" == "null" || "$LT_ID" == "None" ]]; then LT_ID="None"; fi

          if [[ -n "$LT_ID" && "$LT_ID" != "None" ]]; then
             echo "      🗑️ Deleting Launch Template: $LT_NAME ($LT_ID)"
             if [[ "${{ inputs.dry_run }}" == "true" ]]; then
                echo "         [DRY RUN] Would delete Launch Template"
             else
                aws ec2 delete-launch-template --launch-template-id "$LT_ID" --region "$REGION" || echo "      ⚠️ Failed to delete Launch Template"
             fi
          else
             echo "      ✅ Launch Template not found"
          fi

      - name: Cleanup ECS Services
        if: (inputs.cloud_provider == 'aws' || inputs.cloud_provider == '') && contains(fromJson('["app", "cdn", "all", "multi-site-app", "tenant-app"]'), inputs.target_stack)
        id: cleanup
        run: |
          set -e
          CLUSTER="${{ inputs.cluster_name }}"
          STAGE_FILTER="${{ inputs.stage_filter }}"
          PROJECT_KEY="${{ env.PROJECT_KEY }}"

          echo "🧹 Cleaning up ECS Services in $CLUSTER..."

          if [[ -n "$STAGE_FILTER" ]]; then
             echo "   🎯 Stage filter enabled: $STAGE_FILTER"
          fi

          STACK_ID="${{ inputs.stack_id }}"
          
          if [[ -n "$STACK_ID" && "$STACK_ID" != "null" ]]; then
            echo "🔍 Scanning for services targeting Blaze:StackID=${STACK_ID}"
            SERVICES=$(aws resourcegroupstaggingapi get-resources \
              --region "${{ inputs.aws_region }}" \
              --tag-filters "Key=Blaze:StackID,Values=${STACK_ID}" \
              --resource-type-filters "ecs:service" \
              --query 'ResourceTagMappingList[*].ResourceARN' \
              --output text 2>/dev/null | tr '\t' '\n' || echo "")
          else
            echo "🔍 Scanning for services targeting Project=${PROJECT_KEY}, Stage=${STAGE_KEY}"
            SERVICES=$(aws resourcegroupstaggingapi get-resources \
              --region "${{ inputs.aws_region }}" \
              --tag-filters "Key=Blaze:Project,Values=${PROJECT_KEY}" "Key=Blaze:Environment,Values=${STAGE_KEY}" \
              --resource-type-filters "ecs:service" \
              --query 'ResourceTagMappingList[*].ResourceARN' \
              --output text 2>/dev/null | tr '\t' '\n' || echo "")
          fi
          if [[ -z "$SERVICES" || "$SERVICES" == "None" ]]; then
             echo "✅ No active services found"
             echo "status=no_services" >> "$GITHUB_OUTPUT"
             echo "services=" >> "$GITHUB_OUTPUT"
             exit 0
          fi

          if [[ -n "$STAGE_FILTER" ]]; then
             SERVICES_FILTERED=$(echo "$SERVICES" | grep -F "-${STAGE_FILTER}-" || echo "")
             if [[ -z "$SERVICES_FILTERED" ]]; then
               echo "✅ No services matched stage_filter"
               echo "status=no_services" >> "$GITHUB_OUTPUT"
               echo "services=" >> "$GITHUB_OUTPUT"
               exit 0
             fi
             SERVICES="$SERVICES_FILTERED"
          fi

          DELETED_SERVICES=""
          while IFS= read -r SVC_ARN; do
             [[ -z "$SVC_ARN" ]] && continue
             SVC_NAME=$(echo "$SVC_ARN" | sed 's|.*/||')
             echo "🔄 Processing service: $SVC_NAME"
             
             if [[ "${{ inputs.dry_run }}" == "true" ]]; then
                echo "   [DRY RUN] Would stop tasks and delete service $SVC_NAME"
                DELETED_SERVICES="${DELETED_SERVICES}${SVC_NAME} "
                continue
             fi
             
             aws ecs update-service --cluster "$CLUSTER" --service "$SVC_NAME" --desired-count 0 --region "${{ inputs.aws_region }}" >/dev/null 2>&1 || true
             
             # Wait for tasks to stop (Simplified)
             timeout=300
             elapsed=0
             while [ $elapsed -lt $timeout ]; do
                RUNNING_TASKS=$(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$SVC_NAME" --desired-status RUNNING --region "${{ inputs.aws_region }}" --query "length(taskArns)" --output text 2>/dev/null || echo "0")
                if [[ "$RUNNING_TASKS" == "0" ]]; then
                   break
                fi
                sleep 10
                elapsed=$((elapsed+10))
             done

             # Force Stop if needed
             if [[ $elapsed -ge $timeout ]]; then
                RUNNING_TASKS=$(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$SVC_NAME" --region "${{ inputs.aws_region }}" --query "taskArns[]" --output text 2>/dev/null || echo "")
                if [[ -n "$RUNNING_TASKS" && "$RUNNING_TASKS" != "None" ]]; then
                   for TASK in $RUNNING_TASKS; do
                      aws ecs stop-task --cluster "$CLUSTER" --task "$TASK" --region "${{ inputs.aws_region }}" >/dev/null 2>&1 || true
                   done
                   sleep 30
                fi
             fi
             
             aws ecs delete-service --cluster "$CLUSTER" --service "$SVC_NAME" --force --region "${{ inputs.aws_region }}" >/dev/null 2>&1 || true
             echo "   ✅ Deleted $SVC_NAME"
             DELETED_SERVICES="${DELETED_SERVICES}${SVC_NAME} "
          done <<< "$SERVICES"

          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "services=$DELETED_SERVICES" >> "$GITHUB_OUTPUT"

          # ---------------------------------------------------------
          # 📋 CLEANUP TASK DEFINITIONS (Attempt)
          # ---------------------------------------------------------
          if [[ -n "${{ inputs.environment }}" ]]; then
             echo "      Searching for task definition families via Tags for project=${PROJECT_KEY}, stage=${{ inputs.environment }} (V2 schema)..."
             # Extract all tagged task definitions across all revisions mapping to the footprint
             # NOTE: Must filter by BOTH blaze:project AND blaze:stage to prevent cross-project task def sweeps
             STACK_ID="${{ inputs.stack_id }}"
             if [[ -n "$STACK_ID" && "$STACK_ID" != "null" ]]; then
               echo "      Searching for task definition families via Tags for StackID=${STACK_ID}..."
               TAGGED_ARNS=$(aws resourcegroupstaggingapi get-resources \
                 --region "${{ inputs.aws_region }}" \
                 --tag-filters "Key=Blaze:StackID,Values=${STACK_ID}" \
                 --resource-type-filters "ecs:task-definition" \
                 --query "ResourceTagMappingList[*].ResourceARN" \
                 --output text 2>/dev/null || echo "")
             else
               TAGGED_ARNS=$(aws resourcegroupstaggingapi get-resources \
                 --region "${{ inputs.aws_region }}" \
                 --tag-filters "Key=Blaze:Project,Values=${PROJECT_KEY}" "Key=Blaze:Environment,Values=${{ inputs.environment }}" \
                 --resource-type-filters "ecs:task-definition" \
                 --query "ResourceTagMappingList[*].ResourceARN" \
                 --output text 2>/dev/null || echo "")
             fi

             FAMILIES=""
             for ARN in $TAGGED_ARNS; do
               # Extract family name by stripping path and revision version
               REST="${ARN##*:task-definition/}"
               FAMILY="${REST%:*}"
               if [[ " $FAMILIES " != *" $FAMILY "* ]]; then
                 FAMILIES="$FAMILIES $FAMILY"
               fi
             done
             
             if [[ -z "$FAMILIES" || "$FAMILIES" == "None" ]]; then
                echo "      ✅ No orphaned families found for environment ${{ inputs.environment }}."
             else
                for FAMILY in $FAMILIES; do
                   echo "      Cleaning task defs for $FAMILY..."
                   
                   # Get all revisions
                   TASK_DEF_ARNS=$(aws ecs list-task-definitions --family-prefix "$FAMILY" --region "${{ inputs.aws_region }}" --query "taskDefinitionArns[]" --output text 2>/dev/null || echo "")
                   if [[ -n "$TASK_DEF_ARNS" && "$TASK_DEF_ARNS" != "None" ]]; then
                      if [[ "${{ inputs.dry_run }}" == "true" ]]; then
                         echo "         [DRY RUN] Would delete and deregister task definitions for $FAMILY"
                      else
                         for ARN in $TASK_DEF_ARNS; do
                            aws ecs delete-task-definitions --task-definitions "$ARN" --region "${{ inputs.aws_region }}" >/dev/null 2>&1 || \
                            aws ecs deregister-task-definition --task-definition "$ARN" --region "${{ inputs.aws_region }}" >/dev/null || true
                         done
                         echo "         ✅ Swept $FAMILY"
                      fi
                   fi
                done
             fi
          fi

      - name: Disable DocumentDB Deletion Protection (Pre-Destroy)
        # Plan 152 Phase 3: DocumentDB deletion_protection blocks terraform destroy on prod clusters.
        # Must be disabled BEFORE terraform destroy runs — Terraform cannot modify deletion_protection
        # on a cluster that is being destroyed in the same plan (circular dependency).
        # Uses tag-based discovery (Blaze:Project + Blaze:Environment) to find clusters safely.
        if: (inputs.cloud_provider == 'aws' || inputs.cloud_provider == '') && env.PROJECT_KEY != ''
        run: |
          PROJECT_KEY="${{ env.PROJECT_KEY }}"
          STAGE_KEY="${{ env.STAGE_KEY }}"
          REGION="${{ inputs.aws_region }}"

          echo "🗄️ Scanning for DocumentDB clusters tagged Blaze:Project=${PROJECT_KEY}, Blaze:Environment=${STAGE_KEY}..."

          # Discover clusters by tag (governance-safe — no string-prefix regex)
          STACK_ID="${{ inputs.stack_id }}"
          
          if [[ -n "$STACK_ID" && "$STACK_ID" != "null" ]]; then
            echo "🗄️ Scanning for DocumentDB clusters tagged Blaze:StackID=${STACK_ID}..."
            CLUSTER_ARNS=$(aws resourcegroupstaggingapi get-resources \
              --region "$REGION" \
              --tag-filters "Key=Blaze:StackID,Values=${STACK_ID}" \
              --resource-type-filters "rds:cluster" \
              --query 'ResourceTagMappingList[*].ResourceARN' \
              --output text 2>/dev/null || echo "")
          else
            echo "🗄️ Scanning for DocumentDB clusters tagged Blaze:Project=${PROJECT_KEY}, Blaze:Environment=${STAGE_KEY}..."
            CLUSTER_ARNS=$(aws resourcegroupstaggingapi get-resources \
              --region "$REGION" \
              --tag-filters "Key=Blaze:Project,Values=${PROJECT_KEY}" "Key=Blaze:Environment,Values=${STAGE_KEY}" \
              --resource-type-filters "rds:cluster" \
              --query 'ResourceTagMappingList[*].ResourceARN' \
              --output text 2>/dev/null || echo "")
          fi

          if [[ -z "$CLUSTER_ARNS" || "$CLUSTER_ARNS" == "None" ]]; then
            echo "   ✅ No DocumentDB clusters found for ${PROJECT_KEY}/${STAGE_KEY} — skipping."
            exit 0
          fi

          for CLUSTER_ARN in $CLUSTER_ARNS; do
            # Extract cluster identifier from ARN: arn:aws:rds:region:account:cluster:id
            CLUSTER_ID="${CLUSTER_ARN##*:cluster:}"

            # Verify it is a DocDB cluster (not an RDS Aurora cluster sharing the same tags)
            ENGINE=$(aws docdb describe-db-clusters \
              --db-cluster-identifier "$CLUSTER_ID" \
              --query 'DBClusters[0].Engine' \
              --output text 2>/dev/null || echo "None")

            if [[ "$ENGINE" != "docdb" ]]; then
              echo "   ℹ️  $CLUSTER_ID is engine='$ENGINE' — not a DocumentDB cluster, skipping."
              continue
            fi

            DELETION_PROTECTION=$(aws docdb describe-db-clusters \
              --db-cluster-identifier "$CLUSTER_ID" \
              --query 'DBClusters[0].DeletionProtection' \
              --output text 2>/dev/null || echo "False")

            if [[ "$DELETION_PROTECTION" == "True" ]]; then
              echo "   🔓 Cluster $CLUSTER_ID has deletion_protection=true — disabling..."
              if [[ "${{ inputs.dry_run }}" == "true" ]]; then
                echo "   [DRY RUN] Would run: aws docdb modify-db-cluster --db-cluster-identifier $CLUSTER_ID --no-deletion-protection"
              else
                aws docdb modify-db-cluster \
                  --db-cluster-identifier "$CLUSTER_ID" \
                  --no-deletion-protection \
                  --region "$REGION" && \
                  echo "   ✅ Deletion protection disabled on $CLUSTER_ID" || \
                  echo "   ⚠️ Failed to disable deletion protection on $CLUSTER_ID"
              fi
            else
              echo "   ✅ Cluster $CLUSTER_ID deletion_protection already disabled — skipping."
            fi
          done

      - name: Cleanup Network Dependencies (ENIs & NACLs)
        if: (inputs.cloud_provider == 'aws' || inputs.cloud_provider == '') && contains(fromJson('["network", "multi-site-network", "all"]'), inputs.target_stack)
        run: |
          STAGE_KEY="${{ env.STAGE_KEY }}"
          REGION="${{ inputs.aws_region }}"

          VPC_ID=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=*${STAGE_KEY}-vpc" --region "$REGION" --query "Vpcs[0].VpcId" --output text 2>/dev/null || echo "None")
          if [[ "$VPC_ID" == "None" || -z "$VPC_ID" ]]; then
             echo "   ✅ VPC not found. Skipping network cleanup."
             exit 0
          fi
          
          echo "🧹 Cleaning up Network Dependencies (NACLs & ENIs) for VPC: $VPC_ID"

          # 1. Reset Custom Network ACLs to Default
          DEFAULT_NACL=$(aws ec2 describe-network-acls --filters "Name=vpc-id,Values=$VPC_ID" "Name=default,Values=true" --region "$REGION" --query "NetworkAcls[0].NetworkAclId" --output text 2>/dev/null || echo "None")
          
          if [[ "$DEFAULT_NACL" != "None" ]]; then
             CUSTOM_NACLS=$(aws ec2 describe-network-acls --filters "Name=vpc-id,Values=$VPC_ID" "Name=default,Values=false" --region "$REGION" --query "NetworkAcls[].NetworkAclId" --output text 2>/dev/null || echo "")
             
             if [[ -n "$CUSTOM_NACLS" && "$CUSTOM_NACLS" != "None" ]]; then
                for NACL in $CUSTOM_NACLS; do
                   echo "   🔄 Resetting Subnet Associations for Custom NACL: $NACL"
                   ASSOCS=$(aws ec2 describe-network-acls --network-acl-ids "$NACL" --region "$REGION" --query "NetworkAcls[0].Associations[].NetworkAclAssociationId" --output text 2>/dev/null || echo "")
                   for ASSOC in $ASSOCS; do
                      if [[ "${{ inputs.dry_run }}" == "true" ]]; then
                         echo "      [DRY RUN] Would replace network acl association $ASSOC with default $DEFAULT_NACL"
                      else
                         aws ec2 replace-network-acl-association --association-id "$ASSOC" --network-acl-id "$DEFAULT_NACL" --region "$REGION" || true
                      fi
                   done
                   if [[ "${{ inputs.dry_run }}" == "true" ]]; then
                      echo "      [DRY RUN] Would delete Custom NACL $NACL"
                   else
                      aws ec2 delete-network-acl --network-acl-id "$NACL" --region "$REGION" || true
                   fi
                done
             fi
          fi

          # 2. Force delete dangling ENIs
          ENIS=$(aws ec2 describe-network-interfaces --filters "Name=vpc-id,Values=$VPC_ID" --region "$REGION" --query "NetworkInterfaces[?Status=='available'].NetworkInterfaceId" --output text 2>/dev/null || echo "")
          if [[ -n "$ENIS" && "$ENIS" != "None" ]]; then
             for ENI in $ENIS; do
                echo "   🗑️ Deleting available dangling ENI: $ENI"
                if [[ "${{ inputs.dry_run }}" == "true" ]]; then
                   echo "      [DRY RUN] Would delete ENI"
                else
                   aws ec2 delete-network-interface --network-interface-id "$ENI" --region "$REGION" || true
                fi
             done
          fi
          
          # 3. Handle stuck 'in-use' ENIs (Detach then Delete)
          STUCK_ENIS=$(aws ec2 describe-network-interfaces --filters "Name=vpc-id,Values=$VPC_ID" --region "$REGION" --query "NetworkInterfaces[?Attachment!=null].[NetworkInterfaceId,Attachment.AttachmentId]" --output text 2>/dev/null || echo "")
          if [[ -n "$STUCK_ENIS" && "$STUCK_ENIS" != "None" ]]; then
             while read -r ENI ATT; do
                if [[ -z "$ENI" ]]; then continue; fi
                if [[ "${{ inputs.dry_run }}" == "true" ]]; then
                   echo "      [DRY RUN] Would detach and delete ENI $ENI (Attachment: $ATT)"
                else
                   echo "   🔪 Force detaching ENI: $ENI"
                   aws ec2 detach-network-interface --attachment-id "$ATT" --force --region "$REGION" || true
                   # AWS takes a few seconds to detach
                   sleep 5
                   aws ec2 delete-network-interface --network-interface-id "$ENI" --region "$REGION" || true
                fi
             done <<< "$STUCK_ENIS"
          fi

          echo "tasks_deleted=true" >> "$GITHUB_OUTPUT"
