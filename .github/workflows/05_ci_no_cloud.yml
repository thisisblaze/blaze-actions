name: 05 ✅ CI (No Cloud)

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pin-guard:
    name: 🔒 Pin Guard (no @dev refs)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: "Fail on any active @dev reference (Plan 158 §1.3)"
        run: |
          echo "## 🔒 Pin Guard Results" >> "$GITHUB_STEP_SUMMARY"
          # Match active workflow `uses:` lines pinned to @dev. Commented lines
          # (starting with #) are ignored. @dev in a main-branch path is a
          # production incident waiting to happen.
          HITS=$(grep -rnE '^[[:space:]]*uses:[[:space:]]*\S+@dev([[:space:]]|$)' \
            .github/workflows .github/actions 2>/dev/null || true)
          if [ -z "$HITS" ]; then
            echo "✅ No '@dev' references found in workflows or actions." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$HITS"
            {
              echo '❌ Found `@dev` pins — replace with a released tag before merge:'
              echo '```'
              echo "$HITS"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  actionlint:
    name: 🧩 Workflow Lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run actionlint (all workflows)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.11
          echo "## 🧩 actionlint Results" >> "$GITHUB_STEP_SUMMARY"
          # -shellcheck '' disables shellcheck integration (style noise); actionlint still checks
          # all GitHub Actions-specific expression/type errors natively.
          ISSUES=$(./actionlint -shellcheck '' -oneline \
            .github/workflows/*.yml 2>&1)
          EXIT=$?
          if [ -z "$ISSUES" ] && [ $EXIT -eq 0 ]; then
            echo "✅ No issues found across all workflow files." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$ISSUES"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$ISSUES" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "❌ Issues found — merge is blocked until fixed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  config-validation:
    name: 📋 Environment Config Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Caller Repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Checkout Actions Repo for Schema
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: thisisblaze/blaze-actions
          path: .actions-shared

      - name: Validate JSON configurations against schema
        run: |
          echo "## 📋 Config Validation Results" >> "$GITHUB_STEP_SUMMARY"
          
          # Find all blaze-env.json files recursively
          CONFIG_FILES=$(find vars/ -name "blaze-env.json" 2>/dev/null || true)
          
          if [ -z "$CONFIG_FILES" ]; then
            echo "ℹ️ No blaze-env.json files found to validate in this repository." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          
          echo "Validating config files: $CONFIG_FILES"
          
          # Run ajv-cli validation
          npx -y ajv-cli validate \
            -s .actions-shared/.github/schemas/blaze-env.schema.json \
            -d "vars/**/blaze-env.json"
          
          if [ $? -eq 0 ]; then
            echo "✅ All environment configuration files are valid against the schema." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ JSON Schema validation failed. Check job logs for details." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

