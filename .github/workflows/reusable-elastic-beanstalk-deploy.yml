name: Reusable Elastic Beanstalk Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      application_name:
        required: true
        type: string
      environment_name:
        required: true
        type: string
      aws_region:
        required: false
        type: string
        default: "eu-west-1"
      s3_bucket:
        description: 'Optional S3 bucket for deployment bundle. If omitted, uses default EB bucket.'
        required: false
        type: string
        default: ""
      build_command:
        description: 'Optional build command to run before zipping the artifact (e.g. composer install or shopware-cli project build)'
        required: false
        type: string
        default: ""
      php_version:
        description: 'Optional PHP version to set up before running build commands (e.g. "8.4")'
        required: false
        type: string
        default: ""
    secrets:
      AWS_ROLE_ARN:
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  id-token: write # OIDC cloud auth

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        if: inputs.php_version != ''
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ inputs.php_version }}
          tools: composer:v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Create Deployment Bundle
        run: |
          cat << 'EOF' > build_script.sh
          ${{ inputs.build_command }}
          EOF
          bash build_script.sh
          rm build_script.sh
          echo "Packaging application source code and .ebextensions..."
          zip -r build.zip . -x "*.git*" ".github/*" ".agents/*" "tests/*"
          echo "Build bundle created."

      - name: Deploy to Elastic Beanstalk
        run: |
          VERSION_LABEL="${GITHUB_SHA}-${GITHUB_RUN_ID}"
          APP_NAME="${{ inputs.application_name }}"
          ENV_NAME="${{ inputs.environment_name }}"
          
          if [ -z "${{ inputs.s3_bucket }}" ]; then
            echo "No S3 bucket specified. Fetching default Elastic Beanstalk bucket..."
            EB_BUCKET=$(aws elasticbeanstalk create-storage-location --query 'S3Bucket' --output text)
          else
            EB_BUCKET="${{ inputs.s3_bucket }}"
          fi
          
          echo "Using S3 Bucket: $EB_BUCKET"
          S3_KEY="${APP_NAME}/${VERSION_LABEL}.zip"
          
          # Upload bundle
          aws s3 cp build.zip s3://$EB_BUCKET/$S3_KEY
          
          # Create Application Version
          aws elasticbeanstalk create-application-version \
            --application-name "$APP_NAME" \
            --version-label "$VERSION_LABEL" \
            --source-bundle S3Bucket="$EB_BUCKET",S3Key="$S3_KEY"
          
          # Trigger Environment Update
          echo "Triggering environment update..."
          aws elasticbeanstalk update-environment \
            --application-name "$APP_NAME" \
            --environment-name "$ENV_NAME" \
            --version-label "$VERSION_LABEL"
            
          # Publish Version to SSM for Terraform to consume
          echo "Publishing VERSION_LABEL to SSM Parameter Store..."
          aws ssm put-parameter \
            --name "/eb/${APP_NAME}/latest_version" \
            --value "$VERSION_LABEL" \
            --type "String" \
            --overwrite
          
          echo "Deployment initiated. Please check the AWS Console for health status."
