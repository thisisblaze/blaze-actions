name: "♻️ 🚀 Phase 3: Deploy"

on:
  workflow_call:
    inputs:
      environment:
        description: "Target Environment"
        required: true
        type: string

      project:
        description: "Project (App Identity) - e.g. thisisblaze, support"
        required: false
        default: "thisisblaze"
        type: string

      target_type:
        description: "What to test"
        required: false
        default: "host"
        type: string

      app_stack:
        description: "App stack type (tenant-app or multi-site-app). Controls which
          deploy path is used."
        required: false
        default: "tenant-app"
        type: string

      branch_tag:
        description: "Feature branch tag (required if target_type=feature-branch)"
        required: false
        type: string

      mode:
        description: "Execution Mode"
        required: false
        default: "standard"
        type: string

      include_third_party:
        description: "Include third-party stacks (MongoDB, Elastic, Cloudflare)"
        required: false
        default: false
        type: boolean

      preserve_host:
        description: "Preserve host network"
        required: false
        default: false
        type: boolean

      cloud_provider:
        required: false
        type: string
        default: aws

      wif_audience:
        required: false
        type: string
        default: ""
    secrets:
      BLAZE_ELASTICSEARCH_USERNAME:
        required: false
      BLAZE_ELASTICSEARCH_PASSWORD:
        required: false
      BLAZE_ELASTICSEARCH_ENDPOINT:
        required: false
      AWS_ROLE_ARN:
        required: false
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: false
      GCP_SERVICE_ACCOUNT:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      CLOUDFLARE_ZONE_ID:
        required: false
      GH_PAT:
        required: false
      NPM_TOKEN:
        required: false
      INFRACOST_API_KEY:
        required: false
      BLAZE_CONNECTION_STRING:
        required: false
      BLAZE_AUTH_JWT_PRIVATE_KEY:
        required: false
      BLAZE_AUTH_ADMIN_EMAIL:
        required: false
      BLAZE_AUTH_ADMIN_PASSWORD:
        required: false
      BLAZE_FILES_S3_ACCESS_KEY:
        required: false
      BLAZE_FILES_S3_SECRET_ACCESS_KEY:
        required: false
      BLAZE_GRAPHQL_CACHE_SETTINGS:
        required: false
      BLAZE_CLIENT_HEADER:
        required: false
      EC_API_KEY:
        required: false
      MONGODB_ATLAS_PUBLIC_KEY:
        required: false
      MONGODB_ATLAS_PRIVATE_KEY:
        required: false
      MONGODB_ATLAS_ORG_ID:
        required: false
      MONGODB_ATLAS_PROJECT_ID:
        required: false
      ACM_CERTIFICATE_ARN:
        required: false
      BLAZE_SENTRY_AUTH_TOKEN:
        required: false
      BLAZE_SENTRY_DSN:
        required: false
      SLACK_WEBHOOK_URL:
        required: false
      DEPLOY_KEY:
        required: false
      BASIC_AUTH_CREDENTIALS:
        required: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # --------------------------------------------------------------------------------
  # 1. SETUP & CONFIG
  # --------------------------------------------------------------------------------
  setup:
    name: "Initialize"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      terraform_stack: ${{ steps.calc.outputs.stack }}
      branch_tag: ${{ steps.calc.outputs.tag }}
    steps:
      - id: calc
        run: |
          if [[ "${{ inputs.target_type }}" == "feature-branch" ]]; then
            echo "stack=app" >> $GITHUB_OUTPUT
            echo "tag=${{ inputs.branch_tag }}" >> $GITHUB_OUTPUT
          else
            echo "stack=network" >> $GITHUB_OUTPUT
            echo "tag=" >> $GITHUB_OUTPUT
          fi

  config:
    name: "⚙️ Config"
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      stage_key: ${{ steps.calc.outputs.stage_key }}
      bucket: ${{ steps.calc.outputs.bucket }}
      lock_table: ${{ steps.calc.outputs.lock_table }}
      state_key: ${{ steps.calc.outputs.state_key }}
      tf_dir: ${{ steps.calc.outputs.tf_dir }}
      cluster_name: ${{ steps.calc.outputs.cluster_name }}
      env_val: ${{ steps.calc.outputs.env_val }}
      aws_region: ${{ steps.calc.outputs.aws_region }}
      client_key: ${{ steps.calc.outputs.client_key }}
      project_key: ${{ steps.calc.outputs.project_key }}
      namespace: ${{ steps.calc.outputs.namespace }}
      platform: ${{ steps.calc.outputs.platform }}
      cloud_provider: ${{ steps.calc.outputs.cloud_provider }}
      cloud_region: ${{ steps.calc.outputs.cloud_region }}
      infra_prefix: ${{ steps.calc.outputs.infra_prefix }}
      gcp_project_id: ${{ steps.calc.outputs.gcp_project_id }}
      domain_root: ${{ steps.calc.outputs.domain_root }}
      allowed_infra_users: ${{ steps.calc.outputs.allowed_infra_users }}
      gcp_docker_repo: ${{ steps.calc.outputs.gcp_docker_repo }}
      azure_acr_name: ${{ steps.calc.outputs.azure_acr_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Checkout Actions
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: thisisblaze/blaze-actions
          path: .blaze-actions
          ref: dev

      - name: Calculate Configuration
        id: calc
        uses: ./.blaze-actions/.github/actions/calculate-env-config
        with:
          environment: ${{ inputs.environment }}
          project: ${{ inputs.project }}
          terraform_stack: ${{ needs.setup.outputs.terraform_stack }}
          branch_tag: ${{ needs.setup.outputs.branch_tag }}
          cloud_provider: ${{ inputs.cloud_provider }}

  # --------------------------------------------------------------------------------
  # 5. DEPLOY
  # --------------------------------------------------------------------------------
  # V1 path: separate api/frontend ECS services (tenant-app, feature-branch)
  deploy-app:
    permissions:
      contents: read
      id-token: write
    if: always() && inputs.mode != 'destroy-only' && inputs.app_stack != 
      'multi-site-app'
    needs: [config]
    name: "🚀 Deploy App"
    uses: thisisblaze/blaze-actions/.github/workflows/02-deploy-app.yml@main
    with:
      environment: ${{ inputs.environment }}
      project: ${{ inputs.project }}
      target_services: "Blaze all"
      # Hybrid ECS: Prod uses EC2/ARM64, Dev/Stage use FARGATE/X86_64
      api_launch_type: ${{ contains(inputs.environment, 'prod') && 'EC2' || 'FARGATE' }}
      api_cpu_architecture: ${{ contains(inputs.environment, 'prod') && 'ARM64' || 'X86_64' }}
      frontend_launch_type: ${{ contains(inputs.environment, 'prod') && 'EC2' || 'FARGATE' }}
      # Stress test: skip ECS stabilisation wait — infra uses placeholder images, real images deployed in CI
      skip_stability_wait: "${{ 'true' }}"
      cloud_provider: ${{ inputs.cloud_provider }}
      wif_audience: ${{ inputs.wif_audience }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MONGODB_ATLAS_PUBLIC_KEY: ${{ secrets.MONGODB_ATLAS_PUBLIC_KEY }}
      MONGODB_ATLAS_PRIVATE_KEY: ${{ secrets.MONGODB_ATLAS_PRIVATE_KEY }}
      MONGODB_ATLAS_PROJECT_ID: ${{ secrets.MONGODB_ATLAS_PROJECT_ID }}
      MONGODB_ATLAS_ORG_ID: ${{ secrets.MONGODB_ATLAS_ORG_ID }}
      BLAZE_AUTH_JWT_PRIVATE_KEY: ${{ secrets.BLAZE_AUTH_JWT_PRIVATE_KEY }}
      BLAZE_AUTH_ADMIN_EMAIL: ${{ secrets.BLAZE_AUTH_ADMIN_EMAIL }}
      BLAZE_AUTH_ADMIN_PASSWORD: ${{ secrets.BLAZE_AUTH_ADMIN_PASSWORD }}
      BLAZE_CONNECTION_STRING: ${{ secrets.BLAZE_CONNECTION_STRING }}
      BLAZE_ELASTICSEARCH_USERNAME: ${{ secrets.BLAZE_ELASTICSEARCH_USERNAME }}
      BLAZE_ELASTICSEARCH_PASSWORD: ${{ secrets.BLAZE_ELASTICSEARCH_PASSWORD }}
      BLAZE_FILES_S3_ACCESS_KEY: ${{ secrets.BLAZE_FILES_S3_ACCESS_KEY }}
      BLAZE_FILES_S3_SECRET_ACCESS_KEY: ${{ secrets.BLAZE_FILES_S3_SECRET_ACCESS_KEY }}
      BLAZE_GRAPHQL_CACHE_SETTINGS: ${{ secrets.BLAZE_GRAPHQL_CACHE_SETTINGS }}
      BLAZE_CLIENT_HEADER: ${{ secrets.BLAZE_CLIENT_HEADER }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Multi-Site V2 AWS deploy path: cluster has site-NNN services, not api/frontend.
  # Force-deploys each discovered site service so ECS picks up the provisioned
  # task definition. skip_stability_wait is implicit — stress test validates
  # infra cycle, not pod readiness.
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-multi-site:
    permissions:
      contents: read
      id-token: write
    if: always() && inputs.mode != 'destroy-only' && inputs.app_stack == 
      'multi-site-app' && (inputs.cloud_provider == 'aws' || 
      inputs.cloud_provider == '')
    needs: [config]
    name: "🌐 Deploy Multi-Site Apps (AWS)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37     # v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ needs.config.outputs.aws_region || 'eu-west-1' }}

      - name: Force-Deploy Site ECS Services
        env:
          CLUSTER_NAME: ${{ needs.config.outputs.cluster_name }}
          REGION: ${{ needs.config.outputs.aws_region || 'eu-west-1' }}
        run: |
          echo "🌐 Multi-Site ECS Deploy"
          echo "   Cluster: $CLUSTER_NAME"
          echo "   Region:  $REGION"

          # Discover all site-NNN service ARNs from the cluster
          ALL_ARNS=$(aws ecs list-services \
            --cluster "$CLUSTER_NAME" \
            --region "$REGION" \
            --query 'serviceArns' \
            --output text 2>/dev/null | tr '\t' '\n' || echo "")

          SITE_ARNS=$(echo "$ALL_ARNS" | grep -E '/.*-site-[0-9]+$' || echo "")

          if [[ -z "$SITE_ARNS" ]]; then
            echo "⚠️  No site-NNN services found in cluster '$CLUSTER_NAME'"
            echo "   This may mean infrastructure was not provisioned yet — check Phase 2 logs."
            exit 0
          fi

          echo ""
          echo "📋 Site services to deploy:"
          echo "$SITE_ARNS" | while IFS= read -r ARN; do
            [[ -z "$ARN" ]] && continue
            SVC=$(echo "$ARN" | awk -F'/' '{print $NF}')
            echo "   → $SVC"
          done
          echo ""

          PASSED=0
          FAILED=0
          SKIPPED=0

          while IFS= read -r ARN; do
            [[ -z "$ARN" ]] && continue
            SVC=$(echo "$ARN" | awk -F'/' '{print $NF}')

            STATUS=$(aws ecs describe-services \
              --cluster "$CLUSTER_NAME" \
              --services "$SVC" \
              --region "$REGION" \
              --query 'services[0].status' \
              --output text 2>/dev/null || echo "MISSING")

            if [[ "$STATUS" != "ACTIVE" ]]; then
              echo "⚠️  $SVC — status=$STATUS, skipping"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            aws ecs update-service \
              --cluster "$CLUSTER_NAME" \
              --service "$SVC" \
              --force-new-deployment \
              --region "$REGION" \
              --output text > /dev/null 2>&1 \
              && { echo "✅ $SVC — new deployment triggered"; PASSED=$((PASSED + 1)); } \
              || { echo "❌ $SVC — update-service failed"; FAILED=$((FAILED + 1)); }

          done <<< "$SITE_ARNS"

          echo ""
          echo "📊 Result: ✅ $PASSED deployed | ⏭️ $SKIPPED skipped | ❌ $FAILED failed"

          if [[ $FAILED -gt 0 ]]; then
            echo "::error::$FAILED site service(s) failed to update. Review ECS console."
            exit 1
          fi

          echo "✅ Multi-site deploy complete"
