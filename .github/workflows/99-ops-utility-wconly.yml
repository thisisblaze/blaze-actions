name: "99 Ops Utility (WC only test)"

on:
  workflow_call:
    inputs:
      cloud_provider:
        type: string
        default: "aws"
        required: false
      action:
        type: string
        required: true
      environment:
        type: string
        required: false
      stack:
        type: string
        required: false
      branch_tag:
        type: string
        required: false
      confirmation:
        type: string
        required: false
      run_id:
        type: string
        required: false
      manage_action:
        type: string
        default: "stop"
        required: false
      desired_count:
        type: string
        default: "0"
        required: false
      retention_count:
        type: string
        default: "5"
        required: false
      retention_days:
        type: string
        default: "30"
        required: false
      dry_run:
        type: string
        default: "true"
        required: false
      bulk_pattern:
        type: string
        required: false
      skip_lambda_destroy:
        type: string
        required: false
        default: "true"
      dist_id:
        type: string
        required: false
    secrets:
      BLAZE_ELASTICSEARCH_USERNAME:
        required: false
      BLAZE_ELASTICSEARCH_PASSWORD:
        required: false
      BLAZE_ELASTICSEARCH_ENDPOINT:
        required: false
      AWS_ROLE_ARN:
        required: false
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: false
      GCP_SERVICE_ACCOUNT:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      CLOUDFLARE_ZONE_ID:
        required: false
      GH_PAT:
        required: false
      NPM_TOKEN:
        required: false
      INFRACOST_API_KEY:
        required: false
      BLAZE_CONNECTION_STRING:
        required: false
      BLAZE_AUTH_JWT_PRIVATE_KEY:
        required: false
      BLAZE_AUTH_ADMIN_EMAIL:
        required: false
      BLAZE_AUTH_ADMIN_PASSWORD:
        required: false
      BLAZE_FILES_S3_ACCESS_KEY:
        required: false
      BLAZE_FILES_S3_SECRET_ACCESS_KEY:
        required: false
      DEPLOY_KEY:
        required: false
      MONGODB_ATLAS_PUBLIC_KEY:
        required: false
      MONGODB_ATLAS_PRIVATE_KEY:
        required: false
      MONGODB_ATLAS_ORG_ID:
        required: false
      MONGODB_ATLAS_PROJECT_ID:
        required: false
      SLACK_WEBHOOK_URL:
        required: false
      BLAZE_SENTRY_DSN:
        required: false
      BLAZE_SENTRY_AUTH_TOKEN:
        required: false
      SONAR_TOKEN:
        required: false
      BLAZE_CLIENT_HEADER:
        required: false
      EC_API_KEY:
        required: false
      BLAZE_GRAPHQL_CACHE_SETTINGS:
        required: false
      ACM_CERTIFICATE_ARN:
        required: false

concurrency:
  group: ops-util-${{ inputs.environment }}-${{ inputs.cloud_provider }}-${{ inputs.action }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dummy:
    runs-on: ubuntu-latest
    steps:
      - run: echo "dummy job"
