name: "99 - Ops (Sync SSM Secrets)"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment"
        type: choice
        options: ["DEV", "STAGE", "PROD"]
        required: true
      services:
        description: "Services to sync"
        type: choice
        options:
          - "all"
          - "mongodb"
          - "elastic"
        default: "all"
      sync_github:
        description: "Sync to GitHub Secrets?"
        type: boolean
        default: true

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  configuration:
    permissions:
      contents: read
      id-token: write
    name: Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      stage_key: ${{ steps.config.outputs.stage_key }}
      project_key: ${{ steps.config.outputs.project_key }}
      client_key: ${{ steps.config.outputs.client_key }}
      platform: ${{ steps.config.outputs.platform }}
      aws_region: ${{ steps.config.outputs.aws_region }}
      namespace: ${{ steps.config.outputs.namespace }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Load AWS Region from Config
        id: load-region
        run: |
          AWS_REGION=$(jq -r '.common.AWS_REGION' vars/blaze-env.json)
          if [[ -z "$AWS_REGION" ]]; then
            echo "❌ ERROR: AWS_REGION not set in vars/blaze-env.json"
            exit 1
          fi
          echo "aws_region=$AWS_REGION" >> "$GITHUB_OUTPUT"
          echo "✅ Using AWS Region: $AWS_REGION (from vars/blaze-env.json)"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ steps.load-region.outputs.aws_region }}

      - name: Calculate Configuration
        id: config
        uses: thisisblaze/blaze-actions/.github/actions/calculate-config@v2.12.12
        with:
          environment: ${{ inputs.environment }}
          terraform_stack: "app"
          branch_name: ""
          deploy_infra: "false"
          build_images: "false"
          deploy_services: "false"
          event_name: "workflow_dispatch"

  sync-mongodb:
    permissions:
      contents: read
      id-token: write
    name: Sync MongoDB Credentials
    needs: [configuration]
    if: ${{ inputs.services == 'all' || inputs.services == 'mongodb' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ needs.configuration.outputs.aws_region }}

      - name: Fetch MongoDB Credentials from SSM
        id: mongodb
        run: |
          STAGE="${{ needs.configuration.outputs.stage_key }}"
          CLIENT="${{ needs.configuration.outputs.client_key }}"
          PLATFORM="${{ needs.configuration.outputs.platform }}"
          NAMESPACE="${{ needs.configuration.outputs.namespace }}"
          PREFIX="/${NAMESPACE}/${CLIENT}/${PLATFORM}/${STAGE}/mongodb"

          # get <param> [decrypt] — read one SSM param; empty on miss (no silent blank later).
          get() {
            if [ "${2:-}" = "decrypt" ]; then
              aws ssm get-parameter --name "$1" --with-decryption --query 'Parameter.Value' --output text 2>/dev/null || true
            else
              aws ssm get-parameter --name "$1" --query 'Parameter.Value' --output text 2>/dev/null || true
            fi
          }
          # require <value> <name> — fail LOUD (runs in the step shell, so exit propagates).
          require() {
            if [ -z "${1:-}" ] || [ "$1" = "None" ]; then
              echo "❌ ERROR: required SSM parameter missing/empty: $2"
              echo "   Run 'terraform apply' for third-party-mongodb in this environment first."
              exit 1
            fi
          }
          # warn_optional <value> <name> — log a skip, never blank a secret silently.
          warn_optional() { { [ -z "${1:-}" ] || [ "$1" = "None" ]; } && echo "⚠️  optional SSM parameter missing (skipped): $2"; return 0; }

          MONGODB_URI=$(get "${PREFIX}/uri" decrypt);              require "$MONGODB_URI" "${PREFIX}/uri"
          MONGODB_USERNAME=$(get "${PREFIX}/username");            require "$MONGODB_USERNAME" "${PREFIX}/username"
          MONGODB_PASSWORD=$(get "${PREFIX}/password" decrypt);    require "$MONGODB_PASSWORD" "${PREFIX}/password"
          MONGODB_HOST=$(get "${PREFIX}/host");                    require "$MONGODB_HOST" "${PREFIX}/host"
          MONGODB_DATABASE=$(get "${PREFIX}/database");            require "$MONGODB_DATABASE" "${PREFIX}/database"
          MONGODB_ADMIN_USERNAME=$(get "${PREFIX}/admin-username");         warn_optional "$MONGODB_ADMIN_USERNAME" "${PREFIX}/admin-username"
          MONGODB_ADMIN_PASSWORD=$(get "${PREFIX}/admin-password" decrypt); warn_optional "$MONGODB_ADMIN_PASSWORD" "${PREFIX}/admin-password"

          # Mask ALL sensitive values (defense in depth — usernames/host included).
          for v in "$MONGODB_URI" "$MONGODB_USERNAME" "$MONGODB_PASSWORD" \
                   "$MONGODB_ADMIN_USERNAME" "$MONGODB_ADMIN_PASSWORD" "$MONGODB_HOST"; do
            [ -n "$v" ] && echo "::add-mask::$v"
          done

          # Export to outputs
          {
            echo "uri=$MONGODB_URI"
            echo "username=$MONGODB_USERNAME"
            echo "password=$MONGODB_PASSWORD"
            echo "admin_username=$MONGODB_ADMIN_USERNAME"
            echo "admin_password=$MONGODB_ADMIN_PASSWORD"
            echo "host=$MONGODB_HOST"
            echo "database=$MONGODB_DATABASE"
          } >> "$GITHUB_OUTPUT"

          echo "✅ Successfully fetched MongoDB credentials from SSM"

      - name: Sync to GitHub Secrets
        if: ${{ inputs.sync_github }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STAGE_UPPER=$(echo "${{ needs.configuration.outputs.stage_key }}" | tr '[:lower:]' '[:upper:]')

          # Update GitHub Secrets
          gh secret set "MONGODB_URI_${STAGE_UPPER}" --body "${{ steps.mongodb.outputs.uri }}"
          gh secret set "MONGODB_USERNAME_${STAGE_UPPER}" --body "${{ steps.mongodb.outputs.username }}"
          gh secret set "MONGODB_PASSWORD_${STAGE_UPPER}" --body "${{ steps.mongodb.outputs.password }}"
          gh secret set "MONGODB_ADMIN_USERNAME_${STAGE_UPPER}" --body "${{ steps.mongodb.outputs.admin_username }}"
          gh secret set "MONGODB_ADMIN_PASSWORD_${STAGE_UPPER}" --body "${{ steps.mongodb.outputs.admin_password }}"
          gh secret set "MONGODB_HOST_${STAGE_UPPER}" --body "${{ steps.mongodb.outputs.host }}"
          gh secret set "MONGODB_DATABASE_${STAGE_UPPER}" --body "${{ steps.mongodb.outputs.database }}"

          echo "✅ MongoDB credentials synced to GitHub Secrets"

  sync-elastic:
    permissions:
      contents: read
      id-token: write
    name: Sync Elastic Credentials
    needs: [configuration]
    if: ${{ inputs.services == 'all' || inputs.services == 'elastic' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ needs.configuration.outputs.aws_region }}

      - name: Fetch Elastic Credentials from SSM
        id: elastic
        run: |
          STAGE="${{ needs.configuration.outputs.stage_key }}"
          CLIENT="${{ needs.configuration.outputs.client_key }}"
          PLATFORM="${{ needs.configuration.outputs.platform }}"
          NAMESPACE="${{ needs.configuration.outputs.namespace }}"
          PREFIX="/${NAMESPACE}/${CLIENT}/${PLATFORM}/${STAGE}/elastic"

          # get <param> [decrypt] — read one SSM param; empty on miss (no silent blank later).
          get() {
            if [ "${2:-}" = "decrypt" ]; then
              aws ssm get-parameter --name "$1" --with-decryption --query 'Parameter.Value' --output text 2>/dev/null || true
            else
              aws ssm get-parameter --name "$1" --query 'Parameter.Value' --output text 2>/dev/null || true
            fi
          }
          # require <value> <name> — fail LOUD (runs in the step shell, so exit propagates).
          require() {
            if [ -z "${1:-}" ] || [ "$1" = "None" ]; then
              echo "❌ ERROR: required SSM parameter missing/empty: $2"
              echo "   Run 'terraform apply' for third-party-elastic in this environment first."
              exit 1
            fi
          }
          warn_optional() { { [ -z "${1:-}" ] || [ "$1" = "None" ]; } && echo "⚠️  optional SSM parameter missing (skipped): $2"; return 0; }

          # app-username/app-password SSM params are never written by the elastic-deployment
          # module, so they were dropped here (plan 160) — they only pushed blank GitHub secrets.
          ELASTIC_ENDPOINT=$(get "${PREFIX}/endpoint");          require "$ELASTIC_ENDPOINT" "${PREFIX}/endpoint"
          ELASTIC_USERNAME=$(get "${PREFIX}/username");          require "$ELASTIC_USERNAME" "${PREFIX}/username"
          ELASTIC_PASSWORD=$(get "${PREFIX}/password" decrypt);  require "$ELASTIC_PASSWORD" "${PREFIX}/password"
          KIBANA_ENDPOINT=$(get "${PREFIX}/kibana-endpoint");    warn_optional "$KIBANA_ENDPOINT" "${PREFIX}/kibana-endpoint"
          CLOUD_ID=$(get "${PREFIX}/cloud-id");                  warn_optional "$CLOUD_ID" "${PREFIX}/cloud-id"

          # Mask ALL sensitive values (endpoint/username included).
          for v in "$ELASTIC_ENDPOINT" "$ELASTIC_USERNAME" "$ELASTIC_PASSWORD" "$KIBANA_ENDPOINT" "$CLOUD_ID"; do
            [ -n "$v" ] && echo "::add-mask::$v"
          done

          # Export to outputs
          {
            echo "endpoint=$ELASTIC_ENDPOINT"
            echo "username=$ELASTIC_USERNAME"
            echo "password=$ELASTIC_PASSWORD"
            echo "kibana_endpoint=$KIBANA_ENDPOINT"
            echo "cloud_id=$CLOUD_ID"
          } >> "$GITHUB_OUTPUT"

          echo "✅ Successfully fetched Elastic credentials from SSM"

          echo "✅ Successfully fetched Elastic credentials from SSM"

      - name: Sync to GitHub Secrets
        if: ${{ inputs.sync_github }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STAGE_UPPER=$(echo "${{ needs.configuration.outputs.stage_key }}" | tr '[:lower:]' '[:upper:]')

          # Update GitHub Secrets
          gh secret set "ELASTIC_ENDPOINT_${STAGE_UPPER}" --body "${{ steps.elastic.outputs.endpoint }}"
          gh secret set "ELASTIC_USERNAME_${STAGE_UPPER}" --body "${{ steps.elastic.outputs.username }}"
          gh secret set "ELASTIC_PASSWORD_${STAGE_UPPER}" --body "${{ steps.elastic.outputs.password }}"
          gh secret set "KIBANA_ENDPOINT_${STAGE_UPPER}" --body "${{ steps.elastic.outputs.kibana_endpoint }}"
          gh secret set "ELASTIC_CLOUD_ID_${STAGE_UPPER}" --body "${{ steps.elastic.outputs.cloud_id }}"

          echo "✅ Elastic credentials synced to GitHub Secrets"

  summary:
    name: Summary
    needs: [configuration, sync-mongodb, sync-elastic]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Report Status
        run: |
          echo "## 🔐 Secrets Sync Summary"
          echo ""
          echo "**Environment**: ${{ inputs.environment }} (${{ needs.configuration.outputs.stage_key }})"
          echo "**Services**: ${{ inputs.services }}"
          echo ""
          echo "### Results:"
          echo "- MongoDB: ${{ needs.sync-mongodb.result }}"
          echo "- Elastic: ${{ needs.sync-elastic.result }}"
          echo ""
          if [ "${{ needs.sync-mongodb.result }}" == "success" ] || [ "${{ needs.sync-elastic.result }}" == "success" ]; then
            echo "✅ Secrets successfully synced!"
          else
            echo "⚠️  Some syncs failed. Check logs above."
          fi
