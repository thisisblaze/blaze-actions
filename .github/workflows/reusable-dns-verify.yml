name: "✅ DNS Verify & Activate (Phase C)"

on:
  workflow_call:
    inputs:
      cloud_provider:
        description: "Cloud provider (aws/gcp/azure). Default: aws"
        required: false
        type: string
        default: "aws"
      tf_dir:
        description: "Directory containing Terraform configuration"
        required: true
        type: string
      aws_region:
        description: "AWS Region"
        required: true
        type: string
      environment:
        description: "GitHub Environment (for secrets)"
        required: false
        type: string
      bucket:
        description: "S3 Bucket for State"
        required: true
        type: string
      state_key:
        description: "S3 Key for State"
        required: true
        type: string
      lock_table:
        description: "DynamoDB Table for Locking"
        required: false
        type: string
      terraform_version:
        description: "Terraform Version"
        required: false
        type: string
        default: "1.9.0"
      pre_apply_script:
        description: "Bash script to run after Init but before Plan/Apply"
        required: false
        type: string
      tf_vars:
        description: "Variables string to write to _github_vars.env"
        required: false
        type: string
      wif_audience:
        description: "WIF Audience (Optional)"
        required: false
        type: string

    secrets:
      BLAZE_ELASTICSEARCH_USERNAME:
        required: false
      BLAZE_ELASTICSEARCH_PASSWORD:
        required: false
      BLAZE_ELASTICSEARCH_ENDPOINT:
        required: false
      AWS_ROLE_ARN:
        required: false
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: false
      GCP_SERVICE_ACCOUNT:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ZONE_ID:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      GH_PAT:
        required: false
      NPM_TOKEN:
        required: false
      INFRACOST_API_KEY:
        required: false
      BLAZE_CONNECTION_STRING:
        required: false
      BLAZE_AUTH_JWT_PRIVATE_KEY:
        required: false
      BLAZE_AUTH_ADMIN_EMAIL:
        required: false
      BLAZE_AUTH_ADMIN_PASSWORD:
        required: false
      BLAZE_FILES_S3_ACCESS_KEY:
        required: false
      BLAZE_FILES_S3_SECRET_ACCESS_KEY:
        required: false
      BLAZE_GRAPHQL_CACHE_SETTINGS:
        required: false
      BLAZE_CLIENT_HEADER:
        required: false
      EC_API_KEY:
        required: false
      MONGODB_ATLAS_PUBLIC_KEY:
        required: false
      MONGODB_ATLAS_PRIVATE_KEY:
        required: false
      MONGODB_ATLAS_ORG_ID:
        required: false
      MONGODB_ATLAS_PROJECT_ID:
        required: false
      ACM_CERTIFICATE_ARN:
        required: false
      BLAZE_SENTRY_AUTH_TOKEN:
        required: false
      BLAZE_SENTRY_DSN:
        required: false
      BASIC_AUTH_CREDENTIALS:
        required: false
      SLACK_WEBHOOK_URL:
        required: false
      DEPLOY_KEY:
        required: false

      AZURE_SUBSCRIPTION_ID:
        required: false
      SONAR_TOKEN:
        required: false
jobs:
  check-dns:
    name: "Check DNS Resolution"
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify DNS Records
        id: check
        run: |
          STATE_FILE="docs/dns-handoff/state/${{ inputs.environment }}.json"
          if [ ! -f "$STATE_FILE" ]; then
            echo "State file not found. Nothing to verify."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Short-circuit: already completed → stop polling (avoids hourly re-apply churn).
          STATUS=$(jq -r '.status // "pending"' "$STATE_FILE")
          if [ "$STATUS" = "completed" ]; then
            echo "Handoff for ${{ inputs.environment }} already completed. Nothing to verify."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Hard timeout: stop polling once timeout_at has passed without resolution.
          TIMEOUT_AT=$(jq -r '.timeout_at // empty' "$STATE_FILE")
          if [ -n "$TIMEOUT_AT" ]; then
            NOW_EPOCH=$(date -u +%s)
            TO_EPOCH=$(date -u -d "$TIMEOUT_AT" +%s 2>/dev/null || echo 0)
            if [ "$TO_EPOCH" -ne 0 ] && [ "$NOW_EPOCH" -gt "$TO_EPOCH" ]; then
              echo "::warning::DNS handoff for ${{ inputs.environment }} exceeded timeout_at=$TIMEOUT_AT without resolving — giving up. Re-run handoff (Phase B) to restart the window."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # We should parse the JSON and check each record using dig.
          # For simplicity, if jq and dig are available:
          RECORDS=$(jq -c '.records[]' "$STATE_FILE")

          ALL_RESOLVED=true
          for row in $RECORDS; do
            NAME=$(echo "$row" | jq -r '.name')
            TYPE=$(echo "$row" | jq -r '.type')
            EXPECTED_VALUE=$(echo "$row" | jq -r '.value')
            
            # Use 1.1.1.1 to resolve
            RESOLVED_VALUE=$(dig +short "$TYPE" "$NAME" @1.1.1.1 | tail -n1 | sed 's/"//g')
            
            if [[ "$RESOLVED_VALUE" == *"$EXPECTED_VALUE"* ]] || [[ "$EXPECTED_VALUE" == *"$RESOLVED_VALUE"* ]]; then
              echo "✅ $NAME resolves to $RESOLVED_VALUE"
            else
              echo "❌ $NAME resolves to '$RESOLVED_VALUE', expected '$EXPECTED_VALUE'"
              ALL_RESOLVED=false
            fi
          done

          if [ "$ALL_RESOLVED" = true ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: check-dns
    if: ${{ needs.check-dns.outputs.ready == 'true' }}
    permissions:
      id-token: write
      contents: read
    uses: thisisblaze/blaze-actions/.github/workflows/reusable-terraform.yml@main
    with:
      cloud_provider: ${{ inputs.cloud_provider }}
      tf_dir: ${{ inputs.tf_dir }}
      aws_region: ${{ inputs.aws_region }}
      environment: ${{ inputs.environment }}
      bucket: ${{ inputs.bucket }}
      state_key: ${{ inputs.state_key }}
      lock_table: ${{ inputs.lock_table }}
      terraform_version: ${{ inputs.terraform_version }}
      pre_apply_script: |
        ${{ inputs.pre_apply_script }}
        echo "TF_VAR_cloudflare_zone_id=$(echo -n "$CLOUDFLARE_ZONE_ID" | tr -cd 'a-zA-Z0-9_-')" >> $GITHUB_ENV
        echo "TF_VAR_cloudflare_api_token=$(echo -n "$CLOUDFLARE_API_TOKEN" | tr -cd 'a-zA-Z0-9_-')" >> $GITHUB_ENV
        echo "TF_VAR_cloudflare_account_id=$(echo -n "$CLOUDFLARE_ACCOUNT_ID" | tr -cd 'a-zA-Z0-9_-')" >> $GITHUB_ENV
      wif_audience: ${{ inputs.wif_audience }}
      apply: "true"
      # Phase C: Provision actual DNS records for the domain, and await final ACM validation
      tf_vars: |
        ${{ inputs.tf_vars }}
        manage_dns=false
        await_validation=true
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_PAT: ${{ secrets.GH_PAT }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
      BLAZE_CONNECTION_STRING: ${{ secrets.BLAZE_CONNECTION_STRING }}
      BLAZE_AUTH_JWT_PRIVATE_KEY: ${{ secrets.BLAZE_AUTH_JWT_PRIVATE_KEY }}
      BLAZE_AUTH_ADMIN_EMAIL: ${{ secrets.BLAZE_AUTH_ADMIN_EMAIL }}
      BLAZE_AUTH_ADMIN_PASSWORD: ${{ secrets.BLAZE_AUTH_ADMIN_PASSWORD }}
      BLAZE_FILES_S3_ACCESS_KEY: ${{ secrets.BLAZE_FILES_S3_ACCESS_KEY }}
      BLAZE_FILES_S3_SECRET_ACCESS_KEY: ${{ secrets.BLAZE_FILES_S3_SECRET_ACCESS_KEY }}

  close-issue:
    name: "Close DNS Handoff Issue"
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Update State and Close Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JSON_FILE="docs/dns-handoff/state/${{ inputs.environment }}.json"
          if [ -f "$JSON_FILE" ]; then
            # Update state to completed
            tmp=$(mktemp)
            jq '.status = "completed"' "$JSON_FILE" > "$tmp" && mv "$tmp" "$JSON_FILE"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/dns-handoff/state/
            # Only commit/push if the state actually changed (prevents red runs on re-poll).
            if git diff --staged --quiet; then
              echo "State already marked completed — nothing to commit."
            else
              git commit -m "docs: DNS handoff completed for ${{ inputs.environment }}"
              git push
            fi
          fi

          ISSUE_TITLE="DNS handoff: ${{ inputs.environment }}"
          ISSUE_NUMBER=$(gh issue list --search "in:title \"$ISSUE_TITLE\"" --state open --json number -q '.[0].number')

          if [ -n "$ISSUE_NUMBER" ] && [ "$ISSUE_NUMBER" != "null" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "✅ DNS verification successful! Certificate validated and CDN updated. Closing handoff."
            gh issue close "$ISSUE_NUMBER"
          fi
