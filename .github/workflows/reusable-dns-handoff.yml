name: "🌐 DNS Handoff (Phase A)"

on:
  workflow_call:
    inputs:
      cloud_provider:
        description: "Cloud provider (aws/gcp/azure). Default: aws"
        required: false
        type: string
        default: "aws"
      tf_dir:
        description: "Directory containing Terraform configuration"
        required: true
        type: string
      aws_region:
        description: "AWS Region"
        required: true
        type: string
      environment:
        description: "GitHub Environment (for secrets)"
        required: false
        type: string
      bucket:
        description: "S3 Bucket for State"
        required: true
        type: string
      state_key:
        description: "S3 Key for State"
        required: true
        type: string
      lock_table:
        description: "DynamoDB Table for Locking"
        required: false
        type: string
      terraform_version:
        description: "Terraform Version"
        required: false
        type: string
        default: "1.9.0"
      pre_apply_script:
        description: "Bash script to run after Init but before Plan/Apply"
        required: false
        type: string
      tf_vars:
        description: "Variables string to write to _github_vars.env"
        required: false
        type: string
      wif_audience:
        description: "WIF Audience (Optional)"
        required: false
        type: string

    secrets:
      BLAZE_ELASTICSEARCH_USERNAME:
        required: false
      BLAZE_ELASTICSEARCH_PASSWORD:
        required: false
      BLAZE_ELASTICSEARCH_ENDPOINT:
        required: false
      AWS_ROLE_ARN:
        required: false
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: false
      GCP_SERVICE_ACCOUNT:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ZONE_ID:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      GH_PAT:
        required: false
      NPM_TOKEN:
        required: false
      INFRACOST_API_KEY:
        required: false
      BLAZE_CONNECTION_STRING:
        required: false
      BLAZE_AUTH_JWT_PRIVATE_KEY:
        required: false
      BLAZE_AUTH_ADMIN_EMAIL:
        required: false
      BLAZE_AUTH_ADMIN_PASSWORD:
        required: false
      BLAZE_FILES_S3_ACCESS_KEY:
        required: false
      BLAZE_FILES_S3_SECRET_ACCESS_KEY:
        required: false
      BLAZE_GRAPHQL_CACHE_SETTINGS:
        required: false
      BLAZE_CLIENT_HEADER:
        required: false
      EC_API_KEY:
        required: false
      MONGODB_ATLAS_PUBLIC_KEY:
        required: false
      MONGODB_ATLAS_PRIVATE_KEY:
        required: false
      MONGODB_ATLAS_ORG_ID:
        required: false
      MONGODB_ATLAS_PROJECT_ID:
        required: false
      ACM_CERTIFICATE_ARN:
        required: false
      BLAZE_SENTRY_AUTH_TOKEN:
        required: false
      BLAZE_SENTRY_DSN:
        required: false
      BASIC_AUTH_CREDENTIALS:
        required: false
      SLACK_WEBHOOK_URL:
        required: false
      DEPLOY_KEY:
        required: false

      AZURE_SUBSCRIPTION_ID:
        required: false
jobs:
  handoff:
    uses: 
      thisisblaze/blaze-actions/.github/workflows/reusable-terraform.yml@v2.11.6
    with:
      cloud_provider: ${{ inputs.cloud_provider }}
      tf_dir: ${{ inputs.tf_dir }}
      aws_region: ${{ inputs.aws_region }}
      environment: ${{ inputs.environment }}
      bucket: ${{ inputs.bucket }}
      state_key: ${{ inputs.state_key }}
      lock_table: ${{ inputs.lock_table }}
      terraform_version: ${{ inputs.terraform_version }}
      pre_apply_script: |
        ${{ inputs.pre_apply_script }}
        echo "TF_VAR_cloudflare_zone_id=$(echo -n "$CLOUDFLARE_ZONE_ID" | tr -cd 'a-zA-Z0-9_-')" >> $GITHUB_ENV
        echo "TF_VAR_cloudflare_api_token=$(echo -n "$CLOUDFLARE_API_TOKEN" | tr -cd 'a-zA-Z0-9_-')" >> $GITHUB_ENV
        echo "TF_VAR_cloudflare_account_id=$(echo -n "$CLOUDFLARE_ACCOUNT_ID" | tr -cd 'a-zA-Z0-9_-')" >> $GITHUB_ENV
      wif_audience: ${{ inputs.wif_audience }}
      apply: true
      # Phase A: Request cert, emit records, do NOT wait.
      tf_vars: |
        ${{ inputs.tf_vars }}
        manage_dns=false
        await_validation=false
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER
        }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_PAT: ${{ secrets.GH_PAT }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
      BLAZE_CONNECTION_STRING: ${{ secrets.BLAZE_CONNECTION_STRING }}
      BLAZE_AUTH_JWT_PRIVATE_KEY: ${{ secrets.BLAZE_AUTH_JWT_PRIVATE_KEY }}
      BLAZE_AUTH_ADMIN_EMAIL: ${{ secrets.BLAZE_AUTH_ADMIN_EMAIL }}
      BLAZE_AUTH_ADMIN_PASSWORD: ${{ secrets.BLAZE_AUTH_ADMIN_PASSWORD }}
      BLAZE_FILES_S3_ACCESS_KEY: ${{ secrets.BLAZE_FILES_S3_ACCESS_KEY }}
      BLAZE_FILES_S3_SECRET_ACCESS_KEY: ${{ 
        secrets.BLAZE_FILES_S3_SECRET_ACCESS_KEY }}

  summary:
    name: "Render DNS Handoff Summary (Phase B)"
    needs: handoff
    runs-on: ubuntu-latest
    if: ${{ needs.handoff.outputs.dns_handoff_records_json != '' && 
      needs.handoff.outputs.dns_handoff_records_json != '[]' }}
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Render Markdown and JSON State
        run: |
          mkdir -p docs/dns-handoff/state

          # Render Markdown
          MD_FILE="docs/dns-handoff/${{ inputs.environment }}.md"
          echo "## 🌐 DNS Handoff Required for ${{ inputs.environment }}" > "$MD_FILE"
          echo "The following DNS records must be created manually before proceeding to Phase C:" >> "$MD_FILE"
          echo "" >> "$MD_FILE"
          echo "| Name | Type | Value | Host |" >> "$MD_FILE"
          echo "|------|------|-------|------|" >> "$MD_FILE"
          echo '${{ needs.handoff.outputs.dns_handoff_records_json }}' | jq -r '.[] | "| \(.name) | \(.type) | \(.value) | \(.host) |"' >> "$MD_FILE"

          # Render JSON State (status + 14-day timeout window the poller honours)
          JSON_FILE="docs/dns-handoff/state/${{ inputs.environment }}.json"
          RECORDS_JSON='${{ needs.handoff.outputs.dns_handoff_records_json }}'
          TIMEOUT_AT=$(date -u -d "+14 days" +%Y-%m-%dT%H:%M:%SZ)
          jq -n --argjson recs "$RECORDS_JSON" --arg t "$TIMEOUT_AT" \
            '{status: "pending", timeout_at: $t, attempts: 0, records: $recs}' > "$JSON_FILE"

          # Also append to step summary
          cat "$MD_FILE" >> $GITHUB_STEP_SUMMARY

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dns-handoff/
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: DNS handoff requirements for ${{ inputs.environment }}"
            git push
          fi

      - name: Open or Update GitHub Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE="DNS handoff: ${{ inputs.environment }}"
          MD_FILE="docs/dns-handoff/${{ inputs.environment }}.md"

          # Check if issue exists
          ISSUE_NUMBER=$(gh issue list --search "in:title \"$ISSUE_TITLE\"" --state open --json number -q '.[0].number')

          if [ -z "$ISSUE_NUMBER" ] || [ "$ISSUE_NUMBER" == "null" ]; then
            gh issue create --title "$ISSUE_TITLE" --body-file "$MD_FILE"
          else
            gh issue comment "$ISSUE_NUMBER" --body-file "$MD_FILE"
          fi
