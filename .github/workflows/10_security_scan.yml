name: 🔒 Security Scan

# ------------------------------------------------------------------------------
# GATE POLICY (plan 164 S4 — decided 2026-06-14: "block on infra/CI CRITICAL+HIGH"):
#   • IaC scan (Trivy config)  → BLOCKS the build on CRITICAL/HIGH (exit-code 1).
#   • SAST (Semgrep)           → BLOCKS the build on high/critical (ERROR-level) findings.
#   • App dependency vulns (Trivy fs) → ADVISORY only (exit-code 0) — upstream CVEs we
#     can't always fix immediately must not block deploys; reported in PR comments.
#   • Secret scanning (Gitleaks) → BLOCKS (GITLEAKS_EXIT_CODE=1).
# SARIF artifact uploads remain non-blocking (informational).
# ------------------------------------------------------------------------------

on:
  pull_request:
    branches: [main, master, dev]
  push:
    branches: [main, master, dev]
  schedule:
    - cron: "0 0 * * 0" # Weekly deep scan on Sunday

# Least-privilege default for ALL jobs; elevated scopes are granted per-job below
# (id-token only on the Scorecard job, pull-requests only on the reporting job).
permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ------------------------------------------------------------------
  # JOB 1: SECRET SCANNING (Fail Fast)
  # ------------------------------------------------------------------
  secrets:
    name: 🔐 Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1 # Scan current state only (faster)

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_SUMMARY: true
          GITLEAKS_EXIT_CODE: 1 # Fail on secrets found

      - name: Upload Gitleaks Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gitleaks-results
          path: |
            gitleaks-report.json
            gitleaks-report.sarif
          if-no-files-found: ignore
          retention-days: 7

  # ------------------------------------------------------------------
  # JOB 2: SAST (Semgrep) - Diff Aware
  # ------------------------------------------------------------------
  sast:
    name: 🔍 SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: secrets
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # Needed for diff calculation

      - name: Get Changed Files
        id: changed-files
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | \
            grep -E '\.(js|ts|jsx|tsx)$' > changed_files.txt || true

          if [ -s changed_files.txt ]; then
            echo "files=$(cat changed_files.txt | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Changed files:"
          cat changed_files.txt || echo "No changed files"

      - name: Install Semgrep
        run: |
          python3 -m pip install --upgrade semgrep

      - name: Run Semgrep Scan
        id: semgrep-scan
        continue-on-error: true # Don't fail workflow on findings, we'll handle it in reporting
        run: |
          # Build config list
          CONFIGS="p/default p/react p/security-audit p/typescript"

          # Build paths - scan changed files in PRs, full scan otherwise
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ steps.changed-files.outputs.has_changes }}" == "true" ]]; then
            PATHS="${{ steps.changed-files.outputs.files }}"
          else
            PATHS="."
          fi

          # Run Semgrep scan with SARIF output
          semgrep scan \
            --config "$CONFIGS" \
            --sarif --output=semgrep.sarif \
            --exclude="**/node_modules" \
            --exclude="**/dist" \
            --exclude="**/build" \
            --exclude="**/__tests__" \
            --exclude="**/*.test.js" \
            --exclude="**/*.test.ts" \
            --exclude="**/*.spec.js" \
            --exclude="**/*.spec.ts" \
            "$PATHS" || true

          # Count findings
          if [ -f "semgrep.sarif" ]; then
            FINDINGS=$(jq -r '.runs[0].results | length // 0' semgrep.sarif 2>/dev/null || echo "0")
            echo "findings=$FINDINGS" >> "$GITHUB_OUTPUT"
            echo "has_findings=$([ "$FINDINGS" -gt 0 ] && echo "true" || echo "false")" >> "$GITHUB_OUTPUT"
          else
            echo "findings=0" >> "$GITHUB_OUTPUT"
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Semgrep CI (for PR comments)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          # Run semgrep ci for PR comments (separate from scan)
          semgrep ci \
            --config "p/default p/react p/security-audit p/typescript" \
            --exclude="**/node_modules" \
            --exclude="**/dist" \
            --exclude="**/build" \
            --exclude="**/__tests__" \
            --exclude="**/*.test.js" \
            --exclude="**/*.test.ts" \
            --exclude="**/*.spec.js" \
            --exclude="**/*.spec.ts" || true

      - name: 🚦 SAST gate (block on high/critical)
        run: |
          set -euo pipefail
          if [ ! -f semgrep.sarif ]; then
            echo "❌ semgrep.sarif missing — scan did not produce output"; exit 1
          fi
          HIGH=$(jq '[.runs[0].results[]? | select(.level=="error")] | length' semgrep.sarif 2>/dev/null || echo 0)
          echo "High/critical (ERROR-level) SAST findings: ${HIGH:-0}"
          if [ "${HIGH:-0}" -gt 0 ]; then
            echo "❌ SAST gate failed: ${HIGH} high/critical finding(s). See PR comments / the semgrep-results artifact."
            exit 1
          fi
          echo "✅ SAST gate passed (no high/critical findings)."

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: semgrep-results
          path: semgrep.sarif
          if-no-files-found: ignore
          retention-days: 7

  # ------------------------------------------------------------------
  # JOB 3: SCA (Trivy) & Lockfile Validation
  # ------------------------------------------------------------------
  dependencies:
    name: 📦 Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: secrets
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cache Trivy DB
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .trivy
          key: ${{ runner.os }}-trivy-db
          restore-keys: |
            ${{ runner.os }}-trivy-db-

      - name: Run Trivy (Console Log)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          ignore-unfixed: false
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0" # Don't fail yet, just show logs
          cache-dir: ".trivy"
          hide-progress: true

      - name: Run Trivy (Filesystem)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          ignore-unfixed: false
          format: "sarif"
          output: "trivy.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          cache-dir: ".trivy"
          exit-code: "0" # Don't fail on app vulnerabilities (User Request: Focus on Infra/CI only)

      - name: Validate Lockfile Integrity
        run: |
          echo "🔍 Validating lockfile integrity..."

          # Check for lockfiles
          if [ -f "package-lock.json" ]; then
            echo "Found package-lock.json"
            npx --yes lockfile-lint --path package-lock.json --type npm \
              --validate-https \
              --allowed-hosts npm yarn || echo "⚠️ Lockfile validation failed"
          elif [ -f "yarn.lock" ]; then
            echo "Found yarn.lock"
            npx --yes lockfile-lint --path yarn.lock --type yarn \
              --validate-https \
              --allowed-hosts npm yarn || echo "⚠️ Lockfile validation failed"
          elif [ -f "pnpm-lock.yaml" ]; then
            echo "Found pnpm-lock.yaml"
            echo "⚠️ pnpm lockfile validation not yet supported by lockfile-lint"
          else
            echo "⚠️ No lockfile found. Consider adding one for security."
          fi

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-results
          path: trivy.sarif
          if-no-files-found: ignore
          retention-days: 7

  iac-security:
    name: 🛡️ IaC Security Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: secrets
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run Trivy Config Scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: "config"
          scan-ref: "."
          hide-progress: true
          format: "sarif"
          output: "trivy-iac.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: iac-results
          path: trivy-iac.sarif
          if-no-files-found: ignore
          retention-days: 7

  # ------------------------------------------------------------------
  # JOB 4: REPOSITORY INTEGRITY (OSSF Scorecard)
  # ------------------------------------------------------------------
  integrity:
    name: 🛡️ Repository Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OSSF Scorecard signing
      issues: read # Scorecard checks
      checks: read # Scorecard checks
    needs: secrets
    # Only run on default branch - Scorecard only supports default branch
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run OSSF Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        continue-on-error: true # Prevent failure on private repos where some checks are restricted
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false # Keep results local for private repos

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scorecard-results
          path: scorecard-results.sarif
          if-no-files-found: ignore
          retention-days: 7

  # ------------------------------------------------------------------
  # JOB 5: UNIFIED REPORTING
  # ------------------------------------------------------------------
  reporting:
    name: 📊 Security Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # post security findings as PR comments
    if: always() && github.event_name == 'pull_request'
    needs: [sast, dependencies, iac-security, integrity]
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "*-results"
          merge-multiple: false

      - name: Generate Job Summary
        run: |
          {
            echo "## 🔒 Security Scan Summary"
            echo ""
            
            # Semgrep Results
            if [ -f "semgrep-results/semgrep.sarif" ]; then
              echo "### 🔍 SAST (Semgrep)"
              echo "✅ Scan completed. Check PR comments for details."
              echo ""
            fi
            
            # Trivy Results
            if [ -f "trivy-results/trivy.sarif" ]; then
              echo "### 📦 Dependency Scan (Trivy)"
              echo "✅ Scan completed. Check PR comments for details."
              echo ""
            fi

            # IaC Results
            if [ -f "iac-results/trivy-iac.sarif" ]; then
              echo "### 🛡️ IaC Security Scan (Trivy)"
              echo "✅ Scan completed. Check artifacts for details."
              echo ""
            fi
            
            # Scorecard Results
            if [ -f "scorecard-results/scorecard-results.sarif" ]; then
              echo "### 🛡️ Repository Integrity (OSSF Scorecard)"
              echo "✅ Scan completed. Check artifacts for full report."
              echo ""
            fi
            
            echo "---"
            echo "**Note**: Full SARIF reports are available as workflow artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment Semgrep Findings
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Generate Markdown from SARIF
          python3 scripts/sarif_to_markdown.py semgrep-results/semgrep.sarif "🔍 SAST Findings (Semgrep)" > semgrep-comment.md

          # Post comment if content exists (and not empty)
          if [ -s semgrep-comment.md ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body-file semgrep-comment.md
          fi

      - name: Comment Trivy Findings
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Generate Markdown from SARIF
          python3 scripts/sarif_to_markdown.py trivy-results/trivy.sarif "📦 Dependency Vulnerabilities (Trivy)" > trivy-comment.md

          # Post comment if content exists (and not empty)
          if [ -s trivy-comment.md ]; then
             gh pr comment ${{ github.event.pull_request.number }} --body-file trivy-comment.md
          fi
