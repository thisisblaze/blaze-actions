name: 🔄 Bump Terraform Modules

on:
  repository_dispatch:
    types: [infra-core-release]
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump:
    name: Bump Modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Antigravity CLI
        run: curl -fsSL https://antigravity.google/cli/install.sh | bash

      - name: Run Antigravity Module Bump
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # TODO: Connect GCP Service Account for headless auth
          
          ~/.local/bin/agy -p "Detect the new module version tag from blaze-terraform-infra-core. For each tenant repo, bump the module source ref. Run 'terraform init' and 'terraform validate' where possible. Open a PR with title 'chore: bump infra-core module to <version>'. Respect v2.8.0-burned: never reset to v2.8.0; target v2.8.3+. Do not push to protected branches." \
            --add-dir . \
            --dangerously-skip-permissions < /dev/null
