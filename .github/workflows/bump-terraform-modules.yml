name: 🔄 Bump Terraform Modules (reusable)

# Reusable workflow. A tenant calls this on an infra-core release to bump its OWN
# blaze-terraform-infra-core module `?ref=` pins and open a PR. Runs in the CALLER's
# context (its GITHUB_TOKEN), so no cross-repo PAT and no agy/GCP auth are needed.
# Trigger lives in the tenant; this public engine only exposes the logic.

on:
  workflow_call:
    inputs:
      version:
        description: Target infra-core module version (e.g. v2.10.1)
        required: true
        type: string
    secrets:
      AWS_ROLE_ARN:
        required: false
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: false
      GCP_SERVICE_ACCOUNT:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false
      GH_PAT:
        required: false
      NPM_TOKEN:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      CLOUDFLARE_ZONE_ID:
        required: false
      MONGODB_ATLAS_PUBLIC_KEY:
        required: false
      MONGODB_ATLAS_PRIVATE_KEY:
        required: false
      MONGODB_ATLAS_ORG_ID:
        required: false
      MONGODB_ATLAS_PROJECT_ID:
        required: false
      EC_API_KEY:
        required: false
      ACM_CERTIFICATE_ARN:
        required: false
      BLAZE_CONNECTION_STRING:
        required: false
      BLAZE_AUTH_JWT_PRIVATE_KEY:
        required: false
      BLAZE_AUTH_ADMIN_EMAIL:
        required: false
      BLAZE_AUTH_ADMIN_PASSWORD:
        required: false
      BLAZE_FILES_S3_ACCESS_KEY:
        required: false
      BASIC_AUTH_CREDENTIALS:
        required: false
      BLAZE_SENTRY_AUTH_TOKEN:
        required: false
      BLAZE_SENTRY_DSN:
        required: false
      BLAZE_ELASTICSEARCH_USERNAME:
        required: false
      BLAZE_ELASTICSEARCH_PASSWORD:
        required: false
      BLAZE_ELASTICSEARCH_ENDPOINT:
        required: false
      INFRACOST_API_KEY:
        required: false
      DEPLOY_KEY:
        required: false
  workflow_dispatch: # manual ops escape hatch (matches the 99-ops-* convention)
    inputs:
      version:
        description: Target infra-core module version (e.g. v2.10.1)
        required: true
        type: string

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Bump Modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Bump module source refs + open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ inputs.version }}
        run: |
          if [ "$V" = "v2.8.0" ]; then
            echo "::error::v2.8.0 is burned — refusing to pin to it"; exit 1
          fi
          BRANCH="claude/bump-infra-core-$V"
          git config user.name  "blaze-bot"
          git config user.email "blaze-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # Repin every blaze-terraform-infra-core module ref to $V across the repo.
          grep -rlE "blaze-terraform-infra-core\.git//" --include="*.tf" . \
            | xargs -r sed -i -E "s|(blaze-terraform-infra-core\.git//[^?]+\?ref=)[^\"']+|\1$V|g"
          if git diff --quiet; then
            echo "No infra-core module refs to bump — nothing to do."; exit 0
          fi
          git commit -am "chore: bump infra-core module to $V"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: bump infra-core module to $V" \
            --body "Automated module-ref bump to \`$V\` (Routine 3). Review \`terraform plan\` before merge." \
            --head "$BRANCH" \
            --base "$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)"
