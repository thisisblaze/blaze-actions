name: "99 - Ops (TERRAFORM)"

on:
  workflow_dispatch:
    inputs:
      cloud_provider:
        description: "Cloud Provider"
        type: choice
        options: ["aws", "gcp", "azure"]
        default: "aws"
      action:
        description: "🛠️ Select Action"
        type: choice
        options:
          - destroy-resources
          - unlock-state
          - wipe-state
          - rm-state
        required: true
        default: destroy-resources
      environment:
        description: "Target Environment"
        type: choice
        options: ["dev", "dev-mini", "stage", "prod", "MULTI-SITE"]
        required: false
      stack:
        description: "Terraform Stack (for state/destroy)"
        type: choice
        options: ["network", "data", "cdn", "acm", "tunnel", "app", "third-party-mongodb", "third-party-elastic"]
        default: "app"
        required: false
      branch_tag:
        description: "Feature Tag (if applicable)"
        required: false
        type: string
      confirmation:
        description: "Type 'EXECUTE' or 'DESTROY' (for destructive actions)"
        required: false
        type: string
      # Action-specific inputs
      run_id:
        description: "GitHub Run ID (for kill-workflows)"
        required: false
        type: string
      manage_action:
        description: "Service Action (for manage-environment)"
        type: choice
        options: ["start", "stop", "restart", "scale"]
        default: "stop"
      desired_count:
        description: "Desired Instance Count (for scale)"
        type: string
        default: "0"
      # Cloudflare cleanup inputs
      retention_count:
        description: "Deployments to Keep (for cleanup-deployments)"
        type: string
        default: "5"
      retention_days:
        description: "Delete Deployments Older Than (days)"
        type: string
        default: "30"
      dry_run:
        description: "Dry Run (preview without deleting)"
        type: boolean
        default: true
      bulk_pattern:
        description: "Project Name Pattern (for bulk ops, e.g., 'blaze-*-dev-*')"
        type: string
        required: false
      skip_lambda_destroy:
        description: "Orphan Lambda@Edge before destroy (prevents hang)"
        type: boolean
        required: false
        default: true
      dist_id:
        description: "CloudFront Distribution ID (for nuke-cloudfront)"
        type: string
        required: false
      target_resource:
        description: "Terraform Resource Address (for rm-state, e.g., 'module.cloudflare')"
        type: string
        required: false

  workflow_call:
    inputs:
      cloud_provider:
        type: string
        default: "aws"
        required: false
      action:
        type: string
        required: true
      environment:
        type: string
        required: false
      stack:
        type: string
        required: false
      branch_tag:
        type: string
        required: false
      confirmation:
        type: string
        required: false
      run_id:
        type: string
        required: false
      manage_action:
        type: string
        default: "stop"
        required: false
      desired_count:
        type: string
        default: "0"
        required: false
      retention_count:
        type: string
        default: "5"
        required: false
      retention_days:
        type: string
        default: "30"
        required: false
      dry_run:
        type: boolean
        default: true
        required: false
      bulk_pattern:
        type: string
        required: false
      skip_lambda_destroy:
        type: boolean
        required: false
        default: true
      dist_id:
        type: string
        required: false
      target_resource:
        type: string
        required: false
    secrets:
      AWS_ROLE_ARN:
        required: false
      GH_PAT:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ZONE_ID:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      MONGODB_ATLAS_PUBLIC_KEY:
        required: false
      MONGODB_ATLAS_PRIVATE_KEY:
        required: false
      MONGODB_ATLAS_ORG_ID:
        required: false
      MONGODB_ATLAS_PROJECT_ID:
        required: false
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: false
      GCP_SERVICE_ACCOUNT:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false
      BLAZE_AUTH_ADMIN_EMAIL:
        required: false
      BLAZE_AUTH_ADMIN_PASSWORD:
        required: false
      BLAZE_FILES_S3_ACCESS_KEY:
        required: false
      BLAZE_FILES_S3_SECRET_ACCESS_KEY:
        required: false
      BLAZE_GRAPHQL_CACHE_SETTINGS:
        required: false
      BLAZE_CLIENT_HEADER:
        required: false
      ACM_CERTIFICATE_ARN:
        required: false
      EC_API_KEY:
        required: false
      SONAR_TOKEN:
        required: false
permissions:
  contents: read
  actions: write

concurrency:
  group: ops-tf-${{ inputs.environment }}-${{ inputs.cloud_provider }}-${{ inputs.action }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate Request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Load Access List
        id: load-access
        run: |
          if [[ -f "vars/blaze-env.json" ]]; then
            ALLOWED=$(jq -r '.common.ALLOWED_INFRA_USERS // empty' vars/blaze-env.json)
            echo "allowed=$ALLOWED" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ vars/blaze-env.json not found. Skipping access control."
            echo "allowed=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Access
        if: steps.load-access.outputs.allowed != ''
        uses: thisisblaze/blaze-actions/.github/actions/check-access@v2.12.0
        with:
          allowed_users: ${{ steps.load-access.outputs.allowed }}
          actor: ${{ github.actor }}

      - name: Validate Input
        run: |
          ACTION="${{ inputs.action }}"
          CONF="${{ inputs.confirmation }}"

          echo "🔍 Selected Action: $ACTION"

          # Block separators and headers
          if [[ "$ACTION" == "-"* ]]; then
            echo "❌ ERROR: You selected a category header or separator ('$ACTION')."
            echo "   Please select a real action (e.g., 'manage-environment')."
            exit 1
          fi

          # Validation for destructive actions (plan 163 O3 — fail closed).
          if [[ "$ACTION" == "destroy-resources" || "$ACTION" == "wipe-state" || "$ACTION" == "rm-state" || "$ACTION" == "nuke-environment" || "$ACTION" == "nuke-cloudfront" || "$ACTION" == "cleanup-dns" || "$ACTION" == "cleanup-orphaned-buckets" ]]; then
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              # Manual runs must confirm the EXACT target, so a stale/copied keyword
              # aimed at the wrong env or stack is rejected.
              EXPECTED="DESTROY-${{ inputs.environment }}-${{ inputs.stack }}"
              if [[ "$CONF" != "$EXPECTED" ]]; then
                echo "❌ ERROR: Confirmation for '$ACTION' must be EXACTLY: $EXPECTED"
                echo "   (you typed: '$CONF') — this binds the confirmation to the chosen environment + stack."
                exit 1
              fi
            else
              # Programmatic callers (workflow_call) keep the legacy keyword.
              if [[ "$CONF" != "DESTROY" && "$CONF" != "EXECUTE" ]]; then
                echo "❌ ERROR: Confirmation required for $ACTION. Pass 'DESTROY' or 'EXECUTE'."
                exit 1
              fi
            fi
          fi

  debug-context:
    name: 🕵️ Debug Context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Secrets Presence
        run: |
          echo "🔍 Checking Secret Availability..."

          if [[ -n "${{ secrets.AWS_ROLE_ARN }}" ]]; then
            echo "✅ AWS_ROLE_ARN is SET (Length: ${#AWS_ROLE_ARN})"
          else
            echo "❌ AWS_ROLE_ARN is MISSING or EMPTY"
          fi

          if [[ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]]; then
             echo "✅ CLOUDFLARE_API_TOKEN is SET"
          else
             echo "❌ CLOUDFLARE_API_TOKEN is MISSING"
          fi

          if [[ -n "${{ secrets.GH_PAT }}" ]]; then
             echo "✅ GH_PAT is SET"
          else
             echo "ℹ️ GH_PAT is MISSING (This might be expected)"
          fi
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

  configuration:
    permissions:
      contents: read
      id-token: write
    name: Configuration
    needs: [validate]
    # Run for all actions except kill-workflows
    if: inputs.action != 'kill-workflows'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      env_val: ${{ steps.config.outputs.env_val }}
      tf_dir: ${{ steps.config.outputs.tf_dir }}
      bucket: ${{ steps.config.outputs.bucket }}
      state_key: ${{ steps.config.outputs.state_key }}
      lock_table: ${{ steps.config.outputs.lock_table }}
      aws_region: ${{ steps.config.outputs.aws_region }}
      cluster_name: ${{ steps.config.outputs.cluster_name }}
      stage_key: ${{ steps.config.outputs.stage_key }}
      client_key: ${{ steps.config.outputs.client_key }}
      project_key: ${{ steps.config.outputs.project_key }}
      namespace: ${{ steps.config.outputs.namespace }}
      platform: ${{ steps.config.outputs.platform }}
      domain_root: ${{ steps.config.outputs.domain_root }}
      cloud_provider: ${{ steps.config.outputs.cloud_provider }}
      cloud_region: ${{ steps.config.outputs.cloud_region }}
      infra_prefix: ${{ steps.config.outputs.infra_prefix }}
      gcp_project_id: ${{ steps.config.outputs.gcp_project_id }}
      has_network: ${{ steps.check-dirs.outputs.has_network }}
      has_data: ${{ steps.check-dirs.outputs.has_data }}
      has_app: ${{ steps.check-dirs.outputs.has_app }}
      has_cdn: ${{ steps.check-dirs.outputs.has_cdn }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Load AWS Region from Config
        id: load-region
        run: |
          AWS_REGION=$(jq -r '.common.AWS_REGION' vars/blaze-env.json)
          if [[ -z "$AWS_REGION" ]]; then
            echo "❌ ERROR: AWS_REGION not set in vars/blaze-env.json"
            exit 1
          fi
          echo "aws_region=$AWS_REGION" >> "$GITHUB_OUTPUT"
          echo "✅ Using AWS Region: $AWS_REGION (from vars/blaze-env.json)"

      # TODO: Re-enable if calculate-config needs AWS Account ID
      # Temporarily disabled to allow workflow to run without AWS_ROLE_ARN configured
      # The calculate-config action handles missing AWS credentials gracefully
      # - name: Configure AWS Credentials
      #   uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
      #   with:
      #     role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      #     aws-region: ${{ steps.load-region.outputs.aws_region }}

      - name: Calculate Configuration
        id: config
        uses: thisisblaze/blaze-actions/.github/actions/calculate-config@v2.12.0
        with:
          environment: ${{ inputs.environment || 'DEV' }}
          terraform_stack: ${{ inputs.stack || 'app' }}
          branch_name: ${{ inputs.branch_tag }}
          cloud_provider: ${{ inputs.cloud_provider }}
          # Ops Utility implies infra operations, so we must pass true to bypass safety check
          deploy_infra: true
          build_images: "false"
          deploy_services: "false"
          event_name: "workflow_dispatch"

      - name: Check Stack Directories
        id: check-dirs
        run: |
          PREFIX="${{ steps.config.outputs.infra_prefix }}"
          STAGE="${{ steps.config.outputs.stage_key }}"

          echo "🔍 Checking directories in $PREFIX for stage $STAGE..."

          if [[ -d "$PREFIX/${STAGE}-network" ]]; then
            echo "✅ Network dir found"
            echo "has_network=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ Network dir NOT found"
            echo "has_network=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -d "$PREFIX/${STAGE}-data" ]]; then
            echo "✅ Data dir found"
            echo "has_data=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ Data dir NOT found"
            echo "has_data=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -d "$PREFIX/${STAGE}-app" ]]; then
            echo "✅ App dir found"
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ App dir NOT found"
            echo "has_app=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -d "$PREFIX/${STAGE}-cdn" ]]; then
            echo "✅ CDN dir found"
            echo "has_cdn=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ CDN dir NOT found"
            echo "has_cdn=false" >> "$GITHUB_OUTPUT"
          fi

  state-operations:
    permissions:
      contents: read
      id-token: write
    name: State Ops
    needs: [configuration]
    if: inputs.action == 'unlock-state' || inputs.action == 'wipe-state' || inputs.action == 'rm-state'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'DEV' }}
    timeout-minutes: 15
    steps:
      - name: Configure AWS Credentials
        if: inputs.cloud_provider == 'aws' || inputs.cloud_provider == '' || inputs.cloud_provider == null
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ needs.configuration.outputs.aws_region }}

      - name: Authenticate to GCP
        if: inputs.cloud_provider == 'gcp'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: inputs.cloud_provider == 'gcp'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Execute Ops (AWS)
        if: inputs.cloud_provider == 'aws' || inputs.cloud_provider == '' || inputs.cloud_provider == null
        run: |
          ACTION="${{ inputs.action }}"
          BUCKET="${{ needs.configuration.outputs.bucket }}"
          KEY="${{ needs.configuration.outputs.state_key }}"
          TABLE="${{ needs.configuration.outputs.lock_table }}"
          REGION="${{ needs.configuration.outputs.aws_region }}"

          if [[ -z "$TABLE" ]]; then
            TABLE="$BUCKET"
          fi

          LOCK_ID="${BUCKET}/${KEY}"

          if [[ "$ACTION" == "unlock-state" ]]; then
            echo "🔓 Unlocking State: $LOCK_ID"
            aws dynamodb delete-item \
              --table-name "$TABLE" \
              --region "$REGION" \
              --key "{\"LockID\": {\"S\": \"$LOCK_ID\"}}"
            aws s3 rm "s3://$BUCKET/$KEY.tflock" --region "$REGION" || true
          elif [[ "$ACTION" == "wipe-state" ]]; then
            echo "☢️ WIPING AWS STATE: s3://$BUCKET/$KEY"
            # Mandatory backup before wipe (plan 163 O1) — abort if the state exists but backup fails.
            if aws s3 ls "s3://$BUCKET/$KEY" --region "$REGION" >/dev/null 2>&1; then
              BACKUP_KEY="${KEY}.backup.$(date +%s)"
              echo "💾 Backing up state to s3://$BUCKET/$BACKUP_KEY"
              if ! aws s3 cp "s3://$BUCKET/$KEY" "s3://$BUCKET/$BACKUP_KEY" --region "$REGION"; then
                echo "❌ ERROR: state backup failed — refusing to wipe state."
                exit 1
              fi
              echo "::notice title=State backup::s3://$BUCKET/$BACKUP_KEY"
            fi
            aws s3 rm "s3://$BUCKET/$KEY" --region "$REGION" || echo "ℹ️ State file not found"
            aws s3 rm "s3://$BUCKET/$KEY.tflock" --region "$REGION" || echo "ℹ️ No lock file found"
            aws dynamodb delete-item --table-name "$TABLE" --region "$REGION" --key "{\"LockID\": {\"S\": \"$LOCK_ID\"}}" || true
            echo "✅ State wiped."
          elif [[ "$ACTION" == "rm-state" ]]; then
            TARGET="${{ inputs.target_resource }}"
            if [[ -z "$TARGET" ]]; then
              echo "❌ ERROR: target_resource is required for rm-state."
              exit 1
            fi
            echo "🔧 REMOVING TARGET '$TARGET' FROM STATE: $LOCK_ID"
            # Mandatory backup before any state mutation (plan 163 O1) — abort if it fails.
            BACKUP_KEY="${KEY}.backup.$(date +%s)"
            echo "💾 Backing up state to s3://$BUCKET/$BACKUP_KEY"
            if ! aws s3 cp "s3://$BUCKET/$KEY" "s3://$BUCKET/$BACKUP_KEY" --region "$REGION"; then
              echo "❌ ERROR: state backup failed — refusing to mutate state."
              exit 1
            fi
            echo "::notice title=State backup::s3://$BUCKET/$BACKUP_KEY"
            aws s3 cp "s3://$BUCKET/$KEY" state.json --region "$REGION"

            # Use jq to remove the resource from the state file
            # This is a brute-force approach, terraform CLI is safer but requires init
            # Since we just need to remove cloudflare_record, let's use jq:
            jq --arg addr "$TARGET" '
              .resources |= map(
                if .type == "cloudflare_record" and ( .module == "module.multi_site_app" or .module == "module.multi_site_app.module.cloudflare" ) then
                  select(false)
                else
                  .
                end
              )
            ' state.json > new_state.json
            
            aws s3 cp new_state.json "s3://$BUCKET/$KEY" --region "$REGION"
          fi

      - name: Execute Ops (GCP)
        if: inputs.cloud_provider == 'gcp'
        run: |
          ACTION="${{ inputs.action }}"
          BUCKET="${{ needs.configuration.outputs.bucket }}"
          KEY="${{ needs.configuration.outputs.state_key }}"

          if [[ "$ACTION" == "unlock-state" ]]; then
            echo "🔓 Unlocking GCS State: gs://$BUCKET/$KEY"
            # GCS backend uses a .tflock object
            gsutil rm "gs://$BUCKET/$KEY.tflock" 2>/dev/null || echo "ℹ️ No lock file found"
            echo "✅ State unlocked."
          elif [[ "$ACTION" == "wipe-state" ]]; then
            echo "☢️ WIPING GCS STATE: gs://$BUCKET/$KEY"
            # Mandatory backup before wipe (plan 163 O1) — abort if the state exists but backup fails.
            if gsutil -q stat "gs://$BUCKET/$KEY" 2>/dev/null; then
              BACKUP_KEY="${KEY}.backup.$(date +%s)"
              echo "💾 Backing up state to gs://$BUCKET/$BACKUP_KEY"
              if ! gsutil cp "gs://$BUCKET/$KEY" "gs://$BUCKET/$BACKUP_KEY"; then
                echo "❌ ERROR: state backup failed — refusing to wipe state."
                exit 1
              fi
              echo "::notice title=State backup::gs://$BUCKET/$BACKUP_KEY"
            fi
            gsutil rm "gs://$BUCKET/$KEY" 2>/dev/null || echo "ℹ️ State file not found"
            gsutil rm "gs://$BUCKET/$KEY.tflock" 2>/dev/null || echo "ℹ️ No lock file found"
            echo "✅ State wiped."
          fi

  pre-cleanup:
    permissions:
      contents: read
      id-token: write
    name: Pre-Cleanup
    needs: [configuration]
    if: inputs.action == 'destroy-resources' && (inputs.cloud_provider == 'aws' || inputs.cloud_provider == '' || inputs.cloud_provider == null) && contains(fromJson('["app", "cdn", "network"]'), inputs.stack)
    uses: thisisblaze/blaze-actions/.github/workflows/reusable-pre-destroy-cleanup.yml@v2.12.0
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    with:
      cluster_name: ${{ needs.configuration.outputs.cluster_name }}
      aws_region: ${{ needs.configuration.outputs.aws_region }}
      stage_filter: ${{ inputs.branch_tag }}
      environment: ${{ inputs.environment || 'DEV' }}
      target_stack: ${{ inputs.stack }}
      dry_run: ${{ inputs.dry_run }}

  destroy-resources:
    permissions:
      contents: read
      id-token: write
    name: Destroy
    needs: [configuration, pre-cleanup]
    if: |
      always() &&
      inputs.action == 'destroy-resources' &&
      needs.configuration.result == 'success' &&
      (needs.pre-cleanup.result == 'success' || needs.pre-cleanup.result == 'skipped')
    uses: thisisblaze/blaze-actions/.github/workflows/reusable-terraform.yml@v2.12.0
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      # Azure
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      MONGODB_ATLAS_PUBLIC_KEY: ${{ secrets.MONGODB_ATLAS_PUBLIC_KEY }}
      MONGODB_ATLAS_PRIVATE_KEY: ${{ secrets.MONGODB_ATLAS_PRIVATE_KEY }}
      MONGODB_ATLAS_PROJECT_ID: ${{ secrets.MONGODB_ATLAS_PROJECT_ID }}
      MONGODB_ATLAS_ORG_ID: ${{ secrets.MONGODB_ATLAS_ORG_ID }}
      EC_API_KEY: ${{ secrets.EC_API_KEY }}
      ACM_CERTIFICATE_ARN: ${{ secrets.ACM_CERTIFICATE_ARN }}
    with:
      wif_audience: ${{ vars.WIF_AUDIENCE }}
      cloud_provider: ${{ inputs.cloud_provider }}
      tf_dir: ${{ needs.configuration.outputs.tf_dir }}
      aws_region: ${{ needs.configuration.outputs.aws_region }}
      environment: ${{ inputs.environment || 'DEV' }}
      bucket: ${{ needs.configuration.outputs.bucket }}
      state_key: ${{ needs.configuration.outputs.state_key }}
      lock_table: ${{ needs.configuration.outputs.lock_table }}
      apply: ${{ inputs.dry_run != true && inputs.dry_run != 'true' }}
      destroy: true
      orphan_lambda: ${{ inputs.skip_lambda_destroy }}
      tf_vars: |
        project_key=${{ needs.configuration.outputs.project_key }}
        client_key=${{ needs.configuration.outputs.client_key }}
        namespace=${{ needs.configuration.outputs.namespace }}
        platform=${{ needs.configuration.outputs.platform }}
        aws_region=${{ needs.configuration.outputs.aws_region }}
        domain_root=${{ needs.configuration.outputs.domain_root }}
        stage=${{ needs.configuration.outputs.stage_key }}
        branch_name=${{ inputs.branch_tag }}

        gcp_project_id=${{ needs.configuration.outputs.gcp_project_id }}
        gcp_region=${{ needs.configuration.outputs.cloud_region }}
        azure_region=${{ needs.configuration.outputs.cloud_region }}
  summary:
    name: 📝 Ops Summary
    needs: [configuration, state-operations, pre-cleanup, destroy-resources]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Generate Summary
        run: |
          echo "# 🛠️ Ops Utility Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Helper function
          get_icon() {
            if [[ "$1" == "success" ]]; then echo "✅"; elif [[ "$1" == "skipped" ]]; then echo "⏭️"; elif [[ "$1" == "cancelled" ]]; then echo "🚫"; else echo "❌"; fi
          }

          echo "## 📋 Action Context" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Action** | \`${{ inputs.action }}\` |" >> $GITHUB_STEP_SUMMARY

          # If configuration ran successfully, we have more info
          if [[ "${{ needs.configuration.result }}" == "success" ]]; then
            echo "| **Environment** | \`${{ inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Cluster** | \`${{ needs.configuration.outputs.cluster_name }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Region** | \`${{ needs.configuration.outputs.aws_region }}\` |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🚦 Execution Status" >> $GITHUB_STEP_SUMMARY

          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
