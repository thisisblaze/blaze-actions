name: "♻️ Reusable Terraform"

on:
  workflow_call:
    inputs:
      cloud_provider:
        description: "Cloud provider (aws/gcp/azure). Default: aws"
        required: false
        type: string
        default: "aws"
      tf_dir:
        description: "Directory containing Terraform configuration"
        required: true
        type: string
      aws_region:
        description: "AWS Region"
        required: true
        type: string
      environment:
        description: "GitHub Environment (for secrets)"
        required: false
        type: string
      bucket:
        description: "S3 Bucket for State"
        required: true
        type: string
      state_key:
        description: "S3 Key for State"
        required: true
        type: string
      lock_table:
        description: "DynamoDB Table for Locking"
        required: false
        type: string
      terraform_version:
        description: "Terraform Version"
        required: false
        type: string
        default: "1.9.0"
      apply:
        description: "Whether to run terraform apply"
        required: false
        type: boolean
        default: false
      tf_vars:
        description: "Map of Terraform variables (passed as environment variables)"
        required: false
        type: string
      pre_apply_script:
        description: "Bash script to run after Init but before Plan/Apply (e.g. imports)"
        required: false
        type: string
      destroy:
        description: "Whether to generate a destroy plan"
        required: false
        type: boolean
        default: false
      detect_drift:
        description: "Fail if changes are detected (detailed-exitcode)"
        required: false
        type: boolean
        default: false
      build_sharp:
        description: "Whether to build the Sharp binaries for Lambda@Edge (Linux x64). Set to false to skip."
        required: false
        type: boolean
        default: true
      orphan_lambda:
        description: "Skip Lambda@Edge destruction by removing from state (prevents 1h hang)"
        required: false
        type: boolean
        default: false
      orphan_lambda_namespace:
        description: "Namespace prefix for Lambda@Edge IAM resource names (e.g. 'blaze'). Used when orphan_lambda=true to re-import IAM roles/policies."
        required: false
        type: string
        default: "blaze"
      enable_vpc_peering:
        description: "Enable Atlas VPC peering (Plan 135). Sets TF_VAR_enable_vpc_peering=true for MongoDB DB stacks. Requires non-flex cluster (M10+)."
        required: false
        type: boolean
        default: false
      split_apply:
        description: "Enable Split Apply (Targeted Apply -> Sleep -> Full Apply)"
        required: false
        type: boolean
        default: false
      split_targets:
        description: "Space-separated list of targets for the first apply step"
        required: false
        type: string
      sleep_seconds:
        description: "Seconds to sleep between split apply steps"
        required: false
        type: number
        default: 60
      wif_audience:
        description: "WIF Audience (Optional)"
        required: false
        type: string
        default: ""
      # Azure reversed credentials (to bypass GitHub secret masking on outputs)
      stack_id:
        description: "Stack UUID (STACK_ID from blaze-env.json via calculate-config). Injected as TF_VAR_stack_id → Blaze:StackID tag on all resources. Enables precise tag-based destroy isolation (pre-destroy-cleanup, verify-destroy-complete)."
        required: false
        type: string
        default: ""

    secrets:
      BLAZE_ELASTICSEARCH_USERNAME:
        required: false
      BLAZE_ELASTICSEARCH_PASSWORD:
        required: false
      BLAZE_ELASTICSEARCH_ENDPOINT:
        required: false
      AWS_ROLE_ARN:
        required: false
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: false
      GCP_SERVICE_ACCOUNT:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ZONE_ID:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      GH_PAT:
        required: false
      NPM_TOKEN:
        required: false
      INFRACOST_API_KEY:
        required: false
      BLAZE_CONNECTION_STRING:
        required: false
      BLAZE_AUTH_JWT_PRIVATE_KEY:
        required: false
      BLAZE_AUTH_ADMIN_EMAIL:
        required: false
      BLAZE_AUTH_ADMIN_PASSWORD:
        required: false
      BLAZE_FILES_S3_ACCESS_KEY:
        required: false
      BLAZE_FILES_S3_SECRET_ACCESS_KEY:
        required: false
      BLAZE_GRAPHQL_CACHE_SETTINGS:
        required: false
      BLAZE_CLIENT_HEADER:
        required: false
      EC_API_KEY:
        required: false
      MONGODB_ATLAS_PUBLIC_KEY:
        required: false
      MONGODB_ATLAS_PRIVATE_KEY:
        required: false
      MONGODB_ATLAS_ORG_ID:
        required: false
      MONGODB_ATLAS_PROJECT_ID:
        required: false
      ACM_CERTIFICATE_ARN:
        required: false
      BLAZE_SENTRY_AUTH_TOKEN:
        required: false
      BLAZE_SENTRY_DSN:
        required: false
      BASIC_AUTH_CREDENTIALS:
        required: false
      SLACK_WEBHOOK_URL:
        required: false
      DEPLOY_KEY:
        required: false
    outputs:
      mongodb_uri:
        description: "MongoDB Connection String"
        value: ${{ jobs.terraform.outputs.mongodb_uri }}
      cluster_name:
        description: "MongoDB Cluster Name"
        value: ${{ jobs.terraform.outputs.cluster_name }}
      alb_dns_name:
        description: "Load Balancer DNS Name"
        value: ${{ jobs.terraform.outputs.alb_dns_name }}
      ecs_cluster_name:
        description: "ECS Cluster Name"
        value: ${{ jobs.terraform.outputs.ecs_cluster_name }}
      iam_role_name:
        description: "IAM Execution Role Name"
        value: ${{ jobs.terraform.outputs.iam_role_name }}
      service_discovery_namespace:
        description: "Service Discovery Namespace"
        value: ${{ jobs.terraform.outputs.service_discovery_namespace }}
      log_group_name:
        description: "CloudWatch Log Group Name"
        value: ${{ jobs.terraform.outputs.log_group_name }}
      image_resize_enabled:
        description: "Image Resize Status"
        value: ${{ jobs.terraform.outputs.image_resize_enabled }}
      plan_summary:
        description: "Plan Summary"
        value: ${{ jobs.terraform.outputs.plan_summary }}
      vpc_id:
        description: "VPC ID"
        value: ${{ jobs.terraform.outputs.vpc_id }}
      efs_id:
        description: "EFS ID"
        value: ${{ jobs.terraform.outputs.efs_id }}
      service_discovery_id:
        description: "Service Discovery ID"
        value: ${{ jobs.terraform.outputs.service_discovery_id }}
      front_door_custom_domain_hostname:
        description: "Azure Front Door Custom Domain"
        value: ${{ jobs.terraform.outputs.front_door_custom_domain_hostname }}
      front_door_endpoint_hostname:
        description: "Azure Front Door Endpoint"
        value: ${{ jobs.terraform.outputs.front_door_endpoint_hostname }}
      image_resize_function_hostname:
        description: "GCP Image Resize Function Hostname"
        value: ${{ jobs.terraform.outputs.image_resize_function_hostname }}
      storage_account_name:
        description: "Azure Storage Account Name"
        value: ${{ jobs.terraform.outputs.storage_account_name }}
      dns_handoff_records_json:
        description: "JSON array of DNS records required for handoff"
        value: ${{ jobs.terraform.outputs.dns_handoff_records_json }}

concurrency:
  group: tf-util-${{ github.workflow }}-${{ github.ref }}-${{ inputs.environment }}-${{ inputs.tf_dir }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  id-token: write # OIDC cloud auth

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      id-token: write # Required for OIDC (Azure, GCP, AWS)
      contents: read
    outputs:
      mongodb_uri: ${{ steps.tf_outputs.outputs.mongodb_uri }}
      cluster_name: ${{ steps.tf_outputs.outputs.cluster_name }}
      plan_summary: ${{ steps.plan.outputs.summary }}
      alb_dns_name: ${{ steps.tf_outputs.outputs.alb_dns_name }}
      ecs_cluster_name: ${{ steps.tf_outputs.outputs.ecs_cluster_name }}
      iam_role_name: ${{ steps.tf_outputs.outputs.iam_role_name }}
      service_discovery_namespace: ${{ steps.tf_outputs.outputs.service_discovery_namespace }}
      log_group_name: ${{ steps.tf_outputs.outputs.log_group_name }}
      vpc_id: ${{ steps.tf_outputs.outputs.vpc_id }}
      efs_id: ${{ steps.tf_outputs.outputs.efs_id }}
      service_discovery_id: ${{ steps.tf_outputs.outputs.service_discovery_id }}
      image_resize_enabled: ${{ steps.tf_outputs.outputs.image_resize_enabled }}
      front_door_custom_domain_hostname: ${{ steps.tf_outputs.outputs.front_door_custom_domain_hostname }}
      front_door_endpoint_hostname: ${{ steps.tf_outputs.outputs.front_door_endpoint_hostname }}
      image_resize_function_hostname: ${{ steps.tf_outputs.outputs.image_resize_function_hostname }}
      storage_account_name: ${{ steps.tf_outputs.outputs.storage_account_name }}
      dns_handoff_records_json: ${{ steps.tf_outputs.outputs.dns_handoff_records_json }}
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.tf_dir }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Configure AWS Credentials
        if: inputs.cloud_provider == 'aws' || inputs.cloud_provider == ''
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Authenticate to Google Cloud
        if: inputs.cloud_provider == 'gcp'
        id: google-auth
        uses: google-github-actions/auth@55bd3a7c6e2ae7cf1877fd1ccb9d54c0503c457c # v2.1.2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || '' }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT || '' }}
          audience: ${{ inputs.wif_audience }}
          token_format: 'access_token'
          create_credentials_file: false

      - name: Export GCP Token for Terraform
        if: inputs.cloud_provider == 'gcp'
        run: echo "GOOGLE_OAUTH_ACCESS_TOKEN=${{ steps.google-auth.outputs.access_token }}" >> "$GITHUB_ENV"


      - name: Authenticate to Azure
        if: inputs.cloud_provider == 'azure'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Debug Secret Presence
        run: |
          if [ -n "${{ secrets.GH_PAT }}" ]; then
            echo "✅ GH_PAT is DETECTED."
          else
            echo "⚠️ GH_PAT is NOT DETECTED. Falling back to GITHUB_TOKEN."
          fi

          if [ -n "${{ secrets.EC_API_KEY }}" ]; then
             echo "✅ EC_API_KEY is DETECTED."
          else
             echo "❌ EC_API_KEY is NOT DETECTED (Empty)."
          fi

          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
             TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
             echo "✅ CLOUDFLARE_API_TOKEN is DETECTED. Length: ${#TOKEN}"
          else
             echo "❌ CLOUDFLARE_API_TOKEN is NOT DETECTED (Empty)."
          fi

          if [ -n "${{ secrets.CLOUDFLARE_ZONE_ID }}" ]; then
             echo "✅ CLOUDFLARE_ZONE_ID is DETECTED."
          else
             echo "❌ CLOUDFLARE_ZONE_ID is NOT DETECTED (Empty)."
          fi

          if [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
             echo "✅ CLOUDFLARE_ACCOUNT_ID is DETECTED."
          else
             echo "❌ CLOUDFLARE_ACCOUNT_ID is NOT DETECTED (Empty)."
          fi

      - name: Export Global Terraform Credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACM_CERTIFICATE_ARN: ${{ secrets.ACM_CERTIFICATE_ARN }}
          MONGODB_ATLAS_PUBLIC_KEY: ${{ secrets.MONGODB_ATLAS_PUBLIC_KEY }}
          MONGODB_ATLAS_PRIVATE_KEY: ${{ secrets.MONGODB_ATLAS_PRIVATE_KEY }}
          MONGODB_ATLAS_PROJECT_ID: ${{ secrets.MONGODB_ATLAS_PROJECT_ID }}
          MONGODB_ATLAS_ORG_ID: ${{ secrets.MONGODB_ATLAS_ORG_ID }}
          EC_API_KEY: ${{ secrets.EC_API_KEY }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          {
            if [[ -n "$CLOUDFLARE_API_TOKEN" ]]; then
              # Strip whitespace/control chars but preserve valid chars
              CLEAN_TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:][:cntrl:]')
              echo "TF_VAR_cloudflare_api_token<<__EOF__"
              printf '%s' "$CLEAN_TOKEN"
              echo ""
              echo "__EOF__"
              echo "CLOUDFLARE_API_TOKEN=$CLEAN_TOKEN"
            fi
            
            if [[ -n "$CLOUDFLARE_ZONE_ID" ]]; then
              CLEAN_ZONE=$(printf '%s' "$CLOUDFLARE_ZONE_ID" | tr -d '[:space:][:cntrl:]')
              echo "TF_VAR_cloudflare_zone_id<<__EOF__"
              printf '%s' "$CLEAN_ZONE"
              echo ""
              echo "__EOF__"
            fi
            
            [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] && echo "TF_VAR_cloudflare_account_id=$CLOUDFLARE_ACCOUNT_ID" || true
            echo "TF_VAR_acm_certificate_arn=$ACM_CERTIFICATE_ARN"
            echo "TF_VAR_atlas_public_key=$MONGODB_ATLAS_PUBLIC_KEY"
            echo "TF_VAR_atlas_private_key=$MONGODB_ATLAS_PRIVATE_KEY"
            [[ -n "$MONGODB_ATLAS_PROJECT_ID" ]] && echo "TF_VAR_atlas_project_id=$MONGODB_ATLAS_PROJECT_ID" || true
            echo "TF_VAR_atlas_org_id=$MONGODB_ATLAS_ORG_ID"
            echo "MONGODB_ATLAS_PUBLIC_KEY=$MONGODB_ATLAS_PUBLIC_KEY"
            echo "MONGODB_ATLAS_PRIVATE_KEY=$MONGODB_ATLAS_PRIVATE_KEY"
            echo "MONGODB_ATLAS_PROJECT_ID=$MONGODB_ATLAS_PROJECT_ID"
            echo "TF_VAR_ec_api_key=$EC_API_KEY"
            echo "ARM_USE_OIDC=${{ inputs.cloud_provider == 'azure' && 'true' || 'false' }}"
            echo "ARM_CLIENT_ID=$ARM_CLIENT_ID"
            echo "ARM_TENANT_ID=$ARM_TENANT_ID"
            echo "ARM_SUBSCRIPTION_ID=$ARM_SUBSCRIPTION_ID"
          } >> "$GITHUB_ENV"

      - name: Configure Git for Private Modules
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -n "${GH_PAT}" ]; then
            echo "✅ Configuring Git with GH_PAT..."
            git config --global url."https://${GH_PAT}@github.com/".insteadOf "https://github.com/"
          elif [ -n "${DEPLOY_KEY}" ]; then
            echo "✅ Configuring Git with SSH Deploy Key..."
            mkdir -p ~/.ssh
            echo "${DEPLOY_KEY}" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
            git config --global url."git@github.com:".insteadOf "https://github.com/"
          else
            echo "⚠️ No GH_PAT or DEPLOY_KEY found. Using GITHUB_TOKEN (cross-repo private modules may fail)."
            git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Bootstrap S3 Backend (Create Bucket + Lock Table if Missing)
        if: inputs.cloud_provider == 'aws' || inputs.cloud_provider == ''
        run: |
          BUCKET="${{ inputs.bucket }}"
          LOCK_TABLE="${{ inputs.lock_table }}"
          REGION="${{ inputs.aws_region }}"

          echo "🪣 Checking S3 backend bucket: $BUCKET (region: $REGION)"

          if aws s3api head-bucket --bucket "$BUCKET" --region "$REGION" 2>/dev/null; then
            echo "✅ Bucket already exists: $BUCKET"
          else
            echo "🆕 Bucket not found — creating $BUCKET..."
            if [[ "$REGION" == "us-east-1" ]]; then
              aws s3api create-bucket \
                --bucket "$BUCKET" \
                --region "$REGION"
            else
              aws s3api create-bucket \
                --bucket "$BUCKET" \
                --region "$REGION" \
                --create-bucket-configuration LocationConstraint="$REGION"
            fi

            # Enable versioning (required for Terraform state integrity)
            aws s3api put-bucket-versioning \
              --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled \
              --region "$REGION"

            # Enable server-side encryption
            aws s3api put-bucket-encryption \
              --bucket "$BUCKET" \
              --region "$REGION" \
              --server-side-encryption-configuration '{
                "Rules": [{
                  "ApplyServerSideEncryptionByDefault": {
                    "SSEAlgorithm": "AES256"
                  }
                }]
              }'

            # Block public access
            aws s3api put-public-access-block \
              --bucket "$BUCKET" \
              --region "$REGION" \
              --public-access-block-configuration \
                "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"

            echo "✅ Bucket created and hardened: $BUCKET"
          fi

          if [[ -n "$LOCK_TABLE" ]]; then
            echo "🔒 Checking DynamoDB lock table: $LOCK_TABLE"
            if aws dynamodb describe-table --table-name "$LOCK_TABLE" --region "$REGION" 2>/dev/null | grep -q ACTIVE; then
              echo "✅ Lock table already exists: $LOCK_TABLE"
            else
              echo "🆕 Creating DynamoDB lock table: $LOCK_TABLE"
              aws dynamodb create-table \
                --table-name "$LOCK_TABLE" \
                --attribute-definitions AttributeName=LockID,AttributeType=S \
                --key-schema AttributeName=LockID,KeyType=HASH \
                --billing-mode PAY_PER_REQUEST \
                --region "$REGION" > /dev/null
              echo "⏳ Waiting for table to become ACTIVE..."
              aws dynamodb wait table-exists --table-name "$LOCK_TABLE" --region "$REGION"
              echo "✅ Lock table ready: $LOCK_TABLE"
            fi
          fi

      - name: Terraform Init
        id: init
        env:
          # Azure OIDC: azurerm provider cannot use CLI auth for SPs — must use ARM_ env vars
          ARM_USE_OIDC: ${{ inputs.cloud_provider == 'azure' && 'true' || 'false' }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set +e
          BUCKET="${{ inputs.bucket }}"
          STATE_KEY="${{ inputs.state_key }}"
          LOCK_TABLE="${{ inputs.lock_table }}"
          TABLE_NAME="${LOCK_TABLE:-${BUCKET}}"
          REGION="${{ inputs.aws_region }}"
          CLOUD_PROVIDER="${{ inputs.cloud_provider }}"
          CLOUD_PROVIDER="${CLOUD_PROVIDER:-aws}"

          echo "🌐 Initializing Terraform Backend (Provider: $CLOUD_PROVIDER)..."

          # ── MULTI-CLOUD: Route backend init by cloud_provider ──
          case "$CLOUD_PROVIDER" in
            gcp)
              echo "☁️  GCP Backend: GCS bucket=$BUCKET, prefix=$STATE_KEY"
              terraform init \
                -upgrade \
                -backend-config="bucket=${BUCKET}" \
                -backend-config="prefix=${STATE_KEY}"
              exit $?
              ;;
            azure)
              echo "☁️  Azure Backend: Initializing..."
              
              # Extract Azure specific config from inputs or assume standard vars
              # We need resource_group_name, storage_account_name, container_name, key
              # These are passed via -backend-config in the init command
              
              # Logic: The 'bucket' input is mapped to 'container_name' for Azure
              #       The 'state_key' input is mapped to 'key'
              #       We need STORAGE_ACCOUNT and RESOURCE_GROUP passed via Env or extrapolated
              
              # Using the standard naming convention if explicit vars not provided:
              # RG = rg-terraform-state
              # SA = stterraformstate{client_key} -> This is tricky without client_key input.
              # SOLUTION: We expect the caller to pass these as backend-config args OR we use a standard approach.
              
              # Better approach for this workflow:
              # We will assume the 'bucket' input contains the Storage Account Name AND Container in format: "sa_name/container_name"
              # OR better yet, we just update the caller to pass everything.
              
              # For now, let's use the provided inputs and rely on the fact that for proper Azure init, 
              # we might need to rely on the partial configuration in the .tf file (backend "azurerm" {})
              # and pass the rest here.
              
              # We will require the user to pass 'storage_account_name' and 'resource_group_name' via tf_vars or logic? 
              # actually, 'bucket' input = container_name
              # 'state_key' input = key
              # 'lock_table' input = resource_group_name (Re-purposing input for Azure to avoid breaking API)
              
              # Re-mapping inputs for Azure:
              # bucket -> container_name
              # lock_table -> resource_group_name
              # We are missing storage_account_name. We will assume it is passed via env AZURE_STORAGE_ACCOUNT or similar.
              
              # ACTUALLY, simpler:
              # We'll expect the caller (01-provision-infra) to set these ENV vars or we fail.
              # But 01-provision-infra calls this reusable workflow.
              
              # Let's check inputs.bucket usage.
              # In Azure, we need: resource_group_name, storage_account_name, container_name, key.
              
              # We will parse `bucket` input as `resource_group_name/storage_account_name/container_name` for Azure.
              # This is a breaking change for the input format but only for Azure provider.
              
              IFS='/' read -r RES_GROUP STOR_ACC CONTAINER <<< "${BUCKET}"
              
              if [[ -z "$RES_GROUP" || -z "$STOR_ACC" || -z "$CONTAINER" ]]; then
                 echo "❌ Error: For Azure, 'bucket' input must be format: 'resource_group/storage_account/container'"
                 exit 1
              fi
              
              echo "   Resource Group: $RES_GROUP"
              echo "   Storage Acc:    $STOR_ACC"
              echo "   Container:      $CONTAINER"
              echo "   Key:            $STATE_KEY"
              
              terraform init \
                -upgrade \
                -backend-config="resource_group_name=${RES_GROUP}" \
                -backend-config="storage_account_name=${STOR_ACC}" \
                -backend-config="container_name=${CONTAINER}" \
                -backend-config="key=${STATE_KEY}"
                
              exit $?
              ;;
            *)
              # AWS S3 Backend (existing logic)
              echo "   Bucket: $BUCKET"
              echo "   Key:    $STATE_KEY"
              echo "   Table:  $TABLE_NAME"
              ;;
          esac

          terraform init \
            -upgrade \
            -backend-config="bucket=${BUCKET}" \
            -backend-config="key=${STATE_KEY}" \
            -backend-config="dynamodb_table=${TABLE_NAME}" \
            -backend-config="region=${REGION}" 2>&1 | tee /tmp/init_output.log
            
          INIT_EXIT_CODE=${PIPESTATUS[0]}

          if [[ $INIT_EXIT_CODE -ne 0 ]]; then
            if grep -qi "checksum" /tmp/init_output.log || grep -qi "does not have the expected content" /tmp/init_output.log; then


               echo "⚠️ Checksum mismatch / Stale Lock detected. Attempting recovery..."
               LOCK_ID="${BUCKET}/${STATE_KEY}"
               

               echo "🔎 DEBUG: Dumping ALL Items in Lock Table to find true key..."
               aws dynamodb scan --table-name "${TABLE_NAME}" --region "${REGION}"
               
               echo "🗑️ DEBUG: Attempting to delete expected LockID: ${LOCK_ID}"
               
               # Delete Lock from DynamoDB
               aws dynamodb delete-item \
                 --table-name "${TABLE_NAME}" \
                 --key "{\"LockID\": {\"S\": \"${LOCK_ID}\"}}" \
                 --region "${REGION}"

               # Delete Lock MD5 (Digest) from DynamoDB
               echo "🗑️ DEBUG: Attempting to delete expected LockID (MD5): ${LOCK_ID}-md5"
               aws dynamodb delete-item \
                 --table-name "${TABLE_NAME}" \
                 --key "{\"LockID\": {\"S\": \"${LOCK_ID}-md5\"}}" \
                 --region "${REGION}"

               # Attempt to delete without bucket prefix as fallback
               echo "🗑️ DEBUG: Attempting to delete fallback LockID: ${STATE_KEY}"
               aws dynamodb delete-item \
                 --table-name "${TABLE_NAME}" \
                 --key "{\"LockID\": {\"S\": \"${STATE_KEY}\"}}" \
                 --region "${REGION}"

               aws dynamodb delete-item \
                 --table-name "${TABLE_NAME}" \
                 --key "{\"LockID\": {\"S\": \"${STATE_KEY}-md5\"}}" \
                 --region "${REGION}"

               # Delete .tflock from S3
               aws s3 rm "s3://${BUCKET}/${STATE_KEY}.tflock" --region "${REGION}" || true
               
               echo "🔄 Retrying Init..."
               terraform init \
                -upgrade \
                -backend-config="bucket=${BUCKET}" \
                -backend-config="key=${STATE_KEY}" \
                -backend-config="dynamodb_table=${TABLE_NAME}" \
                -backend-config="region=${REGION}"
               
               exit "$?"
            else
               echo "❌ Terraform Init Failed"
               exit "$INIT_EXIT_CODE"
            fi
          fi

      # Build Sharp for Linux (Lambda Runtime) - Critical for Lambda@Edge
      # Lambda runs on Linux, not macOS - must use linux-x64 binaries
      # Run AFTER init to catch both local modules AND remote modules (in .terraform)
      - name: Build Sharp for Lambda@Edge (Linux x64)
        if: ${{ inputs.destroy != true && inputs.destroy != 'true' && inputs.build_sharp != false && inputs.build_sharp != 'false' }}
        working-directory: ${{ inputs.tf_dir }}
        run: |
          set -x
          echo "🔍 Searching for 'resize-image' Lambda directory (Local or Remote)..."

          # Optimized find: prune node_modules and .git, look for functions/resize-image
          FOUND_DIRS=$(find . -name "node_modules" -prune -o -name ".git" -prune -o -type d -path "*/functions/resize-image" -print)

          if [[ -z "$FOUND_DIRS" ]]; then
            echo "ℹ️ No 'resize-image' function directory found - skipping Sharp build."
          else
            for LAMBDA_DIR in $FOUND_DIRS; do
              echo "🚀 Found Lambda Directory: $LAMBDA_DIR"
              
              # Resolve absolute path for Docker volume mount
              ABS_LAMBDA_DIR="$(cd "$LAMBDA_DIR" && pwd)"
              
              if [[ ! -f "$ABS_LAMBDA_DIR/package.json" ]]; then
                 echo "⚠️ No package.json in $ABS_LAMBDA_DIR - skipping."
                 continue
              fi

              echo "   Dir: $ABS_LAMBDA_DIR"
              
              echo "🧹 Removing existing node_modules..."
              rm -rf "$ABS_LAMBDA_DIR/node_modules" "$ABS_LAMBDA_DIR/package-lock.json"
              
              echo "🔨 Building Sharp with node:20 (Standard CI Image)..."
              docker run --rm \
                -v "$ABS_LAMBDA_DIR":/build \
                -w /build \
                node:20 \
                npm install --platform=linux --arch=x64 --production --verbose
              
              echo "✅ Sharp built for Linux x64"
              
              # Verify correct architecture
              if ls "$ABS_LAMBDA_DIR/node_modules/@img/sharp-linux-x64" 2>/dev/null; then
                echo "✅ Correct binaries: sharp-linux-x64"
              else
                echo "❌ WARNING: Linux binaries not found in $ABS_LAMBDA_DIR!"
              fi
            done
          fi

      - name: Check & Release Stale Locks
        if: inputs.cloud_provider == 'aws' || inputs.cloud_provider == ''
        run: |
          # Fixed lock check logic - properly parse Info JSON blob
          BUCKET="${{ inputs.bucket }}"
          STATE_KEY="${{ inputs.state_key }}"
          TABLE_NAME="${{ inputs.lock_table }}"
          TABLE_NAME="${TABLE_NAME:-$BUCKET}"
          LOCK_ID="${BUCKET}/${STATE_KEY}"
          REGION="${{ inputs.aws_region }}"

          echo "🔍 Checking for stale locks..."
          LOCK_DATA=$(aws dynamodb get-item --table-name "$TABLE_NAME" --key "{\"LockID\": {\"S\": \"${LOCK_ID}\"}}" --region "$REGION" 2>/dev/null || true)

          if echo "$LOCK_DATA" | grep -q "Item"; then
             echo "📋 Lock found, checking age..."
             
             # CRITICAL FIX: Extract Info JSON blob (Created is inside this)
             INFO=$(echo "$LOCK_DATA" | jq -r '.Item.Info.S // empty')
             
             if [[ -n "$INFO" ]]; then
                # Parse Created timestamp from Info JSON
                CREATED=$(echo "$INFO" | jq -r '.Created // empty')
                
                if [[ -n "$CREATED" ]]; then
                   echo "   Created: $CREATED"
                   
                   # Parse timestamp (strip nanoseconds)
                   CLEAN_TS=$(echo "$CREATED" | awk '{print $1, $2}')
                   LOCK_EPOCH=$(date -d "$CLEAN_TS" +%s 2>/dev/null || echo "")
                   
                   if [[ -n "$LOCK_EPOCH" ]]; then
                      NOW_EPOCH=$(date +%s)
                      AGE_SEC=$((NOW_EPOCH - LOCK_EPOCH))
                      AGE_MIN=$((AGE_SEC / 60))
                      AGE_HOURS=$((AGE_MIN / 60))
                      
                      echo "   Age: ${AGE_HOURS}h ${AGE_MIN}m (${AGE_SEC}s)"
                      
                      # Release if older than 15 minutes
                      if [[ $AGE_MIN -gt 15 ]]; then
                         echo "🔓 Releasing stale lock (Age: ${AGE_HOURS}h ${AGE_MIN}m)..."
                         aws dynamodb delete-item --table-name "$TABLE_NAME" --key "{\"LockID\": {\"S\": \"${LOCK_ID}\"}}" --region "$REGION"
                         echo "✅ Stale lock released successfully"
                      else
                         echo "⏳ Lock is recent (${AGE_MIN}m old), keeping it"
                      fi
                   else
                      echo "⚠️ Could not parse timestamp"
                   fi
                else
                   echo "⚠️ No Created field in lock Info"
                fi
             else
                echo "⚠️ Lock has no Info field"
             fi
          else
             echo "✅ No existing lock found"
          fi

      - name: Export Basic Auth Secret
        env:
          BASIC_AUTH_CRED: ${{ secrets.BASIC_AUTH_CREDENTIALS }}
        run: |
          if [ -n "$BASIC_AUTH_CRED" ]; then
            echo "TF_VAR_basic_auth_credentials=[\"${BASIC_AUTH_CRED}\"]" >> $GITHUB_ENV
          fi

      - name: Load TF Vars
        if: ${{ inputs.tf_vars != '' }}
        run: |
          # Write input vars to a .auto.tfvars file or export to ENV
          # Exporting to ENV is safest for dynamic keys
          echo "${{ inputs.tf_vars }}" > _github_vars.env
          while read -r line; do
            if [[ -n "$line" && ! "$line" =~ ^# ]]; then
               # Check if line contains =
               if [[ "$line" == *"="* ]]; then
                 KEY=$(echo "$line" | cut -d'=' -f1 | tr -d ' ')
                 VAL=$(echo "$line" | cut -d'=' -f2-)
                 echo "TF_VAR_${KEY}=${VAL}" >> "$GITHUB_ENV"
               fi
            fi
          done < _github_vars.env

      - name: Inject Blaze Signature Tag Vars
        # v1.4.94: Provides TF_VAR_stack_name + TF_VAR_blaze_run_id for all stacks.
        # stack_name = last path component of tf_dir (e.g. "multi-site-network")
        # blaze_run_id = GITHUB_RUN_ID (enables per-run cost attribution + surgical cleanup)
        # v1.5.0 (L25): TF_VAR_stack_id injected from calculate-config output →
        #   propagates STACK_ID UUID from blaze-env.json → Terraform variable → Blaze:StackID tag
        #   on all AWS resources. Enables precise tag-based destroy isolation.
        run: |
          STACK_NAME=$(basename "${{ inputs.tf_dir }}")
          echo "TF_VAR_stack_name=${STACK_NAME}" >> "$GITHUB_ENV"
          echo "TF_VAR_blaze_run_id=${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "TF_VAR_stack_id=${{ inputs.stack_id }}" >> "$GITHUB_ENV"
          echo "   🏷️  Blaze:Stack   = ${STACK_NAME}"
          echo "   🏷️  Blaze:RunId   = ${{ github.run_id }}"
          echo "   🏷️  Blaze:StackID = ${{ inputs.stack_id }}"

      - name: Inject AWS Account ID
        # Resolves the AWS account ID via STS and exports as:
        #   - TF_VAR_aws_account_id  → picked up by Terraform if var declared in variables.tf
        #   - AWS_ACCOUNT_ID         → used by envsubst step below to substitute ${AWS_ACCOUNT_ID}
        #                              tokens in terraform.tfvars (ECR image URI pattern)
        # Only runs for AWS provider (STS call requires AWS credentials already configured).
        if: inputs.cloud_provider == 'aws' || inputs.cloud_provider == ''
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "TF_VAR_aws_account_id=${ACCOUNT_ID}" >> "$GITHUB_ENV"
          echo "AWS_ACCOUNT_ID=${ACCOUNT_ID}"        >> "$GITHUB_ENV"
          echo "   🔑  AWS Account ID injected (TF_VAR_aws_account_id + AWS_ACCOUNT_ID)"

      - name: Inject Atlas VPC Peering Flag (Plan 135)
        # Injects TF_VAR_enable_vpc_peering=true when enable_vpc_peering input is true.
        # Used by MongoDB DB stacks (thisisblaze-db, db-pod-alpha) to activate the
        # atlas_vpc_peering module (count = var.enable_vpc_peering ? 1 : 0).
        # TF_VAR_aws_account_id is already injected above — no duplication needed.
        if: inputs.enable_vpc_peering == true
        run: |
          echo "TF_VAR_enable_vpc_peering=true" >> "$GITHUB_ENV"
          echo "   🔗  Atlas VPC Peering ENABLED (TF_VAR_enable_vpc_peering=true)"

      - name: Substitute env vars in tfvars
        # Replaces ${AWS_ACCOUNT_ID} (and any other exported env vars) in *.tfvars files
        # before Terraform Plan reads them. Terraform does not support variable references
        # in .tfvars files, so ECR image URIs like
        #   "${AWS_ACCOUNT_ID}.dkr.ecr.eu-west-1.amazonaws.com/..."
        # must be resolved at CI runtime via envsubst.
        # Only substitutes tokens whose vars are set — unset vars are left untouched.
        if: inputs.cloud_provider == 'aws' || inputs.cloud_provider == ''
        run: |
          for f in *.tfvars; do
            if [[ -f "$f" ]]; then
              envsubst '${AWS_ACCOUNT_ID}' < "$f" > "$f.substituted" && mv "$f.substituted" "$f"
              echo "   🔤  envsubst applied to $f"
            fi
          done

      - name: Resolve ACM Certificate ARN dynamically (if needed)
        id: resolve-acm
        if: inputs.cloud_provider == 'aws' || inputs.cloud_provider == ''
        run: |
           if [[ -z "${{ secrets.ACM_CERTIFICATE_ARN }}" ]]; then
              echo "🔍 ACM_CERTIFICATE_ARN secret is empty. Resolving dynamically..."
              export DOMAIN_ROOT=$(jq -r '.common.DOMAIN_ROOT' "$GITHUB_WORKSPACE/vars/blaze-env.json")
              if [[ -f "$GITHUB_WORKSPACE/vars/${{ env.TF_VAR_project_key }}/blaze-env.json" ]]; then
                 PROJ_DOMAIN=$(jq -r '.common.DOMAIN_ROOT // empty' "$GITHUB_WORKSPACE/vars/${{ env.TF_VAR_project_key }}/blaze-env.json")
                 if [[ -n "$PROJ_DOMAIN" ]]; then DOMAIN_ROOT=$PROJ_DOMAIN; fi
              fi
              echo "🎯 Target Domain Root: $DOMAIN_ROOT"
              
              if [[ -n "$DOMAIN_ROOT" && "$DOMAIN_ROOT" != "null" ]]; then
                 echo "Searching certificates for $DOMAIN_ROOT in us-east-1 (CloudFront)..."
                 ARN=$(aws acm list-certificates --region us-east-1 --query "CertificateSummaryList[?DomainName=='${DOMAIN_ROOT}'].CertificateArn" --output text | head -n 1)
                 
                 if [[ -n "$ARN" && "$ARN" != "None" ]]; then
                    echo "✅ Resolved ACM ARN: $ARN"
                    echo "TF_VAR_cloudfront_acm_certificate_arn=$ARN" >> "$GITHUB_ENV"
                 else
                    echo "⚠️ No matching ACM certificate found in us-east-1 for *.$DOMAIN_ROOT"
                 fi
              fi
           else
              echo "✅ Using provided ACM_CERTIFICATE_ARN secret."
              echo "TF_VAR_cloudfront_acm_certificate_arn=${{ secrets.ACM_CERTIFICATE_ARN }}" >> "$GITHUB_ENV"
           fi

      - name: Run VPC Integrity Check
        if: ${{ inputs.destroy != true }}
        working-directory: ${{ inputs.tf_dir }}
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          CLIENT_KEY: ${{ env.TF_VAR_client_key }}
          PROJECT_KEY: ${{ env.TF_VAR_project_key }}
          STAGE: ${{ env.TF_VAR_stage }}
        run: |
          if [[ -f "check-vpc-integrity.sh" ]]; then
            echo "🔍 Found VPC Integrity Check script. Executing..."
            chmod +x check-vpc-integrity.sh
            ./check-vpc-integrity.sh
          fi

      - name: Run Pre-Apply Script
        if: ${{ inputs.pre_apply_script != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ inputs.tf_dir }}
        run: |
          echo "📜 Running Pre-Apply Script (cwd: $(pwd))..."
          ${{ inputs.pre_apply_script }}

      - name: Orphan Lambda Resources (Prevent Hang)
        if: ${{ inputs.orphan_lambda == true && (inputs.destroy == true || inputs.destroy == 'true') }}
        continue-on-error: true
        working-directory: ${{ inputs.tf_dir }}
        run: |
          echo "🧹 Orphaning Lambda@Edge FUNCTIONS to prevent destroy hang (IAM preserved)..."

          # Remove ONLY the Lambda function resources that cause destroy hang.
          # DO NOT remove aws_iam_role / aws_iam_policy — these survive teardown
          # and attempting to re-create them on apply hits EntityAlreadyExists (409).
          # Lambda@Edge can't be deleted without waiting for replica deletion (hours)
          echo "  🧹 Removing Lambda@Edge elements from state to prevent destroy blockages..."
          terraform state rm 'module.environment_network.module.lambda_edge_image_resize[0].aws_lambda_function.viewer_request[0]' 2>/dev/null || true
          terraform state rm 'module.environment_network.module.lambda_edge_image_resize[0].aws_lambda_function.origin_response[0]' 2>/dev/null || true
          terraform state rm 'module.environment_network.module.lambda_edge_image_resize[0].time_sleep.wait_for_edge_propagation[0]'  2>/dev/null || echo "time_sleep not in state"

          # 2. Vestigial/Phantom Normalize Lambda (Legacy Module — full module, no IAM to worry about)
          terraform state rm 'module.environment_network.module.lambda_edge_normalize[0]' 2>/dev/null || echo "normalize module not in state"

          # 3. Safety net — if whole module was in state (first-time run), ensure IAM is re-imported
          #    so plan sees them as update not create.
          LAMBDA_NS="${{ inputs.orphan_lambda_namespace || 'blaze' }}"
          LAMBDA_STAGE=$(basename "${{ inputs.tf_dir }}" | cut -d'-' -f1)
          LAMBDA_ROLE_NAME="${LAMBDA_NS}-${LAMBDA_STAGE}-lambda-edge-role"
          if ! terraform state show 'module.environment_network.module.lambda_edge_image_resize[0].aws_iam_role.lambda_edge[0]' >/dev/null 2>&1; then
            LAMBDA_ROLE_EXISTS=$(aws iam get-role --role-name "$LAMBDA_ROLE_NAME" \
              --query 'Role.RoleName' --output text 2>/dev/null || echo "")
            if [[ -n "$LAMBDA_ROLE_EXISTS" && "$LAMBDA_ROLE_EXISTS" != "None" ]]; then
              echo "  📥 IAM role not in state — re-importing: $LAMBDA_ROLE_NAME"
              terraform import \
                'module.environment_network.module.lambda_edge_image_resize[0].aws_iam_role.lambda_edge[0]' \
                "$LAMBDA_ROLE_NAME" 2>/dev/null && echo "  ✅ IAM role imported" || echo "  ⚠️  IAM role import failed"
            fi
          fi
          LAMBDA_POLICY_NAME="${LAMBDA_NS}-${LAMBDA_STAGE}-lambda-edge-s3-write-transformed"
          if ! terraform state show 'module.environment_network.module.lambda_edge_image_resize[0].aws_iam_policy.s3_write[0]' >/dev/null 2>&1; then
            LAMBDA_POLICY_ARN=$(aws iam list-policies --scope Local \
              --output json 2>/dev/null \
              | jq -r --arg name "$LAMBDA_POLICY_NAME" '.Policies[] | select(.PolicyName==$name) | .Arn' || echo "")
            if [[ -n "$LAMBDA_POLICY_ARN" ]]; then
              echo "  📥 IAM policy not in state — re-importing: $LAMBDA_POLICY_NAME"
              terraform import \
                'module.environment_network.module.lambda_edge_image_resize[0].aws_iam_policy.s3_write[0]' \
                "$LAMBDA_POLICY_ARN" 2>/dev/null && echo "  ✅ IAM policy imported" || echo "  ⚠️  IAM policy import failed"
            fi
          fi

          echo "✅ Lambda functions orphaned from state (IAM preserved/re-imported)"

      # ── Purge Stale Network Resources — runs only on destroy ──
      # Prevents ListenerNotFound / Cloudflare-404 errors when pre-nuke cleanup
      # already deleted ALBs/DNS records before Terraform destroy runs.
      - name: Purge Stale Network Resources (Prevent ALB/DNS 404 on Destroy)
        if: ${{ (inputs.destroy == true || inputs.destroy == 'true') && (inputs.cloud_provider == 'aws' || inputs.cloud_provider == '') }}
        continue-on-error: true
        working-directory: ${{ inputs.tf_dir }}
        run: |
          echo "🧹 Purging stale network resources from state (idempotent — || echo guards ensure no failure)..."

          # ALB Listeners — deleted by pre-nuke cleanup cascading off ALB deletion.
          # Cover all naming variants: http/https, with and without api_ prefix.
          for ADDR in \
            'module.environment_network.aws_lb_listener.http[0]' \
            'module.environment_network.aws_lb_listener.https[0]' \
            'module.environment_network.aws_lb_listener.api_http[0]' \
            'module.environment_network.aws_lb_listener.api_https[0]'; do
            terraform state rm "$ADDR" 2>/dev/null && echo "  🗑️  Removed: $ADDR" || echo "  ℹ️  Not in state: $ADDR"
          done

          # Cloudflare DNS records — may already be deleted; cover all key variants.
          for ADDR in \
            'module.environment_network.cloudflare_dns_record.validation[0]' \
            'module.environment_network.cloudflare_dns_record.cdn[0]' \
            'module.environment_network.cloudflare_dns_record.api[0]' \
            'module.environment_network.cloudflare_dns_record.frontend[0]' \
            'module.environment_network.cloudflare_dns_record.admin[0]' \
            'module.environment_network.cloudflare_dns_record.api_direct[0]'; do
            terraform state rm "$ADDR" 2>/dev/null && echo "  🗑️  Removed: $ADDR" || echo "  ℹ️  Not in state: $ADDR"
          done
          # Map-keyed validation records (e.g. validation["thisisblaze.uk"])
          terraform state list 2>/dev/null | grep 'cloudflare_dns_record.validation\[' | while read ADDR; do
            terraform state rm "$ADDR" 2>/dev/null && echo "  🗑️  Removed: $ADDR" || true
          done
          # Catch-all: any remaining cloudflare_dns_record in state regardless of module path or key.
          # Covers multi-site-app pattern: cloudflare_dns_record.site["thisisblaze-frontend"]
          # Root cause of 2026-05-15 stage nuke failure — record was 404 in CF but still in state.
          terraform state list 2>/dev/null | grep 'cloudflare_dns_record\.' | while read -r ADDR; do
            terraform state rm "$ADDR" 2>/dev/null && echo "  🗑️  Removed (catch-all): $ADDR" || true
          done

          # ECS Capacity Providers — restrict to just the cluster mapping to avoid API deadlock
          echo "  🧹 Removing ECS Capacity Providers from state (dynamic match) to prevent PutClusterCapacityProviders failures..."
          terraform state list 2>/dev/null | grep -E 'aws_ecs_cluster_capacity_providers' | while read -r ADDR; do
            terraform state rm "$ADDR" 2>/dev/null && echo "  🗑️  Removed: $ADDR" || echo "  ⚠️  Failed to remove: $ADDR"
          done

          # VPC Internet Gateway — prevent DependencyViolation if ENIs linger
          # Step 1: Remove from Terraform state so TF skips it in the plan
          echo "  🧹 Removing Internet Gateways from state (dynamic match) to prevent DependencyViolation..."
          terraform state list 2>/dev/null | grep -E 'aws_internet_gateway\.this' | while read -r ADDR; do
            terraform state rm "$ADDR" 2>/dev/null && echo "  🗑️  Removed: $ADDR" || echo "  ⚠️  Failed to remove: $ADDR"
          done

          # Step 2: CLI-detach and delete any IGW still physically attached to the VPC.
          # state rm above removes TF's knowledge of the IGW, but the AWS resource itself
          # remains attached — causing DependencyViolation when TF attempts to delete the VPC.
          # Fix: resolve VPC ID from state outputs, then force-detach via AWS CLI.
          REGION="${{ inputs.aws_region }}"
          VPC_ID=$(terraform output -raw vpc_id 2>/dev/null || echo "")
          if [[ -n "$VPC_ID" && "$VPC_ID" != "null" ]]; then
            echo "  🔍 Checking for physically attached IGWs on VPC: $VPC_ID"
            IGW_IDS=$(aws ec2 describe-internet-gateways \
              --region "$REGION" \
              --filters "Name=attachment.vpc-id,Values=${VPC_ID}" \
              --query 'InternetGateways[*].InternetGatewayId' \
              --output text 2>/dev/null || echo "")
            for IGW_ID in $IGW_IDS; do
              echo "  🔌 Detaching IGW: $IGW_ID from VPC: $VPC_ID"
              aws ec2 detach-internet-gateway \
                --region "$REGION" \
                --internet-gateway-id "$IGW_ID" \
                --vpc-id "$VPC_ID" 2>/dev/null \
                && echo "  ✅ Detached: $IGW_ID" || echo "  ⚠️  Detach failed (may already be detached): $IGW_ID"
              echo "  🗑️  Deleting IGW: $IGW_ID"
              aws ec2 delete-internet-gateway \
                --region "$REGION" \
                --internet-gateway-id "$IGW_ID" 2>/dev/null \
                && echo "  ✅ Deleted: $IGW_ID" || echo "  ⚠️  Delete failed (may already be gone): $IGW_ID"
            done
            if [[ -z "$IGW_IDS" ]]; then
              echo "  ✅ No physically attached IGWs found — VPC is clean"
            fi
          else
            echo "  ℹ️  No vpc_id output available — skipping IGW CLI cleanup"
          fi

          echo "✅ Stale network resources purged"

      # ── Pre-Destroy Hook — runs BEFORE plan so state changes don't stale the plan ──
      - name: Run Pre-Destroy Hook
        if: ${{ (inputs.destroy == true || inputs.destroy == 'true') && (inputs.apply == true || inputs.apply == 'true') }}
        working-directory: ${{ inputs.tf_dir }}
        env:
          MONGODB_ATLAS_PROJECT_ID: ${{ secrets.MONGODB_ATLAS_PROJECT_ID }}
          MONGODB_ATLAS_PUBLIC_KEY: ${{ secrets.MONGODB_ATLAS_PUBLIC_KEY }}
          MONGODB_ATLAS_PRIVATE_KEY: ${{ secrets.MONGODB_ATLAS_PRIVATE_KEY }}
          TF_VARS: ${{ inputs.tf_vars }}
        run: |
          if [ -f "pre-destroy.sh" ]; then
            echo "🔧 Found pre-destroy.sh — running BEFORE plan to avoid stale plan errors"
            if [ -n "$TF_VARS" ]; then
              while IFS='=' read -r key value; do
                [ -z "$key" ] && continue
                eval "export TF_VAR_${key}='${value}'"
              done <<< "$TF_VARS"
            fi
            chmod +x pre-destroy.sh
            ./pre-destroy.sh
          else
            echo "ℹ️  No pre-destroy.sh found — skipping"
          fi


      - name: Terraform Plan

        id: plan
        run: |
          DESTROY_FLAG=""
          if [[ "${{ inputs.destroy }}" == "true" ]]; then
            DESTROY_FLAG="-destroy"
          fi

          TARGET_FLAGS=""
          if [[ "${{ inputs.split_apply }}" == "true" && "${{ inputs.destroy }}" != "true" ]]; then
             TARGETS="${{ inputs.split_targets }}"
             for target in $TARGETS; do
               TARGET_FLAGS="$TARGET_FLAGS -target=$target"
             done
          fi

          # Always use -detailed-exitcode because we rely on Exit Code 2 
          # to determine if 'has_changes' is true for the Terraform Apply step downstream.
          # In destroy mode, use -refresh=false to prevent re-discovering resources that
          # were intentionally state rm'd by pre-destroy.sh (cache policies, WAF, CF function).
          # Also use -refresh=false when the CF placeholder token is active: the CF provider v5
          # will 401 on state refresh for any managed CF resource (e.g. ACM validation DNS record).
          # The CF validation record is set-once and stable — skipping refresh is safe.
          REFRESH_FLAG=""
          if [[ "${{ inputs.destroy }}" == "true" ]]; then
            REFRESH_FLAG="-refresh=false"
          elif [[ "${TF_VAR_cloudflare_api_token:-}" == "placeholder-cf-token-not-used-records-disabled" ]]; then
            REFRESH_FLAG="-refresh=false"
            echo "ℹ️  CF placeholder token active — using -refresh=false to skip CF provider state refresh"
          fi

          set +e
          terraform plan $DESTROY_FLAG $REFRESH_FLAG $TARGET_FLAGS -detailed-exitcode -out=tfplan -input=false | tee plan.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          # Sync: wait for tee to finish flushing plan.log before grepping
          sync plan.log 2>/dev/null || true

          # Extract Plan Summary — use EXIT_CODE as authoritative source of truth.
          # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes pending.
          # Grepping plan.log for "Plan:" is a nice-to-have human summary, but
          # the apply gate MUST use EXIT_CODE to avoid the tee flush race condition.
          if [[ $EXIT_CODE -eq 2 ]]; then
             # Changes detected — grep for summary line (best-effort, file may still be flushing)
             PLAN_SUMMARY=$(grep "Plan:" plan.log 2>/dev/null | tail -n 1 || echo "Plan: changes detected")
             # IMPORTANT: emit as step OUTPUT (not just env var).
             # env.* in step if: conditions is frozen at job-start and never updates between steps.
             # steps.<id>.outputs.* IS evaluated dynamically at step runtime.
             echo "has_changes=true" >> $GITHUB_OUTPUT
             echo "has_changes=true" >> $GITHUB_ENV
          elif [[ $EXIT_CODE -eq 0 ]]; then
             PLAN_SUMMARY="No changes"
             echo "has_changes=false" >> $GITHUB_OUTPUT
             echo "has_changes=false" >> $GITHUB_ENV
          fi
          echo "summary=$PLAN_SUMMARY" >> $GITHUB_OUTPUT
          echo "🔍 Terraform Plan EXIT_CODE=$EXIT_CODE (0=no changes, 1=error, 2=changes pending)"

          # Handle Drift Detection
          if [[ "${{ inputs.detect_drift }}" == "true" ]]; then
             if [[ $EXIT_CODE -eq 2 ]]; then
                echo "::error::⚠️ Drift Detected! Infrastructure differs from Code."
                exit 1
             elif [[ $EXIT_CODE -eq 0 ]]; then
                echo "✅ No Drift Detected."
             else
                echo "❌ Terraform Plan Failed (Exit Code: $EXIT_CODE)"
                exit $EXIT_CODE
             fi
          else
             # Standard Behavior: Exit code 0 (no changes) or 2 (changes) are both success
             if [[ $EXIT_CODE -eq 0 || $EXIT_CODE -eq 2 ]]; then
                if [[ $EXIT_CODE -eq 2 ]]; then
                   echo "✅ Terraform Plan Successful - Changes Detected"
                else
                   echo "✅ Terraform Plan Successful - No Changes"
                fi
             else
                echo "❌ Terraform Plan Failed (Exit Code: $EXIT_CODE)"
                exit $EXIT_CODE
             fi
          fi

      # NOTE: Pre-Destroy Hook was moved BEFORE Terraform Plan (see above).
      # It must run before plan so that terraform state rm calls don't invalidate the saved plan.

      - name: Terraform Apply
        # Run apply whenever inputs.apply=true — the saved tfplan is the source of truth.
        # If plan had no changes, apply is a fast no-op (exits 0, "Apply complete! Resources: 0 added").
        # Gating on has_changes was unreliable: PIPESTATUS[0] returned 0 even when plan showed 64 to add.
        if: ${{ inputs.apply == true || inputs.apply == 'true' }}
        run: |
          if [[ "${{ inputs.split_apply }}" == "true" && "${{ inputs.destroy }}" != "true" ]]; then
             echo "🛡️ Split Apply Enabled - Phase 1: Targeted Apply"
             TARGETS="${{ inputs.split_targets }}"
             
             if [[ -z "$TARGETS" ]]; then
                echo "❌ Error: split_targets must be provided when split_apply is true"
                exit 1
             fi
             
             # Construct -target flags
             TARGET_FLAGS=""
             for target in $TARGETS; do
               TARGET_FLAGS="$TARGET_FLAGS -target=$target"
             done
             
             echo "   Targets: $TARGET_FLAGS"
             terraform apply -auto-approve -input=false $TARGET_FLAGS
             
             echo "zzz Sleeping for ${{ inputs.sleep_seconds }} seconds to allow API propagation..."
             sleep ${{ inputs.sleep_seconds }}
             
             echo "🛡️ Split Apply - Phase 2: Full Apply"
             terraform apply -auto-approve -input=false
          else
             # Standard Apply using saved plan
             terraform apply -auto-approve -input=false tfplan
          fi

      - name: Export Terraform Outputs
        id: tf_outputs
        if: ${{ inputs.apply == true }}
        run: |
          echo "📤 Exporting Terraform Outputs..."
          terraform output -json > tf_outputs.json

          # MongoDB URI
          MONGO_URI=$(jq -r '.mongodb_uri.value // empty' tf_outputs.json)
          if [[ -n "$MONGO_URI" ]]; then
             echo "::add-mask::$MONGO_URI"
             echo "mongodb_uri=$MONGO_URI" >> $GITHUB_OUTPUT
          fi

          # Cluster Name (and alias to ecs_cluster_name for consistency)
          CLUSTER_NAME=$(jq -r '.cluster_name.value // empty' tf_outputs.json)
          if [[ -n "$CLUSTER_NAME" ]]; then
             echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT
             echo "ecs_cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT
          fi

          # DNS Handoff Records
          DNS_HANDOFF=$(jq -c '.dns_handoff_records.value // empty' tf_outputs.json)
          if [[ -n "$DNS_HANDOFF" ]]; then
             echo "dns_handoff_records_json=$DNS_HANDOFF" >> $GITHUB_OUTPUT
          fi

          # Generic Output Extractor
          extract_output() {
            KEY=$1
            JSON_KEY=$2
            VAL=$(jq -r ".$JSON_KEY.value // empty" tf_outputs.json)
            if [[ -n "$VAL" ]]; then
               echo "$KEY=$VAL" >> "$GITHUB_OUTPUT"
            fi
          }

          # Extract Additional Infra Details
          extract_output "alb_dns_name" "alb_dns_name"
          extract_output "ecs_cluster_name" "ecs_cluster_name"
          extract_output "iam_role_name" "execution_role_name"
          extract_output "service_discovery_namespace" "service_discovery_namespace"
          extract_output "service_discovery_id" "service_discovery_id"
          extract_output "vpc_id" "vpc_id"
          extract_output "efs_id" "efs_id"
          extract_output "log_group_name" "log_group_name"
          extract_output "image_resize_enabled" "image_resize_enabled"
          extract_output "front_door_custom_domain_hostname" "front_door_custom_domain_hostname"
          extract_output "front_door_endpoint_hostname" "front_door_endpoint_hostname"
          extract_output "image_resize_function_hostname" "image_resize_function_hostname"
          extract_output "storage_account_name" "storage_account_name"
