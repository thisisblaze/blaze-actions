name: "99 - Ops (AWS)"

on:
  workflow_dispatch:
    inputs:
      cloud_provider:
        description: "Cloud Provider"
        type: choice
        options: ["aws", "gcp", "azure"]
        default: "aws"
      action:
        description: "🛠️ Select Action"
        type: choice
        options:
          - manage-environment
          - cleanup-orphaned-lambdas
          - cleanup-orphaned-buckets
          - nuke-cloudfront
        required: true
        default: manage-environment
      environment:
        description: "Target Environment"
        type: choice
        options: ["v2.1.74", "dev-mini", "stage", "prod", "MULTI-SITE"]
        required: false
      stack:
        description: "Terraform Stack (for state/destroy)"
        type: choice
        options: ["network", "data", "cdn", "acm", "tunnel", "app", "third-party-mongodb", "third-party-elastic"]
        default: "app"
        required: false
      branch_tag:
        description: "Feature Tag (if applicable)"
        required: false
        type: string
      confirmation:
        description: "Type 'EXECUTE' or 'DESTROY' (for destructive actions)"
        required: false
        type: string
      # Action-specific inputs
      run_id:
        description: "GitHub Run ID (for kill-workflows)"
        required: false
        type: string
      manage_action:
        description: "Service Action (for manage-environment)"
        type: choice
        options: ["start", "stop", "restart", "scale"]
        default: "stop"
      desired_count:
        description: "Desired Instance Count (for scale)"
        type: string
        default: "0"
      # Cloudflare cleanup inputs
      retention_count:
        description: "Deployments to Keep (for cleanup-deployments)"
        type: string
        default: "5"
      retention_days:
        description: "Delete Deployments Older Than (days)"
        type: string
        default: "30"
      dry_run:
        description: "Dry Run (preview without deleting)"
        type: boolean
        default: true
      bulk_pattern:
        description: "Project Name Pattern (for bulk ops, e.g., 'blaze-*-dev-*')"
        type: string
        required: false
      skip_lambda_destroy:
        description: "Orphan Lambda@Edge before destroy (prevents hang)"
        type: boolean
        required: false
        default: true
      dist_id:
        description: "CloudFront Distribution ID (for nuke-cloudfront)"
        type: string
        required: false

  workflow_call:
    inputs:
      cloud_provider:
        type: string
        default: "aws"
        required: false
      action:
        type: string
        required: true
      environment:
        type: string
        required: false
      stack:
        type: string
        required: false
      branch_tag:
        type: string
        required: false
      confirmation:
        type: string
        required: false
      run_id:
        type: string
        required: false
      manage_action:
        type: string
        default: "stop"
        required: false
      desired_count:
        type: string
        default: "0"
        required: false
      retention_count:
        type: string
        default: "5"
        required: false
      retention_days:
        type: string
        default: "30"
        required: false
      dry_run:
        type: boolean
        default: true
        required: false
      bulk_pattern:
        type: string
        required: false
      skip_lambda_destroy:
        type: boolean
        required: false
        default: true
      dist_id:
        type: string
        required: false
permissions:
  id-token: write
  contents: read
  actions: write

concurrency:
  group: ops-aws-${{ inputs.environment }}-${{ inputs.cloud_provider }}-${{ inputs.action }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate Request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Load Access List
        id: load-access
        run: |
          if [[ -f "vars/blaze-env.json" ]]; then
            ALLOWED=$(jq -r '.common.ALLOWED_INFRA_USERS // empty' vars/blaze-env.json)
            echo "allowed=$ALLOWED" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ vars/blaze-env.json not found. Skipping access control."
            echo "allowed=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Access
        if: steps.load-access.outputs.allowed != ''
        uses: thisisblaze/blaze-actions/.github/actions/check-access@v2.11.5
        with:
          allowed_users: ${{ steps.load-access.outputs.allowed }}
          actor: ${{ github.actor }}

      - name: Validate Input
        run: |
          ACTION="${{ inputs.action }}"
          CONF="${{ inputs.confirmation }}"

          echo "🔍 Selected Action: $ACTION"

          # Block separators and headers
          if [[ "$ACTION" == "-"* ]]; then
            echo "❌ ERROR: You selected a category header or separator ('$ACTION')."
            echo "   Please select a real action (e.g., 'manage-environment')."
            exit 1
          fi

          # Validation for destructive actions
          if [[ "$ACTION" == "destroy-resources" || "$ACTION" == "wipe-state" || "$ACTION" == "nuke-environment" || "$ACTION" == "nuke-cloudfront" || "$ACTION" == "cleanup-dns" || "$ACTION" == "cleanup-orphaned-buckets" ]]; then
            if [[ "$CONF" != "DESTROY" && "$CONF" != "EXECUTE" ]]; then
              echo "❌ ERROR: Confirmation required for $ACTION. Please type 'DESTROY' or 'EXECUTE'."
              exit 1
            fi
          fi

  debug-context:
    name: 🕵️ Debug Context
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'DEV' }}
    timeout-minutes: 5
    steps:
      - name: Check Secrets Presence
        run: |
          echo "🔍 Checking Secret Availability..."

          if [[ -n "${{ secrets.AWS_ROLE_ARN }}" ]]; then
            echo "✅ AWS_ROLE_ARN is SET (Length: ${#AWS_ROLE_ARN})"
          else
            echo "❌ AWS_ROLE_ARN is MISSING or EMPTY"
          fi

          if [[ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]]; then
             echo "✅ CLOUDFLARE_API_TOKEN is SET"
          else
             echo "❌ CLOUDFLARE_API_TOKEN is MISSING"
          fi

          if [[ -n "${{ secrets.GH_PAT }}" ]]; then
             echo "✅ GH_PAT is SET"
          else
             echo "ℹ️ GH_PAT is MISSING (This might be expected)"
          fi
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

  configuration:
    permissions:
      contents: read
      id-token: write
    name: Configuration
    needs: [validate]
    # Run for all actions except kill-workflows
    if: inputs.action != 'kill-workflows'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'DEV' }}
    timeout-minutes: 15
    outputs:
      env_val: ${{ steps.config.outputs.env_val }}
      tf_dir: ${{ steps.config.outputs.tf_dir }}
      bucket: ${{ steps.config.outputs.bucket }}
      state_key: ${{ steps.config.outputs.state_key }}
      lock_table: ${{ steps.config.outputs.lock_table }}
      aws_region: ${{ steps.config.outputs.aws_region }}
      cluster_name: ${{ steps.config.outputs.cluster_name }}
      stage_key: ${{ steps.config.outputs.stage_key }}
      client_key: ${{ steps.config.outputs.client_key }}
      project_key: ${{ steps.config.outputs.project_key }}
      namespace: ${{ steps.config.outputs.namespace }}
      platform: ${{ steps.config.outputs.platform }}
      domain_root: ${{ steps.config.outputs.domain_root }}
      cloud_provider: ${{ steps.config.outputs.cloud_provider }}
      cloud_region: ${{ steps.config.outputs.cloud_region }}
      infra_prefix: ${{ steps.config.outputs.infra_prefix }}
      gcp_project_id: ${{ steps.config.outputs.gcp_project_id }}
      has_network: ${{ steps.check-dirs.outputs.has_network }}
      has_data: ${{ steps.check-dirs.outputs.has_data }}
      has_app: ${{ steps.check-dirs.outputs.has_app }}
      has_cdn: ${{ steps.check-dirs.outputs.has_cdn }}
      stack_id: ${{ steps.config.outputs.stack_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Load AWS Region from Config
        id: load-region
        run: |
          AWS_REGION=$(jq -r '.common.AWS_REGION' vars/blaze-env.json)
          if [[ -z "$AWS_REGION" ]]; then
            echo "❌ ERROR: AWS_REGION not set in vars/blaze-env.json"
            exit 1
          fi
          echo "aws_region=$AWS_REGION" >> "$GITHUB_OUTPUT"
          echo "✅ Using AWS Region: $AWS_REGION (from vars/blaze-env.json)"

      # TODO: Re-enable if calculate-config needs AWS Account ID
      # Temporarily disabled to allow workflow to run without AWS_ROLE_ARN configured
      # The calculate-config action handles missing AWS credentials gracefully
      # - name: Configure AWS Credentials
      #   uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
      #   with:
      #     role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      #     aws-region: ${{ steps.load-region.outputs.aws_region }}

      - name: Calculate Configuration
        id: config
        uses: thisisblaze/blaze-actions/.github/actions/calculate-config@v2.11.5
        with:
          environment: ${{ inputs.environment || 'DEV' }}
          terraform_stack: ${{ inputs.stack || 'app' }}
          branch_name: ${{ inputs.branch_tag }}
          cloud_provider: ${{ inputs.cloud_provider }}
          # Ops Utility implies infra operations, so we must pass true to bypass safety check
          deploy_infra: true
          build_images: "false"
          deploy_services: "false"
          event_name: "workflow_dispatch"

      - name: Check Stack Directories
        id: check-dirs
        run: |
          PREFIX="${{ steps.config.outputs.infra_prefix }}"
          STAGE="${{ steps.config.outputs.stage_key }}"

          echo "🔍 Checking directories in $PREFIX for stage $STAGE..."

          if [[ -d "$PREFIX/${STAGE}-network" ]]; then
            echo "✅ Network dir found"
            echo "has_network=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ Network dir NOT found"
            echo "has_network=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -d "$PREFIX/${STAGE}-data" ]]; then
            echo "✅ Data dir found"
            echo "has_data=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ Data dir NOT found"
            echo "has_data=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -d "$PREFIX/${STAGE}-app" ]]; then
            echo "✅ App dir found"
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ App dir NOT found"
            echo "has_app=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -d "$PREFIX/${STAGE}-cdn" ]]; then
            echo "✅ CDN dir found"
            echo "has_cdn=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ CDN dir NOT found"
            echo "has_cdn=false" >> "$GITHUB_OUTPUT"
          fi

  manage-environment:
    permissions:
      contents: read
      id-token: write
    name: Manage Env
    needs: [configuration]
    if: inputs.action == 'manage-environment' && (inputs.cloud_provider == 'aws' || inputs.cloud_provider == '' || inputs.cloud_provider == null)
    uses: thisisblaze/blaze-actions/.github/workflows/reusable-ecs-service-management.yml@v2.11.5
    with:
      cluster_name: ${{ needs.configuration.outputs.cluster_name }}
      action: ${{ inputs.manage_action }}
      service_name: "all"
      desired_count: ${{ inputs.desired_count }}
      aws_region: ${{ needs.configuration.outputs.aws_region }}
      environment: ${{ inputs.environment || 'DEV' }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

  cleanup-orphaned-lambdas:
    permissions:
      contents: read
      id-token: write
    name: 🧹 Cleanup Orphaned Lambdas (Garbage Collection)
    needs: [configuration]
    if: inputs.action == 'cleanup-orphaned-lambdas' && (inputs.cloud_provider == 'aws' || inputs.cloud_provider == '' || inputs.cloud_provider == null)
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'DEV' }}
    timeout-minutes: 15
    steps:
      - name: Validate Confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "EXECUTE" ] && [ "${{ inputs.confirmation }}" != "DESTROY" ]; then
             echo "⚠️ Confirmation not set to EXECUTE/DESTROY. Running in DRY-RUN mode."
             echo "CONFIRM_MODE=DRY_RUN" >> $GITHUB_ENV
          else
             echo "🚨 EXECUTION MODE CONFIRMED"
             echo "CONFIRM_MODE=EXECUTE" >> $GITHUB_ENV
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          # Lambda@Edge is ALWAYS in us-east-1
          aws-region: us-east-1

      - name: Find and Destroy Zombies
        env:
          NAMESPACE: ${{ needs.configuration.outputs.namespace }}
          STAGE_KEY: ${{ needs.configuration.outputs.stage_key }}
        run: |
          # 1. Debug & Setup
          set -euo pipefail
          echo "🔎 PARAMETER CHECK:"
          echo "   - NAMESPACE: '$NAMESPACE'"
          echo "   - STAGE_KEY: '$STAGE_KEY'"

          if [[ -z "$NAMESPACE" ]]; then
             echo "❌ CRITICAL ERROR: NAMESPACE is empty. Check configuration."
             exit 1
          fi

          # 2. Tag-based query (replacing brittle name pattern matching)
          echo "--------------------------------"
          
          STACK_ID="${{ needs.configuration.outputs.stack_id }}"
          if [[ -n "$STACK_ID" && "$STACK_ID" != "null" ]]; then
            echo "📡 Tag-based Lambda@Edge Check (us-east-1) for Blaze:StackID=${STACK_ID}..."
            TAGGED_ARNS=$(aws resourcegroupstaggingapi get-resources \
              --region us-east-1 \
              --tag-filters "Key=Blaze:StackID,Values=${STACK_ID}" \
              --resource-type-filters "lambda:function" \
              --query 'ResourceTagMappingList[*].ResourceARN' \
              --output text 2>/dev/null || echo "")
          else
            echo "📡 Tag-based Lambda@Edge Check (us-east-1) for Blaze:Environment=${STAGE_KEY}..."
            TAGGED_ARNS=$(aws resourcegroupstaggingapi get-resources \
              --region us-east-1 \
              --tag-filters "Key=Blaze:Environment,Values=${STAGE_KEY}" \
              --resource-type-filters "lambda:function" \
              --query 'ResourceTagMappingList[*].ResourceARN' \
              --output text 2>/dev/null || echo "")
          fi
          
          echo "$TAGGED_ARNS" | tr '\t' '\n' | awk -F':' '{print $NF}' | grep -v 'None' | grep . > found_lambdas.txt || true

          if [ ! -s found_lambdas.txt ]; then
             echo "⚠️  No orphaned Lambda functions found tagged with Blaze:Environment=${STAGE_KEY}"
             echo "   (This means either they are already deleted, or not tagged)"
             exit 0
          fi

          echo "🧟 Found the following candidates:"
          cat found_lambdas.txt
          echo "--------------------------------"

          echo "🌐 Querying CloudFront for Active Lambda Deployments globally..."
          # Fetch all active Lambda@Edge bindings across all distributions in the AWS account to prevent false-positives
          ACTIVE_LAMBDAS_DEFAULT=$(aws cloudfront list-distributions --query "DistributionList.Items[*].DefaultCacheBehavior.LambdaFunctionAssociations.Items[*].LambdaFunctionARN" --output text 2>/dev/null | tr '\t' '\n' || true)
          ACTIVE_LAMBDAS_ADDITIONAL=$(aws cloudfront list-distributions --query "DistributionList.Items[*].CacheBehaviors.Items[*].LambdaFunctionAssociations.Items[*].LambdaFunctionARN" --output text 2>/dev/null | tr '\t' '\n' || true)
          
          ACTIVE_LAMBDAS=$(echo -e "${ACTIVE_LAMBDAS_DEFAULT}\n${ACTIVE_LAMBDAS_ADDITIONAL}" | grep "arn:aws:lambda:" | sort -u || true)
          ACTIVE_COUNT=$(echo "$ACTIVE_LAMBDAS" | grep -v "^$" | wc -l | tr -d ' ' || echo "0")
          
          echo "✅ Found $ACTIVE_COUNT Edge Lambdas currently bound to live CloudFront distributions."
          echo "--------------------------------"

          while read func; do
            # Cross-reference the CloudFront Active Registry. 
            # Note: CloudFront specifies ARNs with versions (e.g., :function:my-func:1). grep isolating :function:NAME: guarantees a match.
            if echo "$ACTIVE_LAMBDAS" | grep -q ":function:${func}:"; then
                echo "✅ Active CloudFront binding detected for $func. Safely skipping..."
            else
                if [ "$CONFIRM_MODE" == "EXECUTE" ]; then
                    echo "🗑️ Orphan confirmed. Deleting $func..."
                    aws lambda delete-function --function-name "$func" --region us-east-1 || echo "⚠️ Failed to delete $func (might be transitioning out)"
                else
                    echo "ℹ️ [DRY RUN] Orphan confirmed. Would delete $func"
                fi
            fi
            FOUND_COUNT=$((FOUND_COUNT+1))
          done < found_lambdas.txt

          if [ "$CONFIRM_MODE" != "EXECUTE" ]; then
             echo ""
             echo "⚠️ This was a DRY RUN. To actually delete these resources, set 'Confirmation' to 'EXECUTE'."
          else
             echo "✅ Garbage Collection Complete."
          fi

  cleanup-orphaned-buckets:
    permissions:
      contents: read
      id-token: write
    name: 🧹 Cleanup Orphaned Buckets
    needs: [configuration]
    if: inputs.action == 'cleanup-orphaned-buckets' && (inputs.cloud_provider == 'aws' || inputs.cloud_provider == '' || inputs.cloud_provider == null)
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'DEV' }}
    timeout-minutes: 15
    steps:
      - name: Validate Confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "EXECUTE" ] && [ "${{ inputs.confirmation }}" != "DESTROY" ]; then
             echo "⚠️ Confirmation not set to EXECUTE/DESTROY. Running in DRY-RUN mode."
             echo "CONFIRM_MODE=DRY_RUN" >> $GITHUB_ENV
          else
             echo "🚨 EXECUTION MODE CONFIRMED"
             echo "CONFIRM_MODE=EXECUTE" >> $GITHUB_ENV
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ needs.configuration.outputs.aws_region }}

      - name: Find and Delete Orphaned Buckets
        env:
          ENV_KEY: ${{ inputs.environment == 'dev-mini' && 'dev-mini' || 'dev' }}
        run: |
          STACK_ID="${{ needs.configuration.outputs.stack_id }}"
          if [[ -n "$STACK_ID" && "$STACK_ID" != "null" ]]; then
            echo "🧹 Scanning S3 buckets for Blaze:StackID=${STACK_ID} via Tags..."
            TAGGED_ARNS=$(aws resourcegroupstaggingapi get-resources \
              --region "${{ needs.configuration.outputs.aws_region }}" \
              --tag-filters "Key=Blaze:StackID,Values=${STACK_ID}" \
              --resource-type-filters "s3" \
              --query 'ResourceTagMappingList[*].ResourceARN' \
              --output text 2>/dev/null || echo "")
          else
            echo "🧹 Scanning S3 buckets for Blaze:Environment=${ENV_KEY} via Tags..."
            TAGGED_ARNS=$(aws resourcegroupstaggingapi get-resources \
              --region "${{ needs.configuration.outputs.aws_region }}" \
              --tag-filters "Key=Blaze:Environment,Values=${ENV_KEY}" \
              --resource-type-filters "s3" \
              --query 'ResourceTagMappingList[*].ResourceARN' \
              --output text 2>/dev/null || echo "")
          fi

          FOUND_COUNT=0
          if [[ -n "$TAGGED_ARNS" && "$TAGGED_ARNS" != "None" ]]; then
             for BUCKET_ARN in $TAGGED_ARNS; do
                bucket="${BUCKET_ARN#arn:aws:s3:::}"
                if [[ "$bucket" == *"tfstate"* ]]; then continue; fi
                
                echo "🗑️ Found orphaned tagged bucket: $bucket"
                if [ "$CONFIRM_MODE" == "EXECUTE" ]; then
                   aws s3 rb "s3://$bucket" --force || echo "⚠️ Failed to delete $bucket"
                else
                   echo "ℹ️ [DRY RUN] Would delete $bucket"
                fi
                FOUND_COUNT=$((FOUND_COUNT+1))
             done
          fi

          if [ "$FOUND_COUNT" -eq 0 ]; then
             echo "✅ No orphaned buckets found."
          else
             if [ "$CONFIRM_MODE" != "EXECUTE" ]; then
                echo "⚠️ This was a DRY RUN. To actually delete these $FOUND_COUNT resources, set 'Confirmation' to 'EXECUTE'."
             else
                echo "✅ Successfully cleaned $FOUND_COUNT buckets."
             fi
          fi

      - name: Find and Delete Orphaned Log Groups
        env:
          ENV_KEY: ${{ inputs.environment == 'dev-mini' && 'dev-mini' || 'dev' }}
        run: |
          STACK_ID="${{ needs.configuration.outputs.stack_id }}"
          if [[ -n "$STACK_ID" && "$STACK_ID" != "null" ]]; then
            echo "🧹 Scanning CloudWatch Logs for Blaze:StackID=${STACK_ID} via Tags..."
            TAGGED_ARNS=$(aws resourcegroupstaggingapi get-resources \
              --region "${{ needs.configuration.outputs.aws_region }}" \
              --tag-filters "Key=Blaze:StackID,Values=${STACK_ID}" \
              --resource-type-filters "logs:log-group" \
              --query 'ResourceTagMappingList[*].ResourceARN' \
              --output text 2>/dev/null || echo "")
          else
            echo "🧹 Scanning CloudWatch Logs for Blaze:Environment=${ENV_KEY} via Tags..."
            TAGGED_ARNS=$(aws resourcegroupstaggingapi get-resources \
              --region "${{ needs.configuration.outputs.aws_region }}" \
              --tag-filters "Key=Blaze:Environment,Values=${ENV_KEY}" \
              --resource-type-filters "logs:log-group" \
              --query 'ResourceTagMappingList[*].ResourceARN' \
              --output text 2>/dev/null || echo "")
          fi

          TAGGED_LOGS=$(echo "$TAGGED_ARNS" | tr '\t' '\n' | grep -v 'None' | grep . || true)

          for log_arn in $TAGGED_LOGS; do
             log_name=$(echo "$log_arn" | awk -F':log-group:' '{print $2}' | sed 's/:\*$//')
             echo "🗑️ Found orphaned log group: $log_name"
             if [ "$CONFIRM_MODE" == "EXECUTE" ]; then
                aws logs delete-log-group --log-group-name "$log_name" || echo "⚠️ Failed to delete $log_name"
             else
                echo "ℹ️ [DRY RUN] Would delete $log_name"
             fi
          done

      - name: Find and Delete Orphaned Target Groups
        env:
          ENV_KEY: ${{ inputs.environment == 'dev-mini' && 'dev-mini' || 'dev' }}
        run: |
          STACK_ID="${{ needs.configuration.outputs.stack_id }}"
          if [[ -n "$STACK_ID" && "$STACK_ID" != "null" ]]; then
            echo "🧹 Scanning Target Groups for Blaze:StackID=${STACK_ID} via Tags..."
            TAGGED_ARNS=$(aws resourcegroupstaggingapi get-resources \
              --region "${{ needs.configuration.outputs.aws_region }}" \
              --tag-filters "Key=Blaze:StackID,Values=${STACK_ID}" \
              --resource-type-filters "elasticloadbalancing:targetgroup" \
              --query 'ResourceTagMappingList[*].ResourceARN' \
              --output text 2>/dev/null || echo "")
          else
            echo "🧹 Scanning Target Groups for Blaze:Environment=${ENV_KEY} via Tags..."
            TAGGED_ARNS=$(aws resourcegroupstaggingapi get-resources \
              --region "${{ needs.configuration.outputs.aws_region }}" \
              --tag-filters "Key=Blaze:Environment,Values=${ENV_KEY}" \
              --resource-type-filters "elasticloadbalancing:targetgroup" \
              --query 'ResourceTagMappingList[*].ResourceARN' \
              --output text 2>/dev/null || echo "")
          fi

          TAGGED_TGS=$(echo "$TAGGED_ARNS" | tr '\t' '\n' | grep -v 'None' | grep . || true)

          for tg_arn in $TAGGED_TGS; do
             tg_name=$(echo "$tg_arn" | awk -F'/' '{print $2}')
             echo "🗑️ Found orphaned target group: $tg_name ($tg_arn)"
             if [ "$CONFIRM_MODE" == "EXECUTE" ]; then
                aws elbv2 delete-target-group --target-group-arn "$tg_arn" || echo "⚠️ Failed to delete $tg_name"
             else
                echo "ℹ️ [DRY RUN] Would delete $tg_name"
             fi
          done

      - name: Find and Delete Orphaned CloudFront Functions
        env:
          PREFIX: ${{ needs.configuration.outputs.namespace }}-${{ needs.configuration.outputs.client_key }}-${{ needs.configuration.outputs.project_key }}
          ENV_KEY: ${{ inputs.environment == 'dev-mini' && 'dev-mini' || 'dev' }}
        run: |
          echo "🧹 Looking for orphaned CloudFront Functions matching *${PREFIX}-${ENV_KEY}*..."
          # Deduplicate: list-functions can return duplicate entries causing describe-function
          # to crash with NoSuchFunctionExists on the second pass of an already-deleted function.
          ALL_FUNCS=$(aws cloudfront list-functions --query "FunctionList.Items[].Name" --output text 2>/dev/null | tr '\t' '\n' | sort -u || echo "")

          for func in $ALL_FUNCS; do
             [[ -z "$func" ]] && continue
             if [[ "$func" == *"${PREFIX}-${ENV_KEY}"* ]]; then
                echo "🗑️ Found orphaned function: $func"
                if [ "$CONFIRM_MODE" == "EXECUTE" ]; then
                   # Guard: verify still exists before describe (handles duplicates / race conditions)
                   ETAG=$(aws cloudfront describe-function --name "$func" --query "ETag" --output text 2>/dev/null || echo "")
                   if [[ -z "$ETAG" || "$ETAG" == "None" ]]; then
                      echo "ℹ️ $func already deleted or not found — skipping"
                      continue
                   fi
                   aws cloudfront delete-function --name "$func" --if-match "$ETAG" && echo "✅ Deleted $func" || echo "⚠️ Failed to delete $func"
                else
                   echo "ℹ️ [DRY RUN] Would delete $func"
                fi
             fi
          done



  summary:
    name: 📝 Ops Summary
    needs: [configuration, manage-environment, cleanup-orphaned-lambdas, cleanup-orphaned-buckets]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Generate Summary
        run: |
          echo "# 🛠️ Ops Utility Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Helper function
          get_icon() {
            if [[ "$1" == "success" ]]; then echo "✅"; elif [[ "$1" == "skipped" ]]; then echo "⏭️"; elif [[ "$1" == "cancelled" ]]; then echo "🚫"; else echo "❌"; fi
          }

          echo "## 📋 Action Context" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Action** | \`${{ inputs.action }}\` |" >> $GITHUB_STEP_SUMMARY

          # If configuration ran successfully, we have more info
          if [[ "${{ needs.configuration.result }}" == "success" ]]; then
            echo "| **Environment** | \`${{ inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Cluster** | \`${{ needs.configuration.outputs.cluster_name }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Region** | \`${{ needs.configuration.outputs.aws_region }}\` |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🚦 Execution Status" >> $GITHUB_STEP_SUMMARY

          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
