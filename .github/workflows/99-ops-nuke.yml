name: "99 - Ops (NUKE)"

on:
  workflow_dispatch:
    inputs:
      cloud_provider:
        description: "Cloud Provider"
        type: choice
        options: ["aws", "gcp", "azure"]
        default: "aws"
      action:
        description: "🛠️ Select Action"
        type: choice
        options:
          - nuke-environment
        required: true
        default: nuke-environment
      environment:
        description: "Target Environment"
        type: choice
        options: ["dev", "dev-mini", "stage", "prod", "MULTI-SITE"]
        required: false
      nuke_mode:
        description: "Nuke mode: project | all-projects | total (for nuke-environment action only)"
        type: string
        required: false
        default: ""
      project:
        description: "Project key for 'project' mode (e.g. thisisblaze, support)"
        type: string
        required: false
        default: "thisisblaze"
      projects:
        description: "Comma-separated projects for 'all-projects' / 'total' modes (e.g. thisisblaze,support)"
        type: string
        required: false
        default: "thisisblaze,support"
      stack:
        description: "Terraform Stack (for state/destroy)"
        type: choice
        options: ["network", "data", "cdn", "acm", "tunnel", "app", "third-party-mongodb", "third-party-elastic"]
        default: "app"
        required: false
      branch_tag:
        description: "Feature Tag (if applicable)"
        required: false
        type: string
      confirmation:
        description: "Type 'EXECUTE' or 'DESTROY' (for standard ops) or 'NUKE' / 'TOTAL-NUKE' (for nuke modes)"
        required: false
        type: string
      # Action-specific inputs
      run_id:
        description: "GitHub Run ID (for kill-workflows)"
        required: false
        type: string
      manage_action:
        description: "Service Action (for manage-environment)"
        type: choice
        options: ["start", "stop", "restart", "scale"]
        default: "stop"
      desired_count:
        description: "Desired Instance Count (for scale)"
        type: string
        default: "0"
      # Cloudflare cleanup inputs
      retention_count:
        description: "Deployments to Keep (for cleanup-deployments)"
        type: string
        default: "5"
      retention_days:
        description: "Delete Deployments Older Than (days)"
        type: string
        default: "30"
      dry_run:
        description: "Dry Run (preview without deleting)"
        type: boolean
        default: true
      bulk_pattern:
        description: "Project Name Pattern (for bulk ops, e.g., 'blaze-*-dev-*')"
        type: string
        required: false
      skip_lambda_destroy:
        description: "Orphan Lambda@Edge before destroy (prevents hang)"
        type: boolean
        required: false
        default: true
      dist_id:
        description: "CloudFront Distribution ID (for nuke-cloudfront)"
        type: string
        required: false

  workflow_call:
    inputs:
      cloud_provider:
        type: string
        default: "aws"
        required: false
      action:
        type: string
        required: true
      environment:
        type: string
        required: false
      nuke_mode:
        type: string
        required: false
        default: ""
      project:
        type: string
        required: false
        default: "thisisblaze"
      projects:
        type: string
        required: false
        default: "thisisblaze,support"
      stack:
        type: string
        required: false
      branch_tag:
        type: string
        required: false
      confirmation:
        type: string
        required: false
      run_id:
        type: string
        required: false
      manage_action:
        type: string
        default: "stop"
        required: false
      desired_count:
        type: string
        default: "0"
        required: false
      retention_count:
        type: string
        default: "5"
        required: false
      retention_days:
        type: string
        default: "30"
        required: false
      dry_run:
        type: boolean
        default: true
        required: false
      bulk_pattern:
        type: string
        required: false
      skip_lambda_destroy:
        type: boolean
        required: false
        default: true
      dist_id:
        type: string
        required: false
    secrets:
      BASIC_AUTH_CREDENTIALS:
        required: false
      CLOUDFLARE_ZONE_ID_BLAZECMS_IO:
        required: false
      AWS_ROLE_ARN:
        required: false
      GH_PAT:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ZONE_ID:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      MONGODB_ATLAS_PUBLIC_KEY:
        required: false
      MONGODB_ATLAS_PRIVATE_KEY:
        required: false
      MONGODB_ATLAS_ORG_ID:
        required: false
      MONGODB_ATLAS_PROJECT_ID:
        required: false
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: false
      GCP_SERVICE_ACCOUNT:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false
      BLAZE_AUTH_ADMIN_EMAIL:
        required: false
      BLAZE_AUTH_ADMIN_PASSWORD:
        required: false
      BLAZE_FILES_S3_ACCESS_KEY:
        required: false
      BLAZE_FILES_S3_SECRET_ACCESS_KEY:
        required: false
      BLAZE_GRAPHQL_CACHE_SETTINGS:
        required: false
      BLAZE_CLIENT_HEADER:
        required: false
      ACM_CERTIFICATE_ARN:
        required: false
      EC_API_KEY:
        required: false
      SONAR_TOKEN:
        required: false
permissions:
  contents: read
  actions: write


env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate Request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Load Access List
        id: load-access
        run: |
          if [[ -f "vars/blaze-env.json" ]]; then
            ALLOWED=$(jq -r '.common.ALLOWED_INFRA_USERS // empty' vars/blaze-env.json)
            echo "allowed=$ALLOWED" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ vars/blaze-env.json not found. Skipping access control."
            echo "allowed=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Access
        if: steps.load-access.outputs.allowed != ''
        uses: thisisblaze/blaze-actions/.github/actions/check-access@v2.12.12
        with:
          allowed_users: ${{ steps.load-access.outputs.allowed }}
          actor: ${{ github.actor }}

      - name: Validate Input
        run: |
          ACTION="${{ inputs.action }}"
          CONF="$(printf '%s' "${{ inputs.confirmation }}" | xargs)"  # v3 learning 2026-07-16 (trailing-space gate): whitespace-normalize before the strict compare

          echo "🔍 Selected Action: $ACTION"

          # Block separators and headers
          if [[ "$ACTION" == "-"* ]]; then
            echo "❌ ERROR: You selected a category header or separator ('$ACTION')."
            echo "   Please select a real action (e.g., 'manage-environment')."
            exit 1
          fi

          MODE="${{ inputs.nuke_mode }}"
          # Validation for destructive actions (plan 163 O3 — fail closed).
          if [[ -n "$MODE" && "$ACTION" == "nuke-environment" ]]; then
            if [[ "$MODE" == "project" ]]; then
              if [[ "$CONF" != "NUKE" ]]; then
                echo "❌ ERROR: project mode requires exactly: NUKE"
                echo "   Received: '$CONF'"
                exit 1
              fi
              echo "⚠️  NUKE confirmed. Destroying project '${{ inputs.project }}' app stack only."
              echo "   Environment : ${{ inputs.environment }}"
              echo "   Preserving  : VPC, ALBs, ECS cluster, other projects"
            elif [[ "$MODE" == "all-projects" || "$MODE" == "total" ]]; then
              if [[ "$CONF" != "TOTAL-NUKE" ]]; then
                echo "❌ ERROR: $MODE mode requires exactly: TOTAL-NUKE"
                echo "   Received: '$CONF'"
                exit 1
              fi
              if [[ "$MODE" == "total" ]]; then
                echo "🔴 TOTAL-NUKE confirmed. Destroying ALL projects + shared network."
              else
                echo "⚠️  TOTAL-NUKE confirmed. Destroying ALL projects' app stacks."
                echo "   Preserving: VPC, ALBs, ECS cluster (shared network)"
              fi
              echo "   Environment : ${{ inputs.environment }}"
              echo "   Projects    : ${{ inputs.projects }}"
            else
              echo "❌ ERROR: Invalid nuke_mode '$MODE'"
              exit 1
            fi
          elif [[ "$ACTION" == "destroy-resources" || "$ACTION" == "wipe-state" || "$ACTION" == "nuke-environment" || "$ACTION" == "nuke-cloudfront" || "$ACTION" == "cleanup-dns" || "$ACTION" == "cleanup-orphaned-buckets" ]]; then
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              # Manual nuke must confirm the EXACT target (env + cloud) to defeat copy-paste mistakes.
              EXPECTED="DESTROY-${{ inputs.environment }}-${{ inputs.cloud_provider }}"
              if [[ "$CONF" != "$EXPECTED" ]]; then
                echo "❌ ERROR: Confirmation for '$ACTION' must be EXACTLY: $EXPECTED"
                echo "   (you typed: '$CONF') — this binds the confirmation to the chosen environment + cloud provider."
                exit 1
              fi
            else
              if [[ "$CONF" != "DESTROY" && "$CONF" != "EXECUTE" ]]; then
                echo "❌ ERROR: Confirmation required for $ACTION. Pass 'DESTROY' or 'EXECUTE'."
                exit 1
              fi
            fi
          fi

  debug-context:
    name: 🕵️ Debug Context
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'DEV' }}
    timeout-minutes: 5
    steps:
      - name: Check Secrets Presence
        run: |
          echo "🔍 Checking Secret Availability..."

          if [[ -n "${{ secrets.AWS_ROLE_ARN }}" ]]; then
            echo "✅ AWS_ROLE_ARN is SET (Length: ${#AWS_ROLE_ARN})"
          else
            echo "❌ AWS_ROLE_ARN is MISSING or EMPTY"
          fi

          if [[ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]]; then
             echo "✅ CLOUDFLARE_API_TOKEN is SET"
          else
             echo "❌ CLOUDFLARE_API_TOKEN is MISSING"
          fi

          if [[ -n "${{ secrets.GH_PAT }}" ]]; then
             echo "✅ GH_PAT is SET"
          else
             echo "ℹ️ GH_PAT is MISSING (This might be expected)"
          fi

          if [[ -n "${{ secrets.AZURE_CLIENT_ID }}" ]]; then
             echo "✅ AZURE_CLIENT_ID is SET"
          else
             echo "❌ AZURE_CLIENT_ID is MISSING"
          fi

          if [[ -n "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]]; then
             echo "✅ GCP_WORKLOAD_IDENTITY_PROVIDER is SET"
          else
             echo "❌ GCP_WORKLOAD_IDENTITY_PROVIDER is MISSING"
          fi
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

  configuration:
    permissions:
      contents: read
      id-token: write
    name: Configuration
    needs: [validate]
    # Run for all actions except kill-workflows
    if: inputs.action != 'kill-workflows'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'DEV' }}
    outputs:
      env_val: ${{ steps.config.outputs.env_val }}
      tf_dir: ${{ steps.config.outputs.tf_dir }}
      bucket: ${{ steps.config.outputs.bucket }}
      state_key: ${{ steps.config.outputs.state_key }}
      lock_table: ${{ steps.config.outputs.lock_table }}
      aws_region: ${{ steps.config.outputs.aws_region }}
      cluster_name: ${{ steps.config.outputs.cluster_name }}
      stage_key: ${{ steps.config.outputs.stage_key }}
      client_key: ${{ steps.config.outputs.client_key }}
      project_key: ${{ steps.config.outputs.project_key }}
      namespace: ${{ steps.config.outputs.namespace }}
      platform: ${{ steps.config.outputs.platform }}
      domain_root: ${{ steps.config.outputs.domain_root }}
      cloud_provider: ${{ steps.config.outputs.cloud_provider }}
      cloud_region: ${{ steps.config.outputs.cloud_region }}
      infra_prefix: ${{ steps.config.outputs.infra_prefix }}
      gcp_project_id: ${{ steps.config.outputs.gcp_project_id }}
      has_network: ${{ steps.check-dirs.outputs.has_network }}
      has_data: ${{ steps.check-dirs.outputs.has_data }}
      has_app: ${{ steps.check-dirs.outputs.has_app }}
      has_tenant_app: ${{ steps.check-dirs.outputs.has_tenant_app }}
      has_cdn: ${{ steps.check-dirs.outputs.has_cdn }}
      stack_id: ${{ steps.config.outputs.stack_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Load AWS Region from Config
        id: load-region
        run: |
          AWS_REGION=$(jq -r '.common.AWS_REGION' vars/blaze-env.json)
          if [[ -z "$AWS_REGION" ]]; then
            echo "❌ ERROR: AWS_REGION not set in vars/blaze-env.json"
            exit 1
          fi
          echo "aws_region=$AWS_REGION" >> "$GITHUB_OUTPUT"
          echo "✅ Using AWS Region: $AWS_REGION (from vars/blaze-env.json)"

      # TODO: Re-enable if calculate-config needs AWS Account ID
      # Temporarily disabled to allow workflow to run without AWS_ROLE_ARN configured
      # The calculate-config action handles missing AWS credentials gracefully
      # - name: Configure AWS Credentials
      #   uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
      #   with:
      #     role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      #     aws-region: ${{ steps.load-region.outputs.aws_region }}

      - name: Calculate Configuration
        id: config
        uses: thisisblaze/blaze-actions/.github/actions/calculate-config@v2.12.12
        with:
          environment: ${{ inputs.environment || 'DEV' }}
          terraform_stack: ${{ inputs.stack || 'app' }}
          branch_name: ${{ inputs.branch_tag }}
          cloud_provider: ${{ inputs.cloud_provider }}
          # Ops Utility implies infra operations, so we must pass true to bypass safety check
          deploy_infra: true
          build_images: "false"
          deploy_services: "false"
          event_name: "workflow_dispatch"

      - name: Check Stack Directories
        id: check-dirs
        run: |
          PREFIX="${{ steps.config.outputs.infra_prefix }}"
          STAGE="${{ steps.config.outputs.stage_key }}"

          echo "🔍 Checking directories in $PREFIX for stage $STAGE..."

          if [[ -d "$PREFIX/${STAGE}-network" ]]; then
            echo "✅ Network dir found"
            echo "has_network=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ Network dir NOT found"
            echo "has_network=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -d "$PREFIX/${STAGE}-data" ]]; then
            echo "✅ Data dir found"
            echo "has_data=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ Data dir NOT found"
            echo "has_data=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -d "$PREFIX/${STAGE}-app" ]]; then
            echo "✅ App dir found"
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ App dir NOT found"
            echo "has_app=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -d "$PREFIX/${STAGE}-tenant-app" ]]; then
            echo "✅ Tenant App dir found"
            echo "has_tenant_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ Tenant App dir NOT found"
            echo "has_tenant_app=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -d "$PREFIX/${STAGE}-cdn" ]]; then
            echo "✅ CDN dir found"
            echo "has_cdn=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ CDN dir NOT found"
            echo "has_cdn=false" >> "$GITHUB_OUTPUT"
          fi

  nuke-stop-services:
    permissions:
      contents: read
      id-token: write
    name: 🛑 Nuke 1/5 - Stop Services
    needs: [configuration]
    if: inputs.action == 'nuke-environment' && inputs.nuke_mode == '' && inputs.cloud_provider != 'gcp' && inputs.cloud_provider != 'azure'
    uses: thisisblaze/blaze-actions/.github/workflows/reusable-ecs-service-management.yml@v2.12.12
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

    with:
      cluster_name: ${{ needs.configuration.outputs.cluster_name }}
      action: "stop"
      service_name: "all"
      aws_region: ${{ needs.configuration.outputs.aws_region }}
      environment: ${{ inputs.environment || 'DEV' }}

  nuke-pre-cleanup:
    permissions:
      contents: read
      id-token: write
    name: 🧹 Nuke 1b/5 - Pre-Cleanup (S3/ECS)
    needs: [configuration, nuke-stop-services]
    if: inputs.action == 'nuke-environment' && inputs.nuke_mode == '' && inputs.cloud_provider != 'gcp' && inputs.cloud_provider != 'azure'
    uses: thisisblaze/blaze-actions/.github/workflows/reusable-pre-destroy-cleanup.yml@v2.12.12
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

    with:
      cluster_name: ${{ needs.configuration.outputs.cluster_name }}
      aws_region: ${{ needs.configuration.outputs.aws_region }}
      stage_filter: ${{ inputs.branch_tag }}
      environment: ${{ inputs.environment || 'DEV' }}
      target_stack: 'all'
      dry_run: ${{ inputs.dry_run }}
      stack_id: ${{ needs.configuration.outputs.stack_id }}

  nuke-stop-services-gcp:
    permissions:
      contents: read
      id-token: write
    name: 🛑 Nuke 1c/5 - Stop Cloud Run Services
    needs: [configuration]
    if: inputs.action == 'nuke-environment' && inputs.nuke_mode == '' && inputs.cloud_provider == 'gcp'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'DEV' }}
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          audience: ${{ vars.WIF_AUDIENCE }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Delete Cloud Run Services
        run: |
          PROJECT="${{ needs.configuration.outputs.gcp_project_id }}"
          REGION="${{ needs.configuration.outputs.cloud_region }}"
          PREFIX="${{ needs.configuration.outputs.namespace }}-${{ needs.configuration.outputs.client_key }}-${{ needs.configuration.outputs.project_key }}-${{ needs.configuration.outputs.stage_key }}"

          # Guard (plan 163 O2): refuse an under-qualified prefix that could match
          # unrelated services. Label-based selection is DEFERRED until the Blaze
          # label keys on GCP Cloud Run resources are confirmed (STOP condition).
          for part in "${{ needs.configuration.outputs.namespace }}" "${{ needs.configuration.outputs.client_key }}" "${{ needs.configuration.outputs.project_key }}" "${{ needs.configuration.outputs.stage_key }}"; do
            if [[ -z "$part" ]]; then
              echo "❌ ERROR: refusing Cloud Run selection — PREFIX has an empty component ('$PREFIX'). Fail closed."
              exit 1
            fi
          done

          echo "🗑️ Deleting Cloud Run services matching: ${PREFIX}-*"
          echo "   Project: $PROJECT"
          echo "   Region: $REGION"

          SERVICES=$(gcloud run services list \
            --project="$PROJECT" --region="$REGION" \
            --filter="metadata.name~^${PREFIX}" \
            --format="value(metadata.name)" 2>/dev/null || true)

          if [[ -z "$SERVICES" ]]; then
            echo "ℹ️  No Cloud Run services found matching prefix."
          else
            echo "::notice title=Cloud Run nuke::Matched $(echo "$SERVICES" | wc -w) service(s) for prefix ${PREFIX}-*"
            for SVC in $SERVICES; do
              echo "   🗑️ Deleting: $SVC"
              gcloud run services delete "$SVC" \
                --project="$PROJECT" --region="$REGION" \
                --quiet || echo "   ⚠️ Failed to delete $SVC"
            done
            echo "✅ Cloud Run cleanup complete."
          fi

          # Also clean up Artifact Registry images
          REPO="${{ needs.configuration.outputs.namespace }}-${{ needs.configuration.outputs.project_key }}-web"
          echo ""
          echo "🗑️ Checking Artifact Registry repo: $REPO"
          if gcloud artifacts repositories describe "$REPO" \
            --project="$PROJECT" --location="$REGION" >/dev/null 2>&1; then
            echo "   Deleting repository..."
            gcloud artifacts repositories delete "$REPO" \
              --project="$PROJECT" --location="$REGION" \
              --quiet || echo "   ⚠️ Failed to delete repo"
            echo "✅ Artifact Registry cleanup complete."
          else
            echo "ℹ️  Artifact Registry repo not found — skipping."
          fi

  # ── Azure: Pre-Cleanup (Container Apps) ──
  # Brute-force delete Container Apps and CAEs BEFORE Terraform destroy.
  # Prevents orphaned resources from blocking Resource Group deletion (Nuke 5/5).
  nuke-stop-services-azure:
    permissions:
      contents: read
      id-token: write
    name: 🛑 Nuke 1d/5 - Stop Container Apps (Azure)
    needs: [configuration]
    if: inputs.action == 'nuke-environment' && inputs.nuke_mode == '' && inputs.cloud_provider == 'azure'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'DEV' }}
    steps:
      - name: Authenticate to Azure
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete Container Apps & Environments
        run: |
          RG="${{ needs.configuration.outputs.namespace }}-${{ needs.configuration.outputs.client_key }}-${{ needs.configuration.outputs.project_key }}-${{ needs.configuration.outputs.stage_key }}-rg"

          echo "🗑️ Azure Pre-Cleanup: Resource Group = $RG"

          # 1. Delete all Container Apps in the RG
          echo "   Listing Container Apps..."
          APPS=$(az containerapp list --resource-group "$RG" --query "[].name" -o tsv 2>/dev/null || true)

          if [[ -z "$APPS" ]]; then
            echo "   ℹ️  No Container Apps found."
          else
            for APP in $APPS; do
              echo "   🗑️ Deleting Container App: $APP"
              az containerapp delete --name "$APP" --resource-group "$RG" --yes --no-wait 2>/dev/null || echo "   ⚠️ Failed to delete $APP"
            done
            echo "   ✅ Container Apps cleanup complete."
          fi

          # 2. Delete Container App Environments
          echo "   Listing Container App Environments..."
          ENVS=$(az containerapp env list --resource-group "$RG" --query "[].name" -o tsv 2>/dev/null || true)

          if [[ -z "$ENVS" ]]; then
            echo "   ℹ️  No Container App Environments found."
          else
            for ENV in $ENVS; do
              echo "   🗑️ Deleting CAE: $ENV"
              az containerapp env delete --name "$ENV" --resource-group "$RG" --yes --no-wait 2>/dev/null || echo "   ⚠️ Failed to delete $ENV"
            done
            echo "   ✅ CAE cleanup complete."
          fi

          # 3. Delete Action Groups (Application Insights auto-creates these)
          echo "   Listing Action Groups..."
          AGS=$(az monitor action-group list --resource-group "$RG" --query "[].name" -o tsv 2>/dev/null || true)

          if [[ -z "$AGS" ]]; then
            echo "   ℹ️  No Action Groups found."
          else
            for AG in $AGS; do
              echo "   🗑️ Deleting Action Group: $AG"
              az monitor action-group delete --name "$AG" --resource-group "$RG" 2>/dev/null || echo "   ⚠️ Failed to delete $AG"
            done
            echo "   ✅ Action Groups cleanup complete."
          fi

          echo "✅ Azure pre-cleanup finished."

  nuke-destroy-app:
    permissions:
      contents: read
      id-token: write
    name: 🗑️ Nuke 2/5 - App Stack
    needs: [configuration, nuke-pre-cleanup, nuke-stop-services-gcp, nuke-stop-services-azure]
    if: |
      always() &&
      inputs.action == 'nuke-environment' &&
      (inputs.nuke_mode == '' || inputs.nuke_mode == null) &&
      (needs.nuke-pre-cleanup.result == 'success' || needs.nuke-pre-cleanup.result == 'skipped') &&
      (needs.nuke-stop-services-gcp.result == 'success' || needs.nuke-stop-services-gcp.result == 'skipped') &&
      (needs.nuke-stop-services-azure.result == 'success' || needs.nuke-stop-services-azure.result == 'skipped') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.configuration.outputs.has_app == 'true'
    uses: thisisblaze/blaze-actions/.github/workflows/reusable-terraform.yml@v2.12.15
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      # Azure
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      MONGODB_ATLAS_PUBLIC_KEY: ${{ secrets.MONGODB_ATLAS_PUBLIC_KEY }}
      MONGODB_ATLAS_PRIVATE_KEY: ${{ secrets.MONGODB_ATLAS_PRIVATE_KEY }}
      MONGODB_ATLAS_PROJECT_ID: ${{ secrets.MONGODB_ATLAS_PROJECT_ID }}
      MONGODB_ATLAS_ORG_ID: ${{ secrets.MONGODB_ATLAS_ORG_ID }}
      EC_API_KEY: ${{ secrets.EC_API_KEY }}
      ACM_CERTIFICATE_ARN: ${{ secrets.ACM_CERTIFICATE_ARN }}
    with:
      wif_audience: ${{ vars.WIF_AUDIENCE }}
      cloud_provider: ${{ inputs.cloud_provider }}
      # Force explicit path for App stack instead of using config output (which relies on input.stack)
      tf_dir: "${{ needs.configuration.outputs.infra_prefix }}/${{ needs.configuration.outputs.stage_key }}-app"
      aws_region: ${{ needs.configuration.outputs.aws_region }}
      environment: ${{ inputs.environment || 'DEV' }}
      # Backend Config (Must match calculate-config logic)
      bucket: ${{ needs.configuration.outputs.bucket }}
      # Key format: infra/{project}/{stage}/{stack}.tfstate
      # We must reconstruct the key for each stack.
      state_key: "infra/${{ needs.configuration.outputs.project_key }}/${{ needs.configuration.outputs.stage_key }}/app.tfstate"
      lock_table: ${{ needs.configuration.outputs.lock_table }}
      apply: "${{ inputs.dry_run != true && inputs.dry_run != 'true' }}"
      destroy: "true"
      tf_vars: |
        project_key=${{ needs.configuration.outputs.project_key }}
        client_key=${{ needs.configuration.outputs.client_key }}
        namespace=${{ needs.configuration.outputs.namespace }}
        platform=${{ needs.configuration.outputs.platform }}
        aws_region=${{ needs.configuration.outputs.aws_region }}
        domain_root=${{ needs.configuration.outputs.domain_root }}
        stage=${{ needs.configuration.outputs.stage_key }}
        branch_name=${{ inputs.branch_tag }}

        gcp_project_id=${{ needs.configuration.outputs.gcp_project_id }}
        gcp_region=${{ needs.configuration.outputs.cloud_region }}
        azure_region=${{ needs.configuration.outputs.cloud_region }}
      pre_apply_script: |
        echo "🔪 REMOVING ORPHANED CODEDEPLOY STATE (IAM role deleted before deployment group)..."
        # CodeDeploy API refuses to delete deployment groups when their IAM role
        # no longer exists. Remove them from state so destroy can proceed.
        terraform state rm "module.app.module.api_service.aws_codedeploy_deployment_group.this[0]" 2>/dev/null || true
        terraform state rm "module.app.module.api_service.aws_codedeploy_app.this[0]" 2>/dev/null || true
        terraform state rm "module.app.module.frontend_service.aws_codedeploy_deployment_group.this[0]" 2>/dev/null || true
        terraform state rm "module.app.module.frontend_service.aws_codedeploy_app.this[0]" 2>/dev/null || true
        echo "✅ Orphaned CodeDeploy state removed."

  nuke-destroy-tenant-app:
    permissions:
      contents: read
      id-token: write
    name: 🗑️ Nuke 2/5 - Tenant App Stack
    needs: [configuration, nuke-pre-cleanup, nuke-stop-services-gcp, nuke-stop-services-azure]
    if: |
      always() &&
      inputs.action == 'nuke-environment' &&
      (inputs.nuke_mode == '' || inputs.nuke_mode == null) &&
      (needs.nuke-pre-cleanup.result == 'success' || needs.nuke-pre-cleanup.result == 'skipped') &&
      (needs.nuke-stop-services-gcp.result == 'success' || needs.nuke-stop-services-gcp.result == 'skipped') &&
      (needs.nuke-stop-services-azure.result == 'success' || needs.nuke-stop-services-azure.result == 'skipped') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.configuration.outputs.has_tenant_app == 'true'
    uses: thisisblaze/blaze-actions/.github/workflows/reusable-terraform.yml@v2.12.15
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      # Azure
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      MONGODB_ATLAS_PUBLIC_KEY: ${{ secrets.MONGODB_ATLAS_PUBLIC_KEY }}
      MONGODB_ATLAS_PRIVATE_KEY: ${{ secrets.MONGODB_ATLAS_PRIVATE_KEY }}
      MONGODB_ATLAS_PROJECT_ID: ${{ secrets.MONGODB_ATLAS_PROJECT_ID }}
      MONGODB_ATLAS_ORG_ID: ${{ secrets.MONGODB_ATLAS_ORG_ID }}
      EC_API_KEY: ${{ secrets.EC_API_KEY }}
      ACM_CERTIFICATE_ARN: ${{ secrets.ACM_CERTIFICATE_ARN }}
    with:
      wif_audience: ${{ vars.WIF_AUDIENCE }}
      cloud_provider: ${{ inputs.cloud_provider }}
      # Force explicit path for App stack instead of using config output (which relies on input.stack)
      tf_dir: "${{ needs.configuration.outputs.infra_prefix }}/${{ needs.configuration.outputs.stage_key }}-tenant-app"
      aws_region: ${{ needs.configuration.outputs.aws_region }}
      environment: ${{ inputs.environment || 'DEV' }}
      # Backend Config (Must match calculate-config logic)
      bucket: ${{ needs.configuration.outputs.bucket }}
      # Key format: infra/{project}/{stage}/{stack}.tfstate
      # We must reconstruct the key for each stack.
      state_key: "infra/${{ needs.configuration.outputs.project_key }}/${{ needs.configuration.outputs.stage_key }}/${{ needs.configuration.outputs.project_key }}.tfstate"
      lock_table: ${{ needs.configuration.outputs.lock_table }}
      apply: "${{ inputs.dry_run != true && inputs.dry_run != 'true' }}"
      destroy: "true"
      tf_vars: |
        project_key=${{ needs.configuration.outputs.project_key }}
        client_key=${{ needs.configuration.outputs.client_key }}
        namespace=${{ needs.configuration.outputs.namespace }}
        platform=${{ needs.configuration.outputs.platform }}
        aws_region=${{ needs.configuration.outputs.aws_region }}
        domain_root=${{ needs.configuration.outputs.domain_root }}
        stage=${{ needs.configuration.outputs.stage_key }}
        branch_name=${{ inputs.branch_tag }}

        gcp_project_id=${{ needs.configuration.outputs.gcp_project_id }}
        gcp_region=${{ needs.configuration.outputs.cloud_region }}
        azure_region=${{ needs.configuration.outputs.cloud_region }}
      pre_apply_script: |
        echo "🔪 REMOVING ALL TENANT APP STATE (SSM network params are deleted before tenant-app destroy runs —"
        echo "   terraform plan -destroy fails reading data sources that no longer exist in Parameter Store)."
        echo "   Strategy: rm all state entries so the destroy plan is a clean no-op and exits 0."
        STATE_LIST=$(terraform state list 2>/dev/null || true)
        if [[ -z "$STATE_LIST" ]]; then
          echo "ℹ️  State is already empty — nothing to remove."
        else
          echo "$STATE_LIST" | while read ADDR; do
            echo "   Removing: $ADDR"
            terraform state rm "$ADDR" 2>/dev/null || true
          done
          echo "✅ Tenant app state cleared — destroy plan will be a clean no-op."
        fi

  # Gate job: runs after app destroy (success OR failure) so data/network stacks proceed.
  # Needed because the environment-app module has a Terraform count bug that causes plan
  # to fail when resources are already destroyed (count depends on unknown attributes).
  nuke-app-gate:
    name: ✅ Nuke 2g - App Gate (absorb failure)
    needs: [configuration, nuke-destroy-app, nuke-destroy-tenant-app]
    if: |
      always() &&
      inputs.action == 'nuke-environment' &&
      (inputs.nuke_mode == '' || inputs.nuke_mode == null) &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Gate
        run: |
          RESULT="${{ needs.nuke-destroy-app.result }}"
          TENANT_RESULT="${{ needs.nuke-destroy-tenant-app.result }}"
          echo "App stack result: $RESULT"
          echo "Tenant App stack result: $TENANT_RESULT"
          if [ "$RESULT" = "cancelled" ] || [ "$TENANT_RESULT" = "cancelled" ]; then exit 1; fi
          echo "✅ Proceeding with data/network destroy regardless of app result"

  nuke-destroy-pages:
    name: 🗑️ Nuke 2b/5 - Pages Projects
    needs: [configuration, nuke-app-gate]
    if: inputs.action == 'nuke-environment' && inputs.nuke_mode == '' && inputs.cloud_provider != 'gcp' && inputs.cloud_provider != 'azure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete Pages Projects
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NAMESPACE: ${{ needs.configuration.outputs.namespace }}
          PROJECT: ${{ needs.configuration.outputs.project_key }}
          STAGE: ${{ needs.configuration.outputs.stage_key }}
          CLIENT: ${{ needs.configuration.outputs.client_key }}
        run: |
          if [ "${{ env.STAGE }}" = "prod" ]; then
             PREFIX="${NAMESPACE}-${CLIENT}-${PROJECT}"
          else
             PREFIX="${NAMESPACE}-${CLIENT}-${PROJECT}-${STAGE}"
          fi

          PROJECTS=("${PREFIX}-admin" "${PREFIX}-frontend")

          echo "🗑️ Preparing to delete Pages projects..."

          for PROJ in "${PROJECTS[@]}"; do
             echo "   Target: $PROJ"
             
             # Delete Domains first
             echo "      Fetching domains..."
             DOMAINS=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${PROJ}/domains" -H "Authorization: Bearer ${CF_API_TOKEN}" | jq -r '.result[]?.name')
             
             for DOMAIN in $DOMAINS; do
                if [ "$DOMAIN" != "null" ]; then
                   echo "      Deleting Domain: $DOMAIN"
                   curl -s -X DELETE "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${PROJ}/domains/${DOMAIN}" -H "Authorization: Bearer ${CF_API_TOKEN}"
                fi
             done

             echo "      Deleting Project..."
             RESPONSE=$(curl -s -X DELETE \
               "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${PROJ}" \
               -H "Authorization: Bearer ${CF_API_TOKEN}" \
               -H "Content-Type: application/json" \
               -w "\n%{http_code}" )

             HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
             
             if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "404" ]; then
                echo "      ✅ Deleted (or not found)"
             else
                echo "      ⚠️ Failed to delete (HTTP $HTTP_CODE)"
             fi
          done

