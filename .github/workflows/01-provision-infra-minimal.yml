name: "01 Provision Infra Minimal"
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      project:
        required: false
        type: string
        default: "thisisblaze"
      apply:
        required: false
        type: string
        default: "false"
    secrets:
      AWS_ROLE_ARN:
        required: false
      GH_PAT:
        required: false

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Test"

  terraform:
    needs: [test]
    name: "Terraform"
    permissions:
      contents: read
      id-token: write
    uses: thisisblaze/blaze-actions/.github/workflows/reusable-terraform.yml@v2.12.3
    with:
      environment: ${{ inputs.environment }}
      cloud_provider: "aws"
      tf_dir: "live/dev/network"
      aws_region: "us-east-1"
      bucket: "test-bucket"
      state_key: "test.tfstate"
      lock_table: "test-lock"
      apply: ${{ inputs.apply }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
