name: "♻️ 🌪️ Phase 1: Teardown"

on:
  workflow_call:
    inputs:
      environment:
        description: "Target Environment"
        required: true
        type: string

      project:
        description: "Project (App Identity) - e.g. thisisblaze, support"
        required: false
        default: "thisisblaze"
        type: string

      target_type:
        description: "What to test"
        required: false
        default: "host"
        type: string

      branch_tag:
        description: "Feature branch tag (required if target_type=feature-branch)"
        required: false
        type: string

      mode:
        description: "Execution Mode"
        required: false
        default: "standard"
        type: string

      include_third_party:
        description: "Include third-party stacks (MongoDB, Elastic, Cloudflare)"
        required: false
        default: false
        type: boolean

      preserve_host:
        description: "Preserve host network"
        required: false
        default: false
        type: boolean

      cloud_provider:
        required: false
        type: string
        default: aws

      app_stack:
        description: "App stack type: tenant-app or multi-site-app"
        required: false
        default: "tenant-app"
        type: string

      network_stack:
        description: "Network stack type: auto (env-network) or multi-site-network"
        required: false
        default: "auto"
        type: string

      wif_audience:
        description: "OIDC Audience"
        required: false
        type: string

    secrets:
      BLAZE_ELASTICSEARCH_USERNAME:
        required: false
      BLAZE_ELASTICSEARCH_PASSWORD:
        required: false
      BLAZE_ELASTICSEARCH_ENDPOINT:
        required: false
      AWS_ROLE_ARN:
        required: false
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: false
      GCP_SERVICE_ACCOUNT:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      CLOUDFLARE_ZONE_ID:
        required: false
      GH_PAT:
        required: false
      NPM_TOKEN:
        required: false
      INFRACOST_API_KEY:
        required: false
      BLAZE_CONNECTION_STRING:
        required: false
      BLAZE_AUTH_JWT_PRIVATE_KEY:
        required: false
      BLAZE_AUTH_ADMIN_EMAIL:
        required: false
      BLAZE_AUTH_ADMIN_PASSWORD:
        required: false
      BLAZE_FILES_S3_ACCESS_KEY:
        required: false
      BLAZE_FILES_S3_SECRET_ACCESS_KEY:
        required: false
      BLAZE_GRAPHQL_CACHE_SETTINGS:
        required: false
      BLAZE_CLIENT_HEADER:
        required: false
      EC_API_KEY:
        required: false
      MONGODB_ATLAS_PUBLIC_KEY:
        required: false
      MONGODB_ATLAS_PRIVATE_KEY:
        required: false
      MONGODB_ATLAS_ORG_ID:
        required: false
      MONGODB_ATLAS_PROJECT_ID:
        required: false
      ACM_CERTIFICATE_ARN:
        required: false
      BLAZE_SENTRY_AUTH_TOKEN:
        required: false
      BLAZE_SENTRY_DSN:
        required: false
      SLACK_WEBHOOK_URL:
        required: false
      DEPLOY_KEY:
        required: false
      BASIC_AUTH_CREDENTIALS:
        required: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # --------------------------------------------------------------------------------
  # 1. SETUP & CONFIG
  # --------------------------------------------------------------------------------
  setup:
    name: "Initialize"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      terraform_stack: ${{ steps.calc.outputs.stack }}
      branch_tag: ${{ steps.calc.outputs.tag }}
    steps:
      - id: calc
        run: |
          if [[ "${{ inputs.target_type }}" == "feature-branch" ]]; then
            echo "stack=app" >> $GITHUB_OUTPUT
            echo "tag=${{ inputs.branch_tag }}" >> $GITHUB_OUTPUT
          else
            echo "stack=network" >> $GITHUB_OUTPUT
            echo "tag=" >> $GITHUB_OUTPUT
          fi

  config:
    name: "⚙️ Config"
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      stage_key: ${{ steps.calc.outputs.stage_key }}
      bucket: ${{ steps.calc.outputs.bucket }}
      lock_table: ${{ steps.calc.outputs.lock_table }}
      state_key: ${{ steps.calc.outputs.state_key }}
      tf_dir: ${{ steps.calc.outputs.tf_dir }}
      cluster_name: ${{ steps.calc.outputs.cluster_name }}
      env_val: ${{ steps.calc.outputs.env_val }}
      aws_region: ${{ steps.calc.outputs.aws_region }}
      client_key: ${{ steps.calc.outputs.client_key }}
      project_key: ${{ steps.calc.outputs.project_key }}
      namespace: ${{ steps.calc.outputs.namespace }}
      platform: ${{ steps.calc.outputs.platform }}
      cloud_provider: ${{ steps.calc.outputs.cloud_provider }}
      cloud_region: ${{ steps.calc.outputs.cloud_region }}
      infra_prefix: ${{ steps.calc.outputs.infra_prefix }}
      gcp_project_id: ${{ steps.calc.outputs.gcp_project_id }}
      domain_root: ${{ steps.calc.outputs.domain_root }}
      allowed_infra_users: ${{ steps.calc.outputs.allowed_infra_users }}
      gcp_docker_repo: ${{ steps.calc.outputs.gcp_docker_repo }}
      azure_acr_name: ${{ steps.calc.outputs.azure_acr_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Checkout Actions
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: thisisblaze/blaze-actions
          path: .blaze-actions
          ref: dev

      - name: Calculate Configuration
        id: calc
        uses: ./.blaze-actions/.github/actions/calculate-env-config
        with:
          environment: ${{ inputs.environment }}
          project: ${{ inputs.project }}
          terraform_stack: ${{ needs.setup.outputs.terraform_stack }}
          branch_tag: ${{ needs.setup.outputs.branch_tag }}
          cloud_provider: ${{ inputs.cloud_provider }}

  # --------------------------------------------------------------------------------
  # 1.5 PRODUCTION SAFETY CHECK
  # --------------------------------------------------------------------------------
  prod-safety-check:
    if: inputs.environment == 'prod'
    name: "⚠️ Production Safety Check"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: prod-stress-test-approval
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Manual Approval Required
        run: |
          echo "🚨 PRODUCTION STRESS TEST"
          echo "Environment: ${{ inputs.environment }}"
          echo "Target: ${{ inputs.target_type }}"
          echo "Mode: ${{ inputs.mode }}"
          echo "Include Third-Party: ${{ inputs.include_third_party }}"
          echo ""
          echo "This will DESTROY and RECREATE production infrastructure."
          echo "Ensure all pre-flight checks are complete before approving."

  # --------------------------------------------------------------------------------
  # 1.6 PRE-FLIGHT CHECKS (Verify What Exists)
  # --------------------------------------------------------------------------------
  check-states:
    name: "🔍 Check Stack States"
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app_exists: ${{ steps.check-app.outputs.exists }}
      db_pod_exists: ${{ steps.check-db-pod.outputs.exists }}
      tunnel_exists: ${{ steps.check-tunnel.outputs.exists }}
      network_exists: ${{ steps.check-network.outputs.exists }}
      mongodb_exists: ${{ steps.check-mongodb.outputs.exists }}
      elastic_exists: ${{ steps.check-elastic.outputs.exists }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Checkout Actions
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: thisisblaze/blaze-actions
          path: .blaze-actions
          ref: dev

      - name: Check App State
        id: check-app
        uses: ./.blaze-actions/.github/actions/check-stack-exists
        with:
          cloud_provider: ${{ inputs.cloud_provider }}
          bucket: ${{ needs.config.outputs.bucket }}
          state_key: ${{ inputs.app_stack == 'multi-site-app' && 
            format('infra/{0}/multi-site/app.tfstate', 
            needs.config.outputs.project_key) || format('infra/{0}/{1}/{2}', 
            needs.config.outputs.project_key, needs.config.outputs.stage_key, 
            (inputs.environment == 'dev' || inputs.environment == 'stage') && 
            'tenant-app.tfstate' || 'app.tfstate') }}
          aws_region: ${{ needs.config.outputs.aws_region }}
          aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          wif_audience: ${{ inputs.wif_audience || vars.WIF_AUDIENCE }}

      - name: Check Data Pod State
        if: inputs.include_third_party && inputs.target_type == 'host'
        id: check-db-pod
        uses: ./.blaze-actions/.github/actions/check-stack-exists
        with:
          cloud_provider: ${{ inputs.cloud_provider }}
          bucket: ${{ needs.config.outputs.bucket }}
          state_key: "infra/${{ needs.config.outputs.project_key }}/${{ needs.config.outputs.stage_key }}/db-pod-alpha.tfstate"
          aws_region: ${{ needs.config.outputs.aws_region }}
          aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          wif_audience: ${{ inputs.wif_audience || vars.WIF_AUDIENCE }}

      - name: Check Tunnel State
        id: check-tunnel
        uses: ./.blaze-actions/.github/actions/check-stack-exists
        with:
          cloud_provider: ${{ inputs.cloud_provider }}
          bucket: ${{ needs.config.outputs.bucket }}
          state_key: "infra/${{ needs.config.outputs.project_key }}/third-party/cloudflare.tfstate"
          aws_region: ${{ needs.config.outputs.aws_region }}
          aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          wif_audience: ${{ inputs.wif_audience || vars.WIF_AUDIENCE }}

      - name: Check Network State
        if: inputs.target_type == 'host'
        id: check-network
        uses: ./.blaze-actions/.github/actions/check-stack-exists
        with:
          cloud_provider: ${{ inputs.cloud_provider }}
          bucket: ${{ needs.config.outputs.bucket }}
          state_key: ${{ inputs.network_stack == 'multi-site-network' && 
            format('infra/{0}/multi-site/network.tfstate', 
            needs.config.outputs.project_key) || 
            format('infra/{0}/{1}/network.tfstate', 
            needs.config.outputs.project_key, needs.config.outputs.stage_key) }}
          aws_region: ${{ needs.config.outputs.aws_region }}
          aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          wif_audience: ${{ inputs.wif_audience || vars.WIF_AUDIENCE }}

      - name: Check MongoDB State
        if: inputs.include_third_party && inputs.target_type == 'host'
        id: check-mongodb
        uses: ./.blaze-actions/.github/actions/check-stack-exists
        with:
          cloud_provider: ${{ inputs.cloud_provider }}
          bucket: ${{ needs.config.outputs.bucket }}
          state_key: "infra/${{ needs.config.outputs.project_key }}/third-party/mongodb.tfstate"
          aws_region: ${{ needs.config.outputs.aws_region }}
          aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          wif_audience: ${{ inputs.wif_audience || vars.WIF_AUDIENCE }}

      - name: Check Elastic State
        if: inputs.include_third_party && inputs.target_type == 'host'
        id: check-elastic
        uses: ./.blaze-actions/.github/actions/check-stack-exists
        with:
          cloud_provider: ${{ inputs.cloud_provider }}
          bucket: ${{ needs.config.outputs.bucket }}
          state_key: "infra/${{ needs.config.outputs.project_key }}/third-party/elastic.tfstate"
          aws_region: ${{ needs.config.outputs.aws_region }}
          aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          wif_audience: ${{ inputs.wif_audience || vars.WIF_AUDIENCE }}

  # --------------------------------------------------------------------------------
  # 2. CLEANUP SERVICES (Critical for Cluster Destroy)
  # --------------------------------------------------------------------------------
  cleanup-services:
    permissions:
      contents: read
      id-token: write
    if: ${{ always() && inputs.mode != 'quick-test' && needs.config.result == 'success' && (needs.prod-safety-check.result == 'success' || inputs.environment != 'prod') }}
    needs:
      - config
      - prod-safety-check
      - check-states
    uses: thisisblaze/blaze-actions/.github/workflows/reusable-pre-destroy-cleanup.yml@main
    with:
      cluster_name: ${{ needs.config.outputs.cluster_name }}
      aws_region: ${{ needs.config.outputs.aws_region }}
      force_delete: true
      dry_run: false
      environment: ${{ inputs.environment }}
      cloud_provider: ${{ inputs.cloud_provider }}
      wif_audience: ${{ inputs.wif_audience || vars.WIF_AUDIENCE }}
      target_stack: ${{ inputs.preserve_host == true && 'app' || 'all' }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

  # --------------------------------------------------------------------------------
  # 3. TEARDOWN (Infrastructure)
  # --------------------------------------------------------------------------------
  destroy-app:
    permissions:
      contents: read
      id-token: write
    if: ${{ always() && inputs.mode != 'quick-test' && needs.cleanup-services.result != 'failure' && needs.cleanup-services.result != 'cancelled' && needs.check-states.outputs.app_exists == 'true' }}
    name: "🧨 Destroy App"

    needs: [config, cleanup-services, check-states]
    uses: thisisblaze/blaze-actions/.github/workflows/reusable-terraform-operations.yml@main
    with:
      action: "destroy"
      tf_dir: ${{ inputs.app_stack == 'multi-site-app' && 
        format('{0}/multi-site-app', needs.config.outputs.infra_prefix) || 
        format('{0}/{1}-{2}', needs.config.outputs.infra_prefix, 
        inputs.environment, (inputs.environment == 'dev' || inputs.environment 
        == 'stage') && 'tenant-app' || 'app') }}
      bucket: ${{ needs.config.outputs.bucket }}
      state_key: ${{ inputs.app_stack == 'multi-site-app' && 
        format('infra/{0}/multi-site/app.tfstate', 
        needs.config.outputs.project_key) || format('infra/{0}/{1}/{2}', 
        needs.config.outputs.project_key, needs.config.outputs.stage_key, 
        (inputs.environment == 'dev' || inputs.environment == 'stage') && 
        'tenant-app.tfstate' || 'app.tfstate') }}
      stage_key: ${{ needs.config.outputs.stage_key }}
      aws_region: ${{ needs.config.outputs.aws_region }}
      client_key: ${{ needs.config.outputs.client_key }}
      project_key: ${{ needs.config.outputs.project_key }}
      namespace: ${{ needs.config.outputs.namespace }}
      cloud_platform: ${{ inputs.cloud_provider }}
      domain_root: ${{ needs.config.outputs.domain_root }}
      environment: ${{ inputs.environment }}
      wif_audience: ${{ inputs.wif_audience || vars.WIF_AUDIENCE }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      GH_PAT: ${{ secrets.GH_PAT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACM_CERTIFICATE_ARN: ${{ secrets.ACM_CERTIFICATE_ARN }}

  post-destroy-app-wait:
    permissions:
      contents: read
      id-token: write
    if: ${{ always() && inputs.mode != 'quick-test' && needs.destroy-app.result == 'success' }}
    name: "⏳ Wait for ECS Service Purge"
    needs: [config, destroy-app]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure AWS Credentials
        if: inputs.cloud_provider == 'aws' || inputs.cloud_provider == ''
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37     # v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ needs.config.outputs.aws_region || 'eu-west-1' }}

      - name: Wait for ECS Services to transition to INACTIVE
        if: inputs.cloud_provider == 'aws' || inputs.cloud_provider == ''
        run: |
          echo "⏳ Waiting 60 seconds to ensure AWS fully purges ECS Services from the control plane..."
          echo "   (This prevents 'Unable to Start a service that is still Draining' upon immediate reprovisioning)"
          sleep 60

          REGION="${{ needs.config.outputs.aws_region || 'eu-west-1' }}"
          NAMESPACE="${{ needs.config.outputs.namespace || 'blaze' }}"
          CLIENT_KEY="${{ needs.config.outputs.client_key || 'b9' }}"
          PROJECT_KEY="${{ needs.config.outputs.project_key }}"
          STAGE_KEY="${{ needs.config.outputs.stage_key }}"
          RESOURCE_PREFIX="${NAMESPACE}-${CLIENT_KEY}-${PROJECT_KEY}-${STAGE_KEY}"

          # Poll clusters in our environment
          ECS_CLUSTERS=$(aws ecs list-clusters --region "$REGION" --query 'clusterArns[]' --output text 2>/dev/null || echo "")
          for CLUSTER_ARN in $ECS_CLUSTERS; do
            CLUSTER_NAME=$(echo "$CLUSTER_ARN" | awk -F'/' '{print $NF}')
            [[ "$CLUSTER_NAME" != *"${RESOURCE_PREFIX}"* ]] && continue
            
            echo "   Checking cluster: $CLUSTER_NAME"
            SVC_ARNS=$(aws ecs list-services --cluster "$CLUSTER_ARN" --region "$REGION" --query 'serviceArns[]' --output text 2>/dev/null || echo "")
            if [[ -n "$SVC_ARNS" && "$SVC_ARNS" != "None" ]]; then
              echo "   ⚠️  Found lingering services: $SVC_ARNS"
              aws ecs wait services-inactive --cluster "$CLUSTER_ARN" --services $SVC_ARNS --region "$REGION" 2>/dev/null || true
            fi
          done
          echo "✅ All targeted ECS services confirmed INACTIVE."

  destroy-data-pod:
    permissions:
      contents: read
      id-token: write
    if: ${{ inputs.include_third_party && inputs.target_type == 'host' && needs.check-states.outputs.db_pod_exists == 'true' }}
    name: "🧨 Destroy Data Pod"

    needs: [config, destroy-app, check-states]
    uses: thisisblaze/blaze-actions/.github/workflows/reusable-terraform-operations.yml@main
    with:
      action: "destroy"
      tf_dir: "${{ needs.config.outputs.infra_prefix }}/${{ inputs.environment }}-db-pod-alpha"
      bucket: ${{ needs.config.outputs.bucket }}
      state_key: "infra/${{ needs.config.outputs.project_key }}/${{ needs.config.outputs.stage_key }}/db-pod-alpha.tfstate"
      stage_key: ${{ needs.config.outputs.stage_key }}
      aws_region: ${{ needs.config.outputs.aws_region }}
      client_key: ${{ needs.config.outputs.client_key }}
      project_key: ${{ needs.config.outputs.project_key }}
      namespace: ${{ needs.config.outputs.namespace }}
      cloud_platform: ${{ inputs.cloud_provider }}
      domain_root: ${{ needs.config.outputs.domain_root }}
      environment: ${{ inputs.environment }}
      wif_audience: ${{ inputs.wif_audience || vars.WIF_AUDIENCE }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      GH_PAT: ${{ secrets.GH_PAT }}
      MONGODB_ATLAS_PUBLIC_KEY: ${{ secrets.MONGODB_ATLAS_PUBLIC_KEY }}
      MONGODB_ATLAS_PRIVATE_KEY: ${{ secrets.MONGODB_ATLAS_PRIVATE_KEY }}
      MONGODB_ATLAS_ORG_ID: ${{ secrets.MONGODB_ATLAS_ORG_ID }}

  destroy-third-party-mongodb:
    permissions:
      contents: read
      id-token: write
    if: ${{ inputs.include_third_party && inputs.target_type == 'host' && needs.check-states.outputs.mongodb_exists == 'true' }}
    name: "🧨 Destroy MongoDB"
    needs: [config, destroy-app, check-states]
    uses: thisisblaze/blaze-actions/.github/workflows/reusable-terraform-operations.yml@main
    with:
      action: "destroy"
      tf_dir: "${{ needs.config.outputs.infra_prefix }}/third-party/mongodb"
      bucket: ${{ needs.config.outputs.bucket }}
      state_key: "infra/${{ needs.config.outputs.project_key }}/third-party/mongodb.tfstate"
      stage_key: ${{ needs.config.outputs.stage_key }}
      aws_region: ${{ needs.config.outputs.aws_region }}
      client_key: ${{ needs.config.outputs.client_key }}
      project_key: ${{ needs.config.outputs.project_key }}
      namespace: ${{ needs.config.outputs.namespace }}
      cloud_platform: ${{ inputs.cloud_provider }}
      domain_root: ${{ needs.config.outputs.domain_root }}
      environment: ${{ inputs.environment }}
      wif_audience: ${{ inputs.wif_audience || vars.WIF_AUDIENCE }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      MONGODB_ATLAS_PUBLIC_KEY: ${{ secrets.MONGODB_ATLAS_PUBLIC_KEY }}
      MONGODB_ATLAS_PRIVATE_KEY: ${{ secrets.MONGODB_ATLAS_PRIVATE_KEY }}
      MONGODB_ATLAS_ORG_ID: ${{ secrets.MONGODB_ATLAS_ORG_ID }}
      MONGODB_ATLAS_PROJECT_ID: ${{ secrets.MONGODB_ATLAS_PROJECT_ID }}

  destroy-third-party-elastic:
    permissions:
      contents: read
      id-token: write
    if: ${{ inputs.include_third_party && inputs.target_type == 'host' && needs.check-states.outputs.elastic_exists == 'true' }}
    name: "🧨 Destroy Elastic"
    needs: [config, destroy-app, check-states]
    uses: thisisblaze/blaze-actions/.github/workflows/reusable-terraform-operations.yml@main
    with:
      action: "destroy"
      tf_dir: "${{ needs.config.outputs.infra_prefix }}/third-party/elastic"
      bucket: ${{ needs.config.outputs.bucket }}
      state_key: "infra/${{ needs.config.outputs.project_key }}/third-party/elastic.tfstate"
      stage_key: ${{ needs.config.outputs.stage_key }}
      aws_region: ${{ needs.config.outputs.aws_region }}
      client_key: ${{ needs.config.outputs.client_key }}
      project_key: ${{ needs.config.outputs.project_key }}
      namespace: ${{ needs.config.outputs.namespace }}
      cloud_platform: ${{ inputs.cloud_provider }}
      domain_root: ${{ needs.config.outputs.domain_root }}
      environment: ${{ inputs.environment }}
      wif_audience: ${{ inputs.wif_audience || vars.WIF_AUDIENCE }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      EC_API_KEY: ${{ secrets.EC_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}

  destroy-tunnel:
    permissions:
      contents: read
      id-token: write
    if: ${{ inputs.environment == 'dev-mini' && inputs.mode != 'quick-test' && needs.check-states.outputs.tunnel_exists == 'true' }}
    name: "🧨 Destroy Tunnel"

    needs: [config, destroy-app, check-states]
    uses: thisisblaze/blaze-actions/.github/workflows/reusable-terraform-operations.yml@main
    with:
      action: "destroy"
      tf_dir: "${{ needs.config.outputs.infra_prefix }}/third-party/cloudflare"
      bucket: ${{ needs.config.outputs.bucket }}
      state_key: "infra/${{ needs.config.outputs.project_key }}/third-party/cloudflare.tfstate"
      stage_key: ${{ needs.config.outputs.stage_key }}
      aws_region: ${{ needs.config.outputs.aws_region }}
      client_key: ${{ needs.config.outputs.client_key }}
      project_key: ${{ needs.config.outputs.project_key }}
      namespace: ${{ needs.config.outputs.namespace }}
      cloud_platform: ${{ inputs.cloud_provider }}
      domain_root: ${{ needs.config.outputs.domain_root }}
      environment: ${{ inputs.environment }}
      wif_audience: ${{ inputs.wif_audience || vars.WIF_AUDIENCE }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      GH_PAT: ${{ secrets.GH_PAT }}

  # --------------------------------------------------------------------------------
  # 3.5 PRE-NETWORK DESTROY: Force-clear orphaned SGs/ENIs left by app stack
  #     (AWS only — mirrors 99-nuke-env Step 4 to unblock subnet/IGW deletion)
  # --------------------------------------------------------------------------------
  cleanup-vpc-orphans:
    permissions:
      contents: read
      id-token: write
    if: |
      always() &&
      inputs.mode != 'quick-test' &&
      inputs.cloud_provider == 'aws' &&
      inputs.preserve_host != true &&
      inputs.target_type == 'host' &&
      needs.check-states.outputs.network_exists == 'true' &&
      (needs.destroy-app.result == 'success' || needs.destroy-app.result == 'skipped')
    name: "🧹 Cleanup VPC Orphans (Pre-Network Destroy)"
    needs: [config, destroy-app, destroy-tunnel, destroy-data-pod, check-states]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37     # v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ needs.config.outputs.aws_region || 'eu-west-1' }}

      - name: "Force-Delete Orphaned SGs + ENIs (Unblocks VPC)"
        run: |
          REGION="${{ needs.config.outputs.aws_region || 'eu-west-1' }}"
          BLAZE_ENV="${{ inputs.environment }}"
          BLAZE_PROJECT="${{ needs.config.outputs.project_key }}"
          NAMESPACE="${{ needs.config.outputs.namespace || 'blaze' }}"
          CLIENT_KEY="${{ needs.config.outputs.client_key || 'b9' }}"
          RESOURCE_PREFIX="${NAMESPACE}-${CLIENT_KEY}-${BLAZE_PROJECT}-${BLAZE_ENV}"

          # ── Find VPC: tag-first (Blaze tags), then Name tag fallback ────────
          # v1.4.94+: Blaze:Architecture+Project+Environment tags used first.
          # Fallback: Name tag convention blaze-b9-{project}-{env}-vpc (all stacks).
          # NOTE: CIDR-based fallback removed (v1.4.95) — CIDR is not unique across
          # environments (e.g. dev and multi-site may share the same CIDR range).
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters \
              "Name=tag:Blaze:Architecture,Values=two-pillar-v2" \
              "Name=tag:Blaze:Project,Values=${BLAZE_PROJECT}" \
              "Name=tag:Blaze:Environment,Values=${BLAZE_ENV}" \
            --region "$REGION" \
            --query 'Vpcs[0].VpcId' \
            --output text 2>/dev/null || echo "")

          if [[ -z "$VPC_ID" || "$VPC_ID" == "None" ]]; then
            echo "⚠️  Tag-based VPC not found — falling back to Name tag lookup"
            TAG_VALUE="blaze-b9-${BLAZE_PROJECT}-${BLAZE_ENV}"
            VPC_ID=$(aws ec2 describe-vpcs \
              --filters "Name=tag:Name,Values=${TAG_VALUE}-vpc" \
              --region "$REGION" \
              --query 'Vpcs[0].VpcId' \
              --output text 2>/dev/null || echo "")
          fi

          if [[ -z "$VPC_ID" || "$VPC_ID" == "None" ]]; then
            echo "ℹ️  VPC not found — nothing to clean up, Terraform destroy will handle it"
            exit 0
          fi

          echo "🔍 Found VPC: $VPC_ID"

          # ══════════════════════════════════════════════════════════════════
          # DEPENDENCY TEARDOWN ORDER (architectural):
          #  0a. Suspend ASGs       → prevents instance replacement
          #  0b. Scale ECS to 0     → drains ECS task ENIs
          #  0c. Delete LBs         → removes ENIs in subnets + frees lb_sg
          #  0d. Terminate EC2      → releases instance EIPs + ENIs
          #  0e. Wait for ECS trunk ENI drain (awsvpc trunking)
          #  1.  Delete NAT GWs     → releases NAT EIPs
          #  2.  Release EIPs       → VPC-scoped: NAT GW + EC2 + ENI queries
          #                           (describe-addresses has NO vpc-id filter)
          #  2b. Verify IGW unmap   → poll until no mapped public addresses
          #  3.  Force-detach ENIs  → clears all remaining subnet dependencies
          #  4a. Revoke ALL SG rules (all SGs first — breaks circular refs)
          #  4b. Delete ALL SGs     (second pass — all cross-refs already gone)
          #  → Terraform: subnets / route tables / IGW / VPC
          # ══════════════════════════════════════════════════════════════════

          # ── Step 0a: Suspend ASGs (prevent Graviton CP replacement) ──────
          echo "🗑️  Suspending Auto Scaling Groups..."
          ASG_NAMES=$(aws autoscaling describe-auto-scaling-groups \
            --region "$REGION" \
            --query "AutoScalingGroups[?contains(VPCZoneIdentifier, '${VPC_ID}')].AutoScalingGroupName" \
            --output text 2>/dev/null || echo "")
          if [[ -z "$ASG_NAMES" || "$ASG_NAMES" == "None" ]]; then
            ASG_NAMES=$(aws autoscaling describe-auto-scaling-groups \
              --region "$REGION" \
              --query "AutoScalingGroups[?starts_with(AutoScalingGroupName, '${RESOURCE_PREFIX}-')].AutoScalingGroupName" \
              --output text 2>/dev/null || echo "")
          fi
          if [[ -n "$ASG_NAMES" && "$ASG_NAMES" != "None" ]]; then
            for ASG_NAME in $ASG_NAMES; do
              echo "   → Suspending: $ASG_NAME"
              aws autoscaling suspend-processes \
                --auto-scaling-group-name "$ASG_NAME" \
                --scaling-processes Launch Terminate ReplaceUnhealthy AZRebalance \
                --region "$REGION" 2>/dev/null && echo "   ✅ Suspended" || true
              aws autoscaling update-auto-scaling-group \
                --auto-scaling-group-name "$ASG_NAME" \
                --min-size 0 --desired-capacity 0 \
                --region "$REGION" 2>/dev/null && echo "   ✅ Scaled to 0" || true
            done
          else
            echo "   ℹ️  No ASGs found"
          fi

          # ── Step 0b: Scale all ECS services to 0 and FORCE STOP tasks ──────
          echo "🗑️  Scaling ECS services to 0 and stopping tasks..."
          ECS_CLUSTERS=$(aws ecs list-clusters \
            --region "$REGION" \
            --query 'clusterArns[]' \
            --output text 2>/dev/null || echo "")
          for CLUSTER_ARN in $ECS_CLUSTERS; do
            CLUSTER_NAME=$(echo "$CLUSTER_ARN" | awk -F'/' '{print $NF}')
            # Only touch clusters in our environment
            [[ "$CLUSTER_NAME" != *"${RESOURCE_PREFIX}"* ]] && continue
            echo "   → Cluster: $CLUSTER_NAME"
            SVC_ARNS=$(aws ecs list-services --cluster "$CLUSTER_ARN" \
              --region "$REGION" --query 'serviceArns[]' --output text 2>/dev/null || echo "")
            for SVC_ARN in $SVC_ARNS; do
              SVC_NAME=$(echo "$SVC_ARN" | awk -F'/' '{print $NF}')
              aws ecs update-service --cluster "$CLUSTER_ARN" --service "$SVC_ARN" \
                --desired-count 0 --region "$REGION" 2>/dev/null \
                && echo "     ✅ $SVC_NAME → 0" || true
            done
            
            echo "   → Force stopping all tasks in $CLUSTER_NAME..."
            TASK_ARNS=$(aws ecs list-tasks --cluster "$CLUSTER_ARN" --region "$REGION" --query 'taskArns[]' --output text 2>/dev/null || echo "")
            for TASK_ARN in $TASK_ARNS; do
              aws ecs stop-task --cluster "$CLUSTER_ARN" --task "$TASK_ARN" --reason "Forced Teardown" --region "$REGION" 2>/dev/null \
                && echo "     ✅ Stopped task $(echo "$TASK_ARN" | awk -F'/' '{print $NF}')" || true
            done
          done
          if [[ -n "$ECS_CLUSTERS" && "$ECS_CLUSTERS" != "None" ]]; then
            echo "   ⏳ Waiting 30s for ECS tasks to drain completely..."
            sleep 30
          fi

          # ── Step 0c: Delete Load Balancers (CRITICAL — holds lb_sg + subnet ENIs) ─
          # ALBs are part of the network module (module.environment_network.aws_security_group.lb_sg)
          # and block subnet + SG deletion. Must delete before Terraform runs.
          echo "🗑️  Deleting Load Balancers in VPC..."
          LB_ARNS=$(aws elbv2 describe-load-balancers \
            --region "$REGION" \
            --query "LoadBalancers[?VpcId=='${VPC_ID}'].LoadBalancerArn" \
            --output text 2>/dev/null || echo "")
          for LB_ARN in $LB_ARNS; do
            LB_NAME=$(aws elbv2 describe-load-balancers \
              --load-balancer-arns "$LB_ARN" --region "$REGION" \
              --query 'LoadBalancers[0].LoadBalancerName' --output text 2>/dev/null)
            echo "   → Deleting LB: $LB_NAME ($LB_ARN)"
            aws elbv2 delete-load-balancer --load-balancer-arn "$LB_ARN" \
              --region "$REGION" 2>/dev/null \
              && echo "   ✅ Deleted" || echo "   ⚠️  Could not delete $LB_NAME"
          done
          # Also clean up classic ELBs
          CLB_NAMES=$(aws elb describe-load-balancers \
            --region "$REGION" \
            --query "LoadBalancerDescriptions[?VPCId=='${VPC_ID}'].LoadBalancerName" \
            --output text 2>/dev/null || echo "")
          for CLB_NAME in $CLB_NAMES; do
            echo "   → Deleting CLB: $CLB_NAME"
            aws elb delete-load-balancer --load-balancer-name "$CLB_NAME" \
              --region "$REGION" 2>/dev/null \
              && echo "   ✅ Deleted" || true
          done
          if [[ -n "$LB_ARNS" || -n "$CLB_NAMES" ]]; then
            echo "   ⏳ Waiting 30s for LB deletion + ENI release..."
            sleep 30
          fi

          # ── Step 0d: Terminate EC2 instances (Graviton CP EIPs) ──────────
          echo "🗑️  Terminating running EC2 instances in VPC..."
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=vpc-id,Values=$VPC_ID" "Name=instance-state-name,Values=running,stopping,pending" \
            --region "$REGION" \
            --query 'Reservations[*].Instances[*].InstanceId' \
            --output text 2>/dev/null || echo "")
          if [[ -n "$INSTANCE_IDS" && "$INSTANCE_IDS" != "None" ]]; then
            echo "   → Found: $INSTANCE_IDS"
            aws ec2 terminate-instances --instance-ids $INSTANCE_IDS --region "$REGION" 2>/dev/null \
              && echo "   ✅ Termination initiated" || echo "   ⚠️  Could not terminate"
            echo "   ⏳ Waiting for confirmed termination..."
            aws ec2 wait instance-terminated \
              --instance-ids $INSTANCE_IDS --region "$REGION" 2>/dev/null \
              && echo "   ✅ Instances terminated" \
              || echo "   ⚠️  Wait timed out — proceeding"
          else
            echo "   ℹ️  No running instances"
          fi

          # ── Step 0e: Wait for ECS trunk ENI drain (CRITICAL for awsvpc mode) ──
          # ECS VPC trunking (EC2 + awsvpc) creates trunk ENIs attached to Graviton
          # instances. These ENIs are managed by the ECS control plane and persist
          # 2-5 min after instance termination even after aws ec2 wait instance-terminated.
          # Force-detaching trunk ENIs is not possible (API error: cannot detach trunk).
          # We must poll until ECS releases them before Destroy Network runs.
          echo "   ⏳ Polling for ECS trunk ENI drain (max 5 min)..."
          TRUNK_WAIT=0
          TRUNK_MAX=300  # 5 minutes
          while true; do
            TRUNK_ENI_COUNT=$(aws ec2 describe-network-interfaces \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=interface-type,Values=trunk" \
              --region "$REGION" \
              --query 'length(NetworkInterfaces)' \
              --output text 2>/dev/null || echo "0")
            ECS_ENI_COUNT=$(aws ec2 describe-network-interfaces \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=description,Values=arn:aws:ecs:*" \
              --region "$REGION" \
              --query 'length(NetworkInterfaces)' \
              --output text 2>/dev/null || echo "0")
            TRUNK_ENI_COUNT="${TRUNK_ENI_COUNT//None/0}"
            ECS_ENI_COUNT="${ECS_ENI_COUNT//None/0}"
            TOTAL=$((TRUNK_ENI_COUNT + ECS_ENI_COUNT))
            if [[ "$TOTAL" -eq 0 ]]; then
              echo "   ✅ All ECS/trunk ENIs released (${TRUNK_WAIT}s elapsed)"
              break
            fi
            if [[ "$TRUNK_WAIT" -ge "$TRUNK_MAX" ]]; then
              echo "   ⚠️  ECS ENI drain timed out after ${TRUNK_WAIT}s — ${TRUNK_ENI_COUNT} trunk + ${ECS_ENI_COUNT} ECS ENIs remain"
              echo "      Proceeding — Step 3 force-detach will attempt cleanup"
              break
            fi
            echo "   ⌛ ${TRUNK_ENI_COUNT} trunk + ${ECS_ENI_COUNT} ECS ENIs still attached (${TRUNK_WAIT}s elapsed)..."
            sleep 10
            TRUNK_WAIT=$((TRUNK_WAIT + 10))
          done

          # ── Step 1: Delete NAT Gateways ────────────────────────────────
          echo "🗑️  Deleting NAT Gateways..."
          NGW_IDS=$(aws ec2 describe-nat-gateways \
            --filter "Name=vpc-id,Values=$VPC_ID" "Name=state,Values=available,pending" \
            --region "$REGION" \
            --query 'NatGateways[*].NatGatewayId' \
            --output text 2>/dev/null || echo "")
          for NGW_ID in $NGW_IDS; do
            echo "   → Deleting NAT GW: $NGW_ID"
            aws ec2 delete-nat-gateway --nat-gateway-id "$NGW_ID" --region "$REGION" 2>/dev/null \
              && echo "   ✅ Deleted" || echo "   ⚠️  Could not delete $NGW_ID"
          done
          if [[ -n "$NGW_IDS" && "$NGW_IDS" != "None" && "$NGW_IDS" != "" ]]; then
            echo "   ⏳ Waiting 30s for NAT GW deletion..."
            sleep 30
          fi


          # ── Step 2: Disassociate + Release ALL EIPs — VPC-scoped ─────────────
          # CRITICAL FIX (v1.4.93): aws ec2 describe-addresses has NO vpc-id filter.
          # Account-wide query silently misses EIPs mapped to OUR IGW.
          # Strategy: enumerate EIPs via NAT GWs + EC2 instances in this VPC,
          # then catch any remaining via ENI→VPC association client-side check.
          echo "🗑️  Discovering and releasing EIPs scoped to VPC $VPC_ID..."
          ALLOC_IDS=()

          # NAT Gateway EIPs (most common cause of IGW 'mapped public address' error)
          NGW_EIPS=$(aws ec2 describe-nat-gateways \
            --filter "Name=vpc-id,Values=$VPC_ID" \
            --region "$REGION" \
            --query 'NatGateways[*].NatGatewayAddresses[*].AllocationId' \
            --output text 2>/dev/null || echo "")
          for EIP in $NGW_EIPS; do
            [[ -n "$EIP" && "$EIP" != "None" ]] && ALLOC_IDS+=("$EIP")
          done

          # EC2 instance EIPs (Graviton ASG instances)
          EC2_EIPS=$(aws ec2 describe-instances \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --region "$REGION" \
            --query 'Reservations[*].Instances[*].NetworkInterfaces[*].Association.AllocationId' \
            --output text 2>/dev/null || echo "")
          for EIP in $EC2_EIPS; do
            [[ -n "$EIP" && "$EIP" != "None" ]] && ALLOC_IDS+=("$EIP")
          done

          # Catch-all: EIPs associated with ENIs in our VPC (e.g. IGW-mapped EIPs)
          while IFS=$'\t' read -r ALLOC NIC; do
            [[ -z "$ALLOC" || "$ALLOC" == "None" || -z "$NIC" || "$NIC" == "None" ]] && continue
            NIC_VPC=$(aws ec2 describe-network-interfaces \
              --network-interface-ids "$NIC" --region "$REGION" \
              --query 'NetworkInterfaces[0].VpcId' --output text 2>/dev/null || echo "")
            [[ "$NIC_VPC" == "$VPC_ID" ]] && ALLOC_IDS+=("$ALLOC")
          done < <(aws ec2 describe-addresses \
            --filters "Name=domain,Values=vpc" \
            --region "$REGION" \
            --query 'Addresses[?NetworkInterfaceId!=null].[AllocationId,NetworkInterfaceId]' \
            --output text 2>/dev/null || true)

          # Deduplicate
          ALLOC_IDS=($(printf '%s\n' "${ALLOC_IDS[@]}" | sort -u))
          echo "   Found ${#ALLOC_IDS[@]} EIPs associated with VPC $VPC_ID"

          for ALLOC_ID in "${ALLOC_IDS[@]}"; do
            ASSOC_ID=$(aws ec2 describe-addresses \
              --allocation-ids "$ALLOC_ID" --region "$REGION" \
              --query 'Addresses[0].AssociationId' --output text 2>/dev/null || echo "")
            if [[ -n "$ASSOC_ID" && "$ASSOC_ID" != "None" ]]; then
              echo "   → Disassociating EIP $ALLOC_ID (assoc: $ASSOC_ID)..."
              aws ec2 disassociate-address --association-id "$ASSOC_ID" --region "$REGION" 2>/dev/null || true
              echo "     ⏳ Waiting 10s for disassociation to propagate..."
              sleep 10
            fi
            echo "   → Releasing EIP: $ALLOC_ID"
            RELEASED=false
            for ATTEMPT in 1 2 3; do
              if aws ec2 release-address --allocation-id "$ALLOC_ID" --region "$REGION" 2>/dev/null; then
                echo "   ✅ Released (attempt $ATTEMPT)"
                RELEASED=true
                break
              fi
              echo "   ⏳ Release attempt $ATTEMPT failed — waiting 8s..."
              sleep 8
            done
            [[ "$RELEASED" == "false" ]] && echo "   ⚠️  Could not release $ALLOC_ID after 3 attempts"
          done

          # ── Step 2b: Verify IGW has no mapped public addresses before Terraform ─
          # IGW detach fails if VPC still has mapped public addresses (EIPs).
          # Poll until clear (max 60s) — gives AWS time to propagate EIP releases.
          if [[ ${#ALLOC_IDS[@]} -gt 0 ]]; then
            echo "   ⏳ Waiting for IGW public address unmap propagation (max 60s)..."
            IGW_WAIT=0
            while [[ $IGW_WAIT -lt 60 ]]; do
              IGW_ID=$(aws ec2 describe-internet-gateways \
                --filters "Name=attachment.vpc-id,Values=$VPC_ID" \
                --region "$REGION" \
                --query 'InternetGateways[0].InternetGatewayId' \
                --output text 2>/dev/null || echo "")
              if [[ -z "$IGW_ID" || "$IGW_ID" == "None" ]]; then
                echo "   ✅ No IGW found (already detached or never existed)"
                break
              fi
              # Check for EIPs still referencing ENIs in our VPC
              REMAINING_EIPS=$(aws ec2 describe-addresses \
                --filters "Name=domain,Values=vpc" \
                --region "$REGION" \
                --query 'Addresses[?AssociationId!=null] | length(@)' \
                --output text 2>/dev/null || echo "0")
              if [[ "${REMAINING_EIPS:-0}" -eq 0 ]]; then
                echo "   ✅ All EIPs released — IGW unmapped (${IGW_WAIT}s)"
                break
              fi
              echo "   ⌛ ${REMAINING_EIPS} EIPs still associated (${IGW_WAIT}s elapsed)..."
              sleep 10; IGW_WAIT=$((IGW_WAIT + 10))
            done
          fi

          # ── Step 3: Force-detach + delete all ENIs in VPC ────────────────────
          echo "🗑️  Force-detaching and deleting orphaned ENIs in VPC..."
          while IFS=$'\t' read -r ENI_ID ATTACH_ID STATUS; do
            [[ -z "$ENI_ID" || "$ENI_ID" == "None" ]] && continue
            echo "   → ENI: $ENI_ID (status=$STATUS)"
            if [[ -n "$ATTACH_ID" && "$ATTACH_ID" != "None" && "$STATUS" == "in-use" ]]; then
              echo "     Force-detaching attachment $ATTACH_ID..."
              aws ec2 detach-network-interface --attachment-id "$ATTACH_ID" --force --region "$REGION" 2>/dev/null \
                && echo "     ✅ Detached — waiting 8s..." && sleep 8 \
                || echo "     ⚠️  Detach failed (will retry delete anyway)"
            fi
            aws ec2 delete-network-interface --network-interface-id "$ENI_ID" --region "$REGION" 2>/dev/null \
              && echo "     ✅ Deleted" || echo "     ⚠️  Could not delete $ENI_ID"
          done < <(aws ec2 describe-network-interfaces \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --region "$REGION" \
            --query 'NetworkInterfaces[*].[NetworkInterfaceId,Attachment.AttachmentId,Status]' \
            --output text 2>/dev/null || true)

          # ── Step 4a: Revoke ALL SG rules (all SGs first — breaks circular refs) ──
          # CRITICAL FIX (v1.4.93): The previous single-pass loop failed because
          # SG-A→SG-B cross-references prevented deletion while the other SG still
          # referenced it. Two-pass: revoke all rules across all SGs first, then delete.
          echo "🗑️  Pass 1/2 — Revoking all SG rules (breaks circular cross-references)..."
          SG_IDS=$(aws ec2 describe-security-groups \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --region "$REGION" \
            --query 'SecurityGroups[?GroupName!=`default`].GroupId' \
            --output text 2>/dev/null || echo "")
          for SG_ID in $SG_IDS; do
            echo "   → Revoking rules for SG: $SG_ID"
            INGRESS=$(aws ec2 describe-security-groups --group-ids "$SG_ID" --region "$REGION" \
              --query 'SecurityGroups[0].IpPermissions' --output json 2>/dev/null || echo "[]")
            if [[ "$INGRESS" != "[]" && "$INGRESS" != "null" ]]; then
              aws ec2 revoke-security-group-ingress --group-id "$SG_ID" --region "$REGION" \
                --ip-permissions "$INGRESS" 2>/dev/null && echo "     ✅ Ingress revoked" || true
            fi
            EGRESS=$(aws ec2 describe-security-groups --group-ids "$SG_ID" --region "$REGION" \
              --query 'SecurityGroups[0].IpPermissionsEgress' --output json 2>/dev/null || echo "[]")
            if [[ "$EGRESS" != "[]" && "$EGRESS" != "null" ]]; then
              aws ec2 revoke-security-group-egress --group-id "$SG_ID" --region "$REGION" \
                --ip-permissions "$EGRESS" 2>/dev/null && echo "     ✅ Egress revoked" || true
            fi
          done
          echo "   ✅ All SG rules revoked"

          # ── Step 4b: Delete ALL SGs (second pass — no cross-refs remain) ─────
          echo "🗑️  Pass 2/2 — Deleting all Security Groups..."
          for SG_ID in $SG_IDS; do
            echo "   → Deleting SG: $SG_ID"
            aws ec2 delete-security-group --group-id "$SG_ID" --region "$REGION" 2>/dev/null \
              && echo "   ✅ Deleted" || echo "   ⚠️  Could not delete $SG_ID"
          done

          echo "✅ VPC orphan cleanup complete — Terraform destroy should now proceed cleanly"


  destroy-network:
    permissions:
      contents: read
      id-token: write
    if: ${{ always() && inputs.mode != 'quick-test' && inputs.preserve_host != true && inputs.target_type == 'host' && needs.check-states.outputs.network_exists == 'true' && (needs.destroy-app.result == 'success' || needs.destroy-app.result == 'skipped') }}
    name: "🧨 Destroy Network"

    needs: [config, destroy-app, cleanup-vpc-orphans, destroy-tunnel, 
          destroy-data-pod, check-states]
    uses: thisisblaze/blaze-actions/.github/workflows/reusable-terraform-operations.yml@main
    with:
      action: "destroy"
      tf_dir: ${{ inputs.network_stack == 'multi-site-network' && 
        format('{0}/multi-site-network', needs.config.outputs.infra_prefix) || 
        format('{0}/{1}-network', needs.config.outputs.infra_prefix, 
        inputs.environment) }}
      bucket: ${{ needs.config.outputs.bucket }}
      state_key: ${{ inputs.network_stack == 'multi-site-network' && 
        format('infra/{0}/multi-site/network.tfstate', 
        needs.config.outputs.project_key) || 
        format('infra/{0}/{1}/network.tfstate', 
        needs.config.outputs.project_key, needs.config.outputs.stage_key) }}
      stage_key: ${{ needs.config.outputs.stage_key }}
      aws_region: ${{ needs.config.outputs.aws_region }}
      client_key: ${{ needs.config.outputs.client_key }}
      project_key: ${{ needs.config.outputs.project_key }}
      namespace: ${{ needs.config.outputs.namespace }}
      cloud_platform: ${{ inputs.cloud_provider }}
      domain_root: ${{ needs.config.outputs.domain_root }}
      environment: ${{ inputs.environment }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      GH_PAT: ${{ secrets.GH_PAT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACM_CERTIFICATE_ARN: ${{ secrets.ACM_CERTIFICATE_ARN }}

  # --------------------------------------------------------------------------------
  # 4. POST-DESTROY STATE FIX
  # Terraform destroy writes the empty state to S3 but the DynamoDB digest is not
  # updated atomically, causing "state data in S3 does not have the expected content"
  # on the very next provision run. Fix: read the actual S3 checksum and write it
  # to DynamoDB so the next terraform init succeeds cleanly.
  # Also: delete the orphaned ECS Capacity Provider left after network destroy
  # (the CP is outside the network Terraform state but blocks re-provision).
  # --------------------------------------------------------------------------------
  post-destroy-state-fix:
    permissions:
      contents: read
      id-token: write
    if: |
      always() &&
      inputs.cloud_provider == 'aws' &&
      inputs.target_type == 'host' &&
      needs.destroy-network.result == 'success'
    name: "🔧 Post-Destroy State Fix"
    needs: [config, destroy-network]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37     # v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ needs.config.outputs.aws_region || 'eu-west-1' }}

      - name: Fix DynamoDB State Digests (All Destroyed Stacks)
        env:
          REGION: ${{ needs.config.outputs.aws_region || 'eu-west-1' }}
          BUCKET: ${{ needs.config.outputs.bucket }}
          PROJECT_KEY: ${{ needs.config.outputs.project_key }}
          STAGE_KEY: ${{ needs.config.outputs.stage_key }}
          LOCK_TABLE: ${{ needs.config.outputs.lock_table || 
            format('b9-{0}-blaze-tfstate-lock', needs.config.outputs.stage_key) 
            }}
          IS_MULTI_SITE: ${{ inputs.network_stack == 'multi-site-network' && 'true' || 'false' }}
        run: |
          echo "🔧 Syncing DynamoDB digest for ALL destroyed state files..."
          echo "   Bucket:   $BUCKET"
          echo "   DynamoDB: $LOCK_TABLE"

          # Build list of all state keys that were potentially destroyed in this run.
          # Multi-site uses infra/<project>/multi-site/<stack>.tfstate
          # Non-multi-site uses infra/<project>/<stage>/<stack>.tfstate
          if [[ "$IS_MULTI_SITE" == "true" ]]; then
            STATE_KEYS=(
              "infra/${PROJECT_KEY}/multi-site/network.tfstate"
              "infra/${PROJECT_KEY}/multi-site/app.tfstate"
              "infra/${PROJECT_KEY}/multi-site/db-pod-alpha.tfstate"
            )
          else
            STATE_KEYS=(
              "infra/${PROJECT_KEY}/${STAGE_KEY}/network.tfstate"
              "infra/${PROJECT_KEY}/${STAGE_KEY}/app.tfstate"
              "infra/${PROJECT_KEY}/${STAGE_KEY}/tenant-app.tfstate"
              "infra/${PROJECT_KEY}/${STAGE_KEY}/db-pod-alpha.tfstate"
            )
          fi

          # Helper: sync one state key's DynamoDB digest with its actual S3 ETag
          fix_digest() {
            local KEY="$1"
            local ACTUAL_MD5

            ACTUAL_MD5=$(aws s3api head-object \
              --bucket "$BUCKET" --key "$KEY" --region "$REGION" \
              --query 'ETag' --output text 2>/dev/null | tr -d '"' || echo "")

            if [[ -z "$ACTUAL_MD5" || "$ACTUAL_MD5" == "None" || "$ACTUAL_MD5" == "null" ]]; then
              echo "   ℹ️  $KEY — not in S3 (skipping)"
              return 0
            fi

            local LOCK_ID="${BUCKET}/${KEY}-md5"

            # Check what DynamoDB currently has
            STORED_MD5=$(aws dynamodb get-item \
              --region "$REGION" --table-name "$LOCK_TABLE" \
              --key "{\"LockID\":{\"S\":\"${LOCK_ID}\"}}" \
              --query 'Item.Digest.S' --output text 2>/dev/null || echo "")

            if [[ "$STORED_MD5" == "$ACTUAL_MD5" ]]; then
              echo "   ✅ $KEY — digest already correct ($ACTUAL_MD5)"
              return 0
            fi

            echo "   → $KEY"
            echo "     S3 ETag (actual):  $ACTUAL_MD5"
            echo "     DynamoDB (stored): ${STORED_MD5:-MISSING}"

            aws dynamodb put-item \
              --region "$REGION" --table-name "$LOCK_TABLE" \
              --item "{\"LockID\":{\"S\":\"${LOCK_ID}\"},\"Digest\":{\"S\":\"${ACTUAL_MD5}\"}}" \
              2>/dev/null \
              && echo "     ✅ Updated" \
              || echo "     ⚠️  Could not write — next provision may hit mismatch"
          }

          for KEY in "${STATE_KEYS[@]}"; do
            fix_digest "$KEY"
          done
          echo "✅ Digest sync complete"

      - name: Delete Orphaned ECS Capacity Provider
        env:
          REGION: ${{ needs.config.outputs.aws_region || 'eu-west-1' }}
          NAMESPACE: ${{ needs.config.outputs.namespace }}
          CLIENT_KEY: ${{ needs.config.outputs.client_key }}
          PROJECT_KEY: ${{ needs.config.outputs.project_key }}
          STAGE_KEY: ${{ needs.config.outputs.stage_key }}
        run: |
          # CP name format: blaze-{client}-{project}-{stage}-ecs-ec2-cp
          CP_NAME="blaze-${CLIENT_KEY}-${PROJECT_KEY}-${STAGE_KEY}-ecs-ec2-cp"
          echo "🔧 Checking for orphaned ECS Capacity Provider: $CP_NAME"

          CP_STATUS=$(aws ecs describe-capacity-providers \
            --capacity-providers "$CP_NAME" \
            --region "$REGION" \
            --query 'capacityProviders[0].status' \
            --output text 2>/dev/null || echo "NONE")

          if [[ "$CP_STATUS" == "NONE" || "$CP_STATUS" == "None" || -z "$CP_STATUS" ]]; then
            echo "   ℹ️  CP not found — nothing to clean up"
            exit 0
          fi

          echo "   → CP exists with status: $CP_STATUS — deleting..."

          # Find cluster and detach CP first
          CLUSTER_NAME="${NAMESPACE}-${PROJECT_KEY}-${STAGE_KEY}-cluster"
          CLUSTER_ARN=$(aws ecs describe-clusters --clusters "$CLUSTER_NAME" \
            --region "$REGION" --query 'clusters[0].clusterArn' \
            --output text 2>/dev/null || echo "")

          if [[ -n "$CLUSTER_ARN" && "$CLUSTER_ARN" != "None" ]]; then
            echo "   → Detaching CP from cluster: $CLUSTER_NAME"
            aws ecs put-cluster-capacity-providers \
              --cluster "$CLUSTER_ARN" \
              --capacity-providers FARGATE FARGATE_SPOT \
              --default-capacity-provider-strategy capacityProvider=FARGATE,weight=1,base=1 \
              --region "$REGION" 2>/dev/null \
              && echo "   ✅ Detached from cluster" || echo "   ⚠️  Detach failed (proceeding to delete)"
            sleep 10
          fi

          aws ecs delete-capacity-provider \
            --capacity-provider "$CP_NAME" \
            --region "$REGION" 2>/dev/null \
            && echo "   ✅ CP deletion initiated: $CP_NAME" \
            || echo "   ⚠️  Could not delete CP (provision pre_apply will handle it)"

          # Poll for deletion (max 3 min)
          for WAIT in $(seq 1 36); do
            CP_STATUS=$(aws ecs describe-capacity-providers \
              --capacity-providers "$CP_NAME" --region "$REGION" \
              --query 'capacityProviders[0].status' --output text 2>/dev/null || echo "NONE")
            [[ "$CP_STATUS" == "NONE" || "$CP_STATUS" == "None" || -z "$CP_STATUS" ]] \
              && echo "   ✅ CP fully deleted (after $((WAIT * 5))s)" && break
            echo "   ⌛ CP still $CP_STATUS — waiting 5s ($((WAIT * 5))s elapsed)..."
            sleep 5
          done

          echo "✅ Post-destroy state fix complete"

