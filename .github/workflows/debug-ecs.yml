name: Debug ECS
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::930976658068:role/blaze-github-actions-role
          aws-region: eu-west-1
      - run: aws ecs list-clusters
      - run: aws ecs list-services --cluster blaze-thisisblaze-dev
      - run: aws resourcegroupstaggingapi get-resources --resource-type-filters ecs:service --tag-filters "Key=blaze:service,Values=api"
